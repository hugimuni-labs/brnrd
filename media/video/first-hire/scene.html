<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brnrd — first hire</title>
<!--
  "Your first hire doesn't have to be a hire." A 55 s, 1080x1920, 30 fps
  motion piece for small-business owners. Every frame is a pure function of
  time: window.render(t) poses the whole stage, render.mjs screenshots it
  frame by frame. Open with ?t=23.4 to inspect a single moment.
-->
<style>
:root{
  --butter:#F6E7A7; --powder:#BFDDF2; --ice:#EEF7FC; --off:#FFFDF5; --ink:#36576A;
  --ink2:#6F8C9C; --pale:#E3ECF1; --coral:#E7765F; --leaf:#7DAE8B; --bar:#8EC3E6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--off)}
body{font-family:"Avenir Next","Avenir",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%}
.txt{white-space:nowrap;text-align:center;line-height:1.05;letter-spacing:-.005em}
.lbl{font-weight:800;letter-spacing:.14em;color:var(--ink2)}
.hl{background-image:linear-gradient(var(--butter),var(--butter));background-repeat:no-repeat;
    background-position:0 90%;background-size:0% 40%;padding:0 .06em;border-radius:.08em}
.hl.w{background-image:linear-gradient(var(--off),var(--off))}
.card{background:#fff;border-radius:28px;
      box-shadow:0 14px 34px rgba(54,87,106,.11),0 2px 6px rgba(54,87,106,.07)}
svg{display:block}
.ic svg,.pi svg,.ti svg{width:60%;height:60%;fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* the face: brnrd set as type, awake frame b^n^d */
.face{font-weight:800;letter-spacing:.02em;white-space:nowrap;color:var(--ink);line-height:1}

/* pill: a job */
.pill{display:flex;align-items:center;gap:16px;padding:14px 30px 14px 16px;min-height:92px;
      border-radius:26px;font-size:30px;font-weight:800;letter-spacing:.04em;white-space:nowrap;line-height:1.05}
.pill .pi{width:60px;height:60px;border-radius:18px;background:var(--ice);display:grid;place-items:center;flex:none}
.nd{position:absolute;right:-14px;top:-14px;min-width:42px;height:42px;border-radius:21px;background:var(--coral);
    color:#fff;font-size:21px;font-weight:800;display:grid;place-items:center;border:4px solid var(--off);
    padding:0 7px;transform:scale(0);letter-spacing:0}
.nd.ok{background:var(--butter);color:var(--ink)}
.nd svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

/* task card: a piece of work with state */
.task{display:flex;align-items:center;gap:22px;padding:0 28px 0 22px;overflow:visible}
.task .glow{position:absolute;inset:0;border-radius:inherit;background:var(--butter);opacity:0}
.task>*:not(.glow){position:relative}
.task .ti{width:64px;height:64px;border-radius:18px;background:var(--ice);display:grid;place-items:center;flex:none}
.task .t1{font-size:30px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.task .t2{font-size:23px;font-weight:600;color:var(--ink2);margin-top:3px;white-space:nowrap}
.task .ts{margin-left:auto;display:grid;justify-items:end}
.task .ts span{grid-area:1/1;height:42px;padding:0 16px;border-radius:21px;font-size:19px;font-weight:800;
      letter-spacing:.1em;display:flex;align-items:center;white-space:nowrap}
.task .p{background:var(--ice);color:var(--ink2)}
.task .f{background:var(--butter);color:var(--ink)}
.task .bar{position:absolute!important;left:108px;right:28px;bottom:12px;height:6px;border-radius:3px;background:var(--ice);overflow:hidden;opacity:0}
.task .bar i{display:block;height:100%;width:0;background:var(--bar);border-radius:3px}
.task .ck{position:absolute!important;right:-14px;top:-14px;width:46px;height:46px;border-radius:50%;background:var(--butter);
      box-shadow:0 4px 10px rgba(54,87,106,.15);display:grid;place-items:center;transform:scale(0)}
.task .ck svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.task.sm{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:0 22px}
.task.sm .t1{font-size:26px}
.task.sm .ts{margin-left:0;justify-items:start}
.task.sm .ts span{height:32px;font-size:16px;padding:0 12px}
.task.sm .bar{left:150px;right:22px;bottom:25px}

/* profile + chip: the coworker */
.prof{display:flex;align-items:center;gap:34px;padding:0 44px}
.prof .av{width:200px;height:200px;border-radius:44px;background:var(--ice);display:grid;place-items:center;flex:none}
.prof .av .face{font-size:46px}
.prof .nm{font-size:84px;font-weight:800;letter-spacing:-.01em;line-height:.95}
.prof .rl{font-size:30px;font-weight:800;letter-spacing:.16em;color:var(--ink2);margin-top:10px}
.stat{display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:var(--ice);border-radius:22px;
      padding:6px 18px 6px 14px;font-size:22px;font-weight:800;letter-spacing:.12em}
.stat i{width:14px;height:14px;border-radius:50%;background:var(--leaf);display:block}
.chip{display:flex;align-items:center;gap:18px;padding:0 26px 0 16px}
.chip .av{width:96px;height:84px;border-radius:22px;background:var(--ice);display:grid;place-items:center;flex:none}
.chip .av .face{font-size:21px}
.chip .nm{font-size:40px;font-weight:800;line-height:1}
.chip .stat{margin-top:6px;font-size:16px;padding:4px 12px 4px 10px;gap:8px}
.chip .stat i{width:10px;height:10px}
.chip .deck{position:absolute;left:18px;right:18px;height:100%;top:0;border-radius:28px;background:#fff;
      box-shadow:0 6px 16px rgba(54,87,106,.10);z-index:-1;opacity:0}

.counter{background:var(--powder);border-radius:10px 10px 0 0}
.counter .lip{position:absolute;left:-24px;right:-24px;top:-16px;height:32px;border-radius:16px;background:var(--ink)}
.msg{padding:34px 44px}
.msg .h{font-size:22px;font-weight:800;letter-spacing:.14em;color:var(--ink2);margin-bottom:14px}
.msg::before{content:"";position:absolute;left:54px;top:-14px;width:30px;height:30px;background:#fff;transform:rotate(45deg);border-radius:6px}
.price{display:flex;align-items:center;gap:30px;padding:0 44px 0 34px}
.price .ic{width:112px;height:112px;border-radius:32px;background:var(--ice);display:grid;place-items:center;flex:none}
.price .n{font-size:40px;font-weight:800;letter-spacing:.03em}
.price .s{font-size:25px;font-weight:600;color:var(--ink2);margin-top:4px}
.price .v{margin-left:auto;text-align:right;white-space:nowrap}
.price .v b{font-size:66px;font-weight:800;letter-spacing:-.01em}
.price .v span{display:block;font-size:24px;font-weight:800;letter-spacing:.14em;color:var(--ink2);margin-top:-4px}
.row{display:flex;align-items:center;gap:18px;font-size:29px;font-weight:700;white-space:nowrap;width:440px}
.row .dotc{width:38px;height:38px;border-radius:50%;background:var(--butter);display:grid;place-items:center;flex:none}
.row .dotc svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.row .arr{width:38px;height:38px;border-radius:50%;background:var(--powder);display:grid;place-items:center;flex:none;font-size:24px}
.buyers{display:flex}
.buyers .b{width:54px;height:54px;border-radius:50%;border:4px solid var(--butter);margin-left:-14px;overflow:hidden;display:block}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ───────────────────────── maths ─────────────────────────
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const E={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,3),
  in:x=>x*x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.35,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
const P=(u,a,d,e=E.out)=>e(clamp((u-a)/d));
const L=(a,b,k)=>a+(b-a)*k;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(L(v,B[i],k))).join(',')})`};

// ───────────────────────── dom ─────────────────────────
const stage=document.getElementById('stage');
function mk(parent,cls,html='',css={}){const e=document.createElement('div');e.className=cls;e.innerHTML=html;Object.assign(e.style,css);parent.appendChild(e);return e}
function T(parent,html,size,weight=800,css={}){return mk(parent,'a txt',html,Object.assign({fontSize:size+'px',fontWeight:weight},css))}
function fit(e,max){const w=e.offsetWidth;if(w>max)e.style.fontSize=parseFloat(e.style.fontSize)*max/w+'px';return e}
function put(e,x,y,s=1,o=1,r=0,sy){
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(-50%,-50%) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)},${(sy??s).toFixed(4)})`;
  e.style.opacity=clamp(o).toFixed(3);e.style.visibility=o<=0.002?'hidden':'visible';
}
function hl(e,k,sel='.hl'){e.querySelectorAll(sel).forEach(h=>h.style.backgroundSize=`${(k*100).toFixed(1)}% 40%`)}
function setText(e,s){if(e.textContent!==s)e.textContent=s}
const layer=()=>mk(stage,'layer');

// ───────────────────────── drawings ─────────────────────────
const I=(d)=>`<svg viewBox="0 0 48 48">${d}</svg>`;
const ICON={
  post:I('<rect x="8" y="8" width="32" height="32" rx="9"/><circle cx="24" cy="24" r="7"/><circle cx="33" cy="15" r="1.6" fill="currentColor"/>'),
  web:I('<rect x="6" y="9" width="36" height="30" rx="5"/><path d="M6 17h36"/><circle cx="11.5" cy="13" r="1" /><circle cx="16" cy="13" r="1"/>'),
  mail:I('<rect x="6" y="11" width="36" height="26" rx="5"/><path d="M8 14l16 12 16-12"/>'),
  bag:I('<path d="M10 16h28l-2 24H12z"/><path d="M18 16v-3a6 6 0 0 1 12 0v3"/>'),
  ask:I('<path d="M8 12a4 4 0 0 1 4-4h24a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-8 7v-7h-2a4 4 0 0 1-4-4z"/><path d="M20 16a4 4 0 1 1 5 4c-1 .5-1 1.5-1 2.5"/><circle cx="24" cy="27" r=".8"/>'),
  folder:I('<path d="M6 14a4 4 0 0 1 4-4h9l4 4h15a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z"/>'),
  invoice:I('<path d="M12 6h18l8 8v28H12z"/><path d="M30 6v8h8"/><path d="M18 24h12M18 31h12"/>'),
  box:I('<path d="M8 16l16-8 16 8v18l-16 8-16-8z"/><path d="M8 16l16 8 16-8M24 24v18"/>'),
  star:I('<path d="M24 7l5 10.5 11.5 1.5-8.5 8 2 11.5L24 33l-10 5.5 2-11.5-8.5-8L19 17.5z"/>'),
  news:I('<rect x="7" y="8" width="34" height="32" rx="5"/><path d="M14 17h20M14 24h20M14 31h12"/>'),
  truck:I('<path d="M4 14h24v18H4zM28 20h8l6 6v6H28"/><circle cx="12" cy="35" r="3.5"/><circle cx="34" cy="35" r="3.5"/>'),
  cal:I('<rect x="7" y="10" width="34" height="30" rx="5"/><path d="M7 18h34M16 6v8M32 6v8"/>'),
  pen:I('<path d="M30 8l10 10-20 20H10V28z"/><path d="M26 12l10 10"/>'),
  tart:I('<path d="M8 28h32l-3 10a3 3 0 0 1-3 2H14a3 3 0 0 1-3-2z"/><circle cx="17" cy="22" r="4"/><circle cx="26" cy="20" r="4"/><circle cx="33" cy="23" r="3.5"/>'),
  people:I('<circle cx="18" cy="17" r="6"/><path d="M7 38c0-7 5-11 11-11s11 4 11 11"/><circle cx="33" cy="19" r="5"/><path d="M31 27c6 0 10 4 10 10"/>'),
  brush:I('<path d="M38 8L21 25"/><path d="M20 26c-5 0-8 3-8 8s-3 6-6 6c8 3 18 1 18-7z"/>'),
  flag:I('<path d="M12 42V8"/><path d="M12 9h22l-4 7 4 7H12"/>'),
  bell:I('<path d="M14 32V22a10 10 0 0 1 20 0v10l3 4H11z"/><path d="M21 40a3 3 0 0 0 6 0"/>'),
  home:I('<path d="M8 22L24 9l16 13"/><path d="M12 19v20h24V19"/><path d="M21 39v-9h6v9"/>'),
  list:I('<rect x="9" y="6" width="30" height="36" rx="5"/><path d="M16 16h16M16 24h16M16 32h10"/>'),
  bread:I('<path d="M8 26c0-9 7-14 16-14s16 5 16 14v10H8z"/><path d="M17 20l3 5M24 18l2 6M31 20l1 5"/>'),
  cro:I('<path d="M6 30c4-10 12-16 18-16s14 6 18 16l-7 3-5-9-6 11-6-11-5 9z"/>'),
};
const CHECK='<svg viewBox="0 0 48 48"><path d="M13 25l7 7 15-16"/></svg>';

function person({apron=true,skin='#EFC8A6',hair='#8A6F5E',shirt='#36576A',bun=false}={}){
  const hairPath=bun
    ?`<circle cx="150" cy="44" r="24" fill="${hair}"/><path d="M90 108 Q88 48 150 46 Q212 48 210 108 Q196 76 150 74 Q104 76 90 108Z" fill="${hair}"/>`
    :`<path d="M88 106 Q90 42 150 42 Q212 42 212 106 Q192 70 150 70 Q108 70 88 106Z" fill="${hair}"/>`;
  const front=apron
    ?`<path d="M100 214 H200 V360 H100 Z" fill="#F6E7A7"/><path d="M108 216 Q150 150 192 216" stroke="#F6E7A7" stroke-width="10" fill="none"/><rect x="126" y="272" width="48" height="30" rx="8" fill="#EBD686"/>`
    :`<path d="M122 182 L150 250 L178 182Z" fill="#FFFDF5"/><path d="M112 186 L150 262 L136 360 M188 186 L150 262 L164 360" stroke="#2C4757" stroke-width="5" fill="none" opacity=".45"/>`;
  return `<svg viewBox="0 0 300 360" width="100%" height="100%">
    <path d="M38 360 V252 Q38 186 104 178 H196 Q262 186 262 252 V360Z" fill="${shirt}"/>
    <rect x="132" y="148" width="36" height="42" rx="12" fill="${skin}"/>
    ${front}
    <circle cx="150" cy="110" r="62" fill="${skin}"/>
    ${hairPath}
    <circle cx="116" cy="130" r="9" fill="#E7765F" opacity=".22"/><circle cx="184" cy="130" r="9" fill="#E7765F" opacity=".22"/>
    <g class="eyes"><circle cx="129" cy="114" r="5.5" fill="#36576A"/><circle cx="171" cy="114" r="5.5" fill="#36576A"/></g>
    <path d="M136 137 Q150 148 164 137" stroke="#36576A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const BAKER=person();
const REALTOR=person({apron:false,skin:'#C99A7A',hair:'#5F5A6A',shirt:'#6F8C9C',bun:true});
function avatarCircle(parent,svg,bg,size=132){
  return mk(parent,'a',`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};overflow:hidden;position:relative">
     <div style="position:absolute;left:${-size*.19}px;top:${size*.1}px;width:${size*1.38}px;height:${size*1.66}px">${svg}</div></div>`);
}
const STRAWBERRY=`<svg viewBox="0 0 120 120" width="100%" height="100%">
  <path d="M60 30 C95 30 108 52 100 76 C92 100 72 112 60 112 C48 112 28 100 20 76 C12 52 25 30 60 30Z" fill="#E7765F"/>
  <g fill="#FFE9A8">${[[44,52],[62,48],[80,54],[38,72],[56,68],[74,70],[88,74],[48,88],[66,88],[58,102]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="2.4" ry="3.6"/>`).join('')}</g>
  <path d="M60 36 L42 20 L57 26 L60 8 L64 26 L80 18 L66 36Z" fill="#7DAE8B"/></svg>`;
const PIN=`<svg viewBox="0 0 80 96" width="100%" height="100%"><path d="M40 4C20 4 6 18 6 38c0 24 34 54 34 54s34-30 34-54C74 18 60 4 40 4z" fill="#E7765F"/><circle cx="40" cy="37" r="13" fill="#FFFDF5"/></svg>`;
const HOUSE=`<svg viewBox="0 0 320 300" width="100%" height="100%">
  <rect width="320" height="300" rx="26" fill="#BFDDF2"/><circle cx="252" cy="70" r="30" fill="#F6E7A7"/>
  <path d="M0 238 Q160 206 320 238 V274 a26 26 0 0 1-26 26 H26 A26 26 0 0 1 0 274Z" fill="#9CCBEA"/>
  <path d="M84 136 L160 78 L236 136 V238 H84Z" fill="#FFFDF5"/>
  <path d="M70 146 L160 76 L250 146" stroke="#36576A" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="140" y="176" width="40" height="62" rx="6" fill="#36576A"/>
  <rect x="100" y="152" width="30" height="30" rx="5" fill="#BFDDF2"/><rect x="190" y="152" width="30" height="30" rx="5" fill="#BFDDF2"/></svg>`;
const LOOP=`<svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="#6F8C9C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path d="M36 6v9h-9"/></svg>`;
const buyerHead=(bg,skin,hair)=>`<svg viewBox="0 0 60 60" width="100%" height="100%"><rect width="60" height="60" fill="${bg}"/><circle cx="30" cy="25" r="11" fill="${skin}"/><path d="M19 22 Q20 11 30 11 Q40 11 41 22 Q36 16 30 16 Q24 16 19 22Z" fill="${hair}"/><path d="M10 60 Q12 40 30 40 Q48 40 50 60Z" fill="#36576A"/></svg>`;
const BUYERS=`<div class="buyers">${[['#BFDDF2','#EFC8A6','#8A6F5E'],['#EEF7FC','#C99A7A','#5F5A6A'],['#FFFDF5','#E2B48F','#B08A60']].map((c,i)=>`<span class="b" style="${i?'':'margin-left:0'}">${buyerHead(...c)}</span>`).join('')}</div>`;

// the coworker's face is type, not a picture: the awake frame b^n^d, blinking to b-n-d
const FACE='<span class="face">b^n^d</span>';

// ───────────────────────── shared components ─────────────────────────
function pill(parent,label,icon,css={}){return mk(parent,'a card pill',`<span class="pi">${ICON[icon]}</span><span>${label}</span><span class="nd"></span>`,css)}
function badge(e,k,text){const d=e.querySelector('.nd');if(text!==undefined)setText(d,text);d.style.transform=`scale(${Math.max(0,k).toFixed(3)})`}
function badgeOk(e,k){const d=e.querySelector('.nd');if(!d.classList.contains('ok')){d.classList.add('ok');d.innerHTML=CHECK}d.style.transform=`scale(${Math.max(0,k).toFixed(3)})`}
function task(parent,{title,sub='',icon,fin,w=820,h=108,sm=false}){
  return mk(parent,'a card task'+(sm?' sm':''),`<div class="glow"></div>
    ${sm?'':`<div class="ti">${ICON[icon]}</div>`}
    <div class="tt"><div class="t1">${title}</div>${sub?`<div class="t2">${sub}</div>`:''}</div>
    <div class="ts"><span class="p">TO DO</span><span class="f">${fin}</span></div>
    <div class="bar"><i></i></div><div class="ck">${CHECK}</div>`,{width:w+'px',height:h+'px'});
}
// s < 0: to do · 0..1: working · >= 1: done (1 → 1.25 animates the landing)
function setTask(e,s){
  const q=e._q||(e._q={p:e.querySelector('.p'),f:e.querySelector('.f'),bar:e.querySelector('.bar'),i:e.querySelector('.bar i'),ck:e.querySelector('.ck')});
  const done=clamp((s-1)/.25);
  setText(q.p,s<0?'TO DO':'WORKING');
  q.p.style.opacity=1-done;
  q.f.style.opacity=done;q.f.style.transform=`scale(${L(.7,1,E.back(done)).toFixed(3)})`;
  q.bar.style.opacity=(s>=0?1:0)*(1-done);q.i.style.width=(clamp(s)*100).toFixed(1)+'%';
  q.ck.style.transform=`scale(${E.back(done).toFixed(3)})`;
}
const stageAt=(u,a,b,c=b)=>u<a?-1:u<b?(u-a)/(b-a):u<c?.999:1+(u-c);
const glow=(e,k)=>{e.querySelector('.glow').style.opacity=k.toFixed(3)};

// ───────────────────────── the scenes ─────────────────────────
// Global time t in seconds. Each scene poses its own layer from u = t - t0,
// and is only laid out inside its window.
const SC=[];
function scene(t0,win,init,update){const s={t0,win,init,update};SC.push(s);return s}

// background colour, keyed on global time
const BG=[[0,'#FFFDF5'],[5.8,'#FFFDF5'],[6.3,'#BFDDF2'],[12.2,'#BFDDF2'],[12.7,'#F6E7A7'],[16.1,'#F6E7A7'],[16.6,'#FFFDF5'],
          [26.5,'#FFFDF5'],[27.0,'#EEF7FC'],[37.3,'#EEF7FC'],[37.8,'#FFFDF5'],[44.4,'#FFFDF5'],[44.9,'#BFDDF2'],[49.8,'#BFDDF2'],[50.2,'#FFFDF5']];
function bgAt(t){for(let i=1;i<BG.length;i++){if(t<=BG[i][0]){const[a,ca]=BG[i-1],[b,cb]=BG[i];return mix(ca,cb,E.io(clamp((t-a)/(b-a))))}}return BG[BG.length-1][1]}

// ── S1 · too many jobs (0–6) ──
const S1C=[
  ['INSTAGRAM','post',250,800,.45,23],['WEBSITE','web',835,785,.65,0],['EMAILS','mail',185,985,.85,12],

// ───────────────────────── render ─────────────────────────
const BLINKS=[15.3,19.6,24.9,30.4,34.9,40.9,43.6,47.8];
function render(t){
  stage.style.background=bgAt(t);document.body.style.background=bgAt(t);
  for(const s of SC){const on=t>=s.win[0]&&t<=s.win[1];s.R.style.display=on?'block':'none';if(on)s.update.call(s,t-s.t0,t)}
  updateChip(t);
  // the coworker's face blinks: b^n^d → b-n-d → b^n^d
  const blink=BLINKS.some(b=>t>=b&&t<b+.16);
  document.querySelectorAll('.face').forEach(f=>setText(f,blink?'b-n-d':'b^n^d'));
  // people blink too
  const pb=[2.1,4.4,18.4,29.6,46.2].some(b=>t>=b&&t<b+.14);
  document.querySelectorAll('.eyes').forEach(g=>{g.style.transformBox='fill-box';g.style.transformOrigin='center';g.style.transform=`scaleY(${pb?.15:1})`});
}
