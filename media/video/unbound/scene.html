<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brnrd — unbound</title>
<!--
  "The model is replaceable. The work is yours." A 34.5 s, 1920x1080, 30 fps
  promo. One canvas; window.render(t) paints the whole frame as a pure function
  of time (all noise is hashed, nothing is random), render.mjs screenshots it
  frame by frame. Open with ?t=17.9 to inspect a single moment.
-->
<style>
*{margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ───────────────────────── maths ─────────────────────────
const W=1920,H=1080,FPS=30;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const E={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,3),
  in:x=>x*x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
const P=(t,a,d,e=E.out)=>e(clamp((t-a)/d));
const L=(a,b,k)=>a+(b-a)*k;
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const h2=(a,b)=>hash(a*57.13+b*13.71);
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fr=t=>Math.round(t*FPS);
const ty=(s,k)=>s.slice(0,Math.floor(s.length*clamp(k)+1e-6));
// threshold apparition: flickers between 0 and 1 across [t0,t0+d], then holds on
const thr=(t,t0,d=.14,lo=.12)=>t<t0?0:t>=t0+d?1:(hash(fr(t)*7.31+t0)>.45?1:lo);

// ───────────────────────── canvas ─────────────────────────
const cv=document.getElementById('c'),X=cv.getContext('2d');
function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
const [scr,S]=mkc(W,H);          // scratch copy for fractures
const [pxc,PX]=mkc(W,H);         // pixelation
const [lo,LO]=mkc(480,270);      // mistral's raster
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GRAIN=[0,1,2,3].map(k=>{const [c,g]=mkc(256,256),r=mulberry(k*97+11),im=g.createImageData(256,256);
  for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  g.putImageData(im,0,0);return X.createPattern(c,'repeat')});

// ───────────────────────── type ─────────────────────────
const F={
  mono:(s,w=500)=>`${w} ${s}px "SF Mono",Menlo,monospace`,
  serif:(s,w=400)=>`${w} ${s}px Charter,"Iowan Old Style",Georgia,serif`,
  cond:(s,w=800)=>`${w} ${s}px "Avenir Next Condensed","DIN Condensed",sans-serif`,
  sans:(s,w=500)=>`${w} ${s}px "Avenir Next","Helvetica Neue",sans-serif`,
};
function T(g,s,x,y,o={}){
  if(!s)return;g.save();g.font=o.f||F.mono(22);g.fillStyle=o.c||'#fff';
  if(o.a!=null)g.globalAlpha*=o.a;g.textAlign=o.al||'left';g.textBaseline=o.bl||'alphabetic';
  g.letterSpacing=(o.ls||0)+'px';if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.gb||14}
  g.fillText(s,x,y);g.restore();
}
function tw(g,s,f,ls=0){g.save();g.font=f;g.letterSpacing=ls+'px';const w=g.measureText(s).width;g.restore();return w}
function ln(g,x1,y1,x2,y2,c,w=1,dash){g.save();g.strokeStyle=c;g.lineWidth=w;if(dash)g.setLineDash(dash);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore()}
function corners(g,x,y,w,h,l,c,lw=2){g.save();g.strokeStyle=c;g.lineWidth=lw;g.beginPath();
  g.moveTo(x,y+l);g.lineTo(x,y);g.lineTo(x+l,y);g.moveTo(x+w-l,y);g.lineTo(x+w,y);g.lineTo(x+w,y+l);
  g.moveTo(x+w,y+h-l);g.lineTo(x+w,y+h);g.lineTo(x+w-l,y+h);g.moveTo(x+l,y+h);g.lineTo(x,y+h);g.lineTo(x,y+h-l);g.stroke();g.restore()}
function rr(g,x,y,w,h,r,fill,stroke,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function xmark(g,x,y,s,c,w=3){ln(g,x-s,y-s,x+s,y+s,c,w);ln(g,x-s,y+s,x+s,y-s,c,w)}
const spec=(h,l=66,a=1)=>`hsla(${((h%360)+360)%360},92%,${l}%,${a})`;

// brnrd's annotation ink: a second interpretive system laid over the rooms
const ANN='#EEEBFF',ANN2='rgba(238,235,255,.55)';
function ann(g,x,y,s,o={}){
  const a=o.a??1;if(a<=0)return;g.save();g.globalAlpha*=a;
  g.fillStyle=o.c||ANN;g.fillRect(x,y-11,8,8);
  T(g,s,x+18,y-2,{f:F.mono(o.size||15,600),c:o.c||ANN,ls:o.ls??4});g.restore();
}

// ───────────────────────── recurring pieces ─────────────────────────
// the void: a structured signal field of tiny blocks, low amplitude, reflective
function hgt(x,z,t,amp){const y=.42*Math.sin(.21*x+.8*t+.3*Math.sin(.05*z))+.33*Math.sin(.29*z-.9*t+.07*x)+.22*Math.sin(.13*(x-z)+.5*t);
  return Math.round(y*amp*6)/6}
function drawVoid(g,t,o={}){
  const br=o.br??1,tint=o.tint||[120,150,185],hor=o.hor??372,f=o.f??760,cam=o.cam??2.5,spd=o.spd??1,amp=o.amp??.55,Lg=o.light;
  g.fillStyle='#030405';g.fillRect(0,0,W,H);
  if(br<=0)return;
  const hz=g.createLinearGradient(0,hor-220,0,hor+40);
  hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(1,`rgba(${tint.join(',')},${.07*br})`);
  g.fillStyle=hz;g.fillRect(0,hor-220,W,260);
  const zo=t*.9*spd,fz=zo%1,bz=Math.floor(zo),tt=t*spd;
  for(let k=62;k>=1;k--){
    const z=k-fz+.9,zw=k+bz,sc=f/z,w=sc*.84,hh=Math.max(1,sc*.2),fog=Math.exp(-z/24);
    for(let xi=-46;xi<=46;xi++){
      const sx=W/2+xi*sc;if(sx<-w||sx>W+w)continue;
      const y=hgt(xi,zw,tt,amp),yn=hgt(xi,zw-1,tt,amp);
      const sy=hor+(cam-y)*sc;if(sy>H+hh)continue;
      const face=clamp((y-yn)*1.4+.28);
      const base=(.035+.5*face*face)*fog*br;
      const lit=Lg?Lg.s*Math.exp(-Math.pow((sx-Lg.x)/(Lg.w||360),2))*(.25+face)*Math.exp(-z/40)*br:0;
      if(base+lit<.01)continue;
      const c=Lg&&Lg.c||tint,m=1.6;
      g.fillStyle=`rgb(${Math.min(255,(tint[0]*base+c[0]*lit)*m)|0},${Math.min(255,(tint[1]*base+c[1]*lit)*m)|0},${Math.min(255,(tint[2]*base+c[2]*lit)*m)|0})`;
      g.fillRect(sx-w/2,sy,w,hh);
    }
  }
}
function vapor(g,t,cx,cy,rad,col,amt){
  if(amt<=0)return;g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<30;i++){
    const a=hash(i)*6.283+t*.18*(hash(i+9)-.5),r=rad*(.15+.85*hash(i+3));
    const x=cx+Math.cos(a)*r*1.25+50*Math.sin(t*.45+i),y=cy+Math.sin(a)*r*.55-40*t*hash(i+4)%80;
    const s=rad*(.3+.55*hash(i+5)),gr=g.createRadialGradient(x,y,0,x,y,s);
    gr.addColorStop(0,`rgba(${col.join(',')},${.1*amt})`);gr.addColorStop(1,`rgba(${col.join(',')},0)`);
    g.fillStyle=gr;g.fillRect(x-s,y-s,2*s,2*s);
  }
  g.restore();
}
// the resident: the one invariant mark
function resident(g,x,y,t,o={}){
  const s=o.s??1,a=o.a??1;if(a<=0)return;g.save();g.globalAlpha*=a;g.translate(x,y);
  const hue=t*70;
  g.globalCompositeOperation='lighter';
  const rg=g.createRadialGradient(0,0,0,0,0,70*s);
  rg.addColorStop(0,spec(hue,70,.42));rg.addColorStop(.5,spec(hue+120,60,.1));rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(-70*s,-70*s,140*s,140*s);
  g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(242,240,255,.9)';g.lineWidth=2;g.beginPath();
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){g.moveTo(dx*22*s,dy*22*s);g.lineTo(dx*36*s,dy*36*s)}
  g.stroke();
  g.rotate(Math.PI/4);g.shadowColor=spec(hue,65);g.shadowBlur=20*s;
  g.fillStyle='#F7F5FF';g.fillRect(-9*s,-9*s,18*s,18*s);
  g.restore();
}
// the stream: an untamed bundle of spectral strands
function ribbon(g,t,x0,x1,head,yc,o={}){
  const n=o.n||15,amp=o.amp||55,a=o.a??1;if(head<=x0||a<=0)return;
  g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<n;i++){
    const ph=hash(i)*6.28,am=amp*(.25+.75*hash(i+2));g.beginPath();
    for(let x=x0;x<=head;x+=10){
      const env=Math.min(1,(head-x)/260+.08);
      const y=yc(x)+Math.sin(x*.009+ph+t*2.1)*am*env+(vnoise(x*.012+i*3.1,t*1.7)-.5)*amp*1.1*env;
      x===x0?g.moveTo(x,y):g.lineTo(x,y);
    }
    const gr=g.createLinearGradient(x0,0,x1,0);
    for(let k=0;k<=4;k++)gr.addColorStop(k/4,spec(i*23+k*70+t*90,58+hash(i+5)*22,(.28+.45*hash(i+7))*a));
    g.strokeStyle=gr;g.lineWidth=.8+2.4*hash(i+11);g.stroke();
  }
  const hy=yc(head),fl=g.createRadialGradient(head,hy,0,head,hy,90);
  fl.addColorStop(0,`rgba(255,255,255,${.8*a})`);fl.addColorStop(.25,spec(t*200,70,.35*a));fl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=fl;g.fillRect(head-90,hy-90,180,180);
  g.restore();
}
function pixelate(k){
  if(k<=1)return;const w=Math.ceil(W/k),h=Math.ceil(H/k);
  PX.imageSmoothingEnabled=true;PX.clearRect(0,0,w,h);PX.drawImage(cv,0,0,W,H,0,0,w,h);
  X.save();X.imageSmoothingEnabled=false;X.drawImage(pxc,0,0,w,h,0,0,W,H);X.restore();
}
// fracture: horizontal strips slip out of register
function slices(amt,seed){
  if(amt<=0)return;S.clearRect(0,0,W,H);S.drawImage(cv,0,0);X.fillStyle='#000';X.fillRect(0,0,W,H);
  let y=0,i=0;
  while(y<H){const sh=18+hash(seed+i*3.7)*96,dx=hash(seed+i*1.3)>.35?(hash(seed+i*9.1)-.5)*2*amt:0;
    X.drawImage(scr,0,y,W,sh,dx,y,W,sh);y+=sh;i++}
}
function bigWord(g,s,o={}){
  g.fillStyle=o.bg||'#000';g.fillRect(0,0,W,H);
  T(g,s,o.x??W/2,o.y??H/2,{f:F.cond(o.size||330),c:o.fg||'#fff',al:o.al||'center',bl:'middle',ls:o.ls??-4});
}

// ───────────────────────── scene 1–3 · the void, codex ─────────────────────────
const CP={x:580,y:160,w:760,h:760};
const CODEX=[
  [3.8,.55,'user','› add a retry budget to the runner'],
  [4.5,0,'dim','• read  src/brr/runner.py  src/brr/hooks.py'],
  [4.68,0,'dim','• edit  3 files'],
  [4.86,0,'add','+   budget = RetryBudget(max_attempts=3)'],
  [4.96,0,'del','-   for attempt in itertools.count():'],
  [5.06,0,'add','+   for attempt in budget:'],
  [5.16,0,'add','+       if budget.spent: raise Exhausted(run)'],
  [5.5,0,'cmd','$ git switch -c feat/retry-budget'],
  [5.75,0,'cmd','$ pytest -q        184 passed'],
  [6.02,0,'ok','✓ PR #2146 opened   feat/retry-budget → main'],
  [6.5,.5,'user','› follow-up: the hooks path needs the same budget'],
];
const CCOL={user:'#E8F2FF',dim:'#5E7C9A',add:'#8FD0FF',del:'#4F6275',cmd:'#AFC2D6',ok:'#D6EEFF'};
function codexPanel(g,t,vis){
  const {x,y,w,h}=CP,tt=Math.min(t,7.4);g.save();g.globalAlpha=vis;
  g.shadowColor='rgba(80,160,255,.35)';g.shadowBlur=60;g.fillStyle='rgba(5,11,19,.94)';g.fillRect(x,y,w,h);g.shadowBlur=0;
  // faint machine grid inside the frame
  g.strokeStyle='rgba(120,170,230,.045)';g.lineWidth=1;g.beginPath();
  for(let i=1;i<19;i++){g.moveTo(x+i*40,y+56);g.lineTo(x+i*40,y+h);g.moveTo(x,y+56+i*40);g.lineTo(x+w,y+56+i*40)}g.stroke();
  g.strokeStyle='rgba(140,190,240,.5)';g.strokeRect(x+.5,y+.5,w,h);
  corners(g,x-10,y-10,w+20,h+20,26,'rgba(175,215,255,.95)',2);
  ln(g,x,y+56,x+w,y+56,'rgba(140,190,240,.28)');
  T(g,'CODEX',x+26,y+36,{f:F.mono(15,700),c:'#A6CDF2',ls:6});
  T(g,'~/src/brnrd',x+w-26,y+36,{f:F.mono(15),c:'#56789A',al:'right'});
  let yy=y+108,cursor=null;
  for(const [t0,d,k,s] of CODEX){
    if(tt<t0)break;
    const str=d?ty(s,(tt-t0)/d):s;
    T(g,str,x+30,yy,{f:F.mono(21,k==='user'?600:500),c:CCOL[k],glow:k==='ok'?'rgba(120,200,255,.8)':null});
    if(k==='del'){const ww=tw(g,str,F.mono(21));ln(g,x+30,yy-7,x+30+ww,yy-7,'rgba(90,120,150,.8)',1.5)}
    if(k==='user'&&d&&tt<t0+d+.3)cursor=[x+30+tw(g,str,F.mono(21,600))+4,yy];
    yy+=k==='cmd'||k==='ok'||k==='user'?40:32;
    if(k==='user')yy+=6;
  }
  if(tt>=7.05){
    const sp='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'[fr(tt)%10];
    T(g,t<7.4?`${sp} working`:'■ halted',x+30,yy+4,{f:F.mono(21),c:t<7.4?'#7FA7CC':'#C9D6E3'});
  }
  if(cursor&&fr(t)%8<5){g.fillStyle='#CFE6FF';g.fillRect(cursor[0],cursor[1]-19,12,24)}
  if(t>=7.4){ // hard boundary
    g.fillStyle='rgba(1,3,6,.62)';g.fillRect(x,y+57,w,h-57);
    const by=y+h-150;g.fillStyle='#DCE7F3';g.fillRect(x,by-34,w,68);
    T(g,'■ USAGE LIMIT REACHED',x+30,by+8,{f:F.mono(22,700),c:'#0A1522',ls:2});
    T(g,'resets in 4h 12m',x+w-30,by+8,{f:F.mono(19),c:'#3B5570',al:'right'});
    T(g,'follow-up not sent',x+30,by+74,{f:F.mono(18),c:'#6E8AA6'});
  }
  g.restore();
}
function sVoid(t){drawVoid(X,t,{br:P(t,.1,1.7,E.io)})}
function sCodex(t){
  const s=t-2.2,jolt=t>=7.4&&t<7.47?8:0;
  X.save();X.translate(jolt,-jolt*.5);
  drawVoid(X,t,{light:{x:960,s:.55*P(s,.3,1.4),w:400,c:[110,175,255]}});
  vapor(X,t,960,560,440,[80,160,255],P(s,0,1.2)*(1-.65*P(s,1.9,1.4)));
  const f=fr(t);
  // threshold apparition: the frame hints, flickers, then resolves
  let vis=s<.65?0:s<1.55?(hash(f*3.1)<(s-.65)/.9?.2+.8*hash(f*1.3):0):1;
  if(s>=.3&&s<1.55){const k=P(s,.3,.9,E.io);corners(X,CP.x-10,CP.y-10,CP.w+20,CP.h+20,26*k+2,`rgba(175,215,255,${.5*k})`,2)}
  if(vis>0)codexPanel(X,t,vis);
  X.restore();
}
function sEnded(t){
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  drawVoid(X,t,{br:.12});
  const k=P(t,7.9,.5);
  T(X,'SESSION ENDED',-24,640,{f:F.cond(330),c:'#fff',ls:-6,a:1});
  ln(X,90,700,90+900*k,700,'rgba(190,215,240,.7)',2);
  T(X,'follow-up pending · 1 message unsent · context stays in the tab',92,746,{f:F.mono(20),c:'#8DA7C0',ls:2,a:thr(t,8.02)});
}

// ───────────────────────── scene 4 · claude ─────────────────────────
const CL={x:250,y:70,w:1420,h:940};
const CLU=["I was in Codex, it ran out mid-task. It added a retry budget",
           "to the runner — branch feat/retry-budget, PR #2146, tests",
           "passed. It had NOT started the hooks path. Pasting the diff",
           "again, and the plan, and what we'd decided about limits —"];
const CLR=["Read PR #2146 and the pasted diff. Continuing on",
           "feat/retry-budget: the hooks path now shares the runner's",
           "budget, so a retry storm can't start from either side."];
function sClaude(t){
  const s=t-8.6;
  drawVoid(X,t,{br:.38,tint:[200,160,125],light:{x:960,s:.18,w:600,c:[240,190,150]}});
  const {x,y,w,h}=CL;
  X.save();X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=40;rr(X,x,y,w,h,14,'#F1ECE2');X.restore();
  // sidebar: a room of soft blocks
  X.save();X.beginPath();X.roundRect(x,y,300,h,[14,0,0,14]);X.fillStyle='#E6DECF';X.fill();X.restore();
  X.fillStyle='#C8643B';X.fillRect(x+32,y+36,8,8);X.fillRect(x+44,y+36,8,8);X.fillRect(x+38,y+30,8,8);X.fillRect(x+38,y+42,8,8);
  T(X,'Claude',x+66,y+50,{f:F.serif(26,600),c:'#3A302A'});
  T(X,'New chat',x+32,y+104,{f:F.serif(19),c:'#8A7866'});
  for(let i=0;i<10;i++){rr(X,x+28,y+140+i*44,150+hash(i+3)*100,22,4,i===0?'#D9CBB5':'#DFD6C6')}
  T(X,'Retry budget, continued',640,y+56,{f:F.serif(22),c:'#8A7B6C'});
  ln(X,x+300,y+86,x+w,y+86,'#E0D7C8');
  // the handover, rebuilt by hand
  const lines=CLU.map((l,i)=>ty(l,(t-(8.9+i*.3))/.28));
  const nl=lines.filter(l=>l).length,chip=t>=9.95;
  const bh=46+Math.max(1,nl)*36+(chip?110:0)+12,bx=660,bw=900;
  const composerY=972-bh,k=P(t,10.45,.28,E.io),by=L(composerY,122,k);
  if(k>0)rr(X,bx,888,bw,84,16,'#FBF8F2','#D6CCBB',1.5),T(X,'Reply…',bx+28,938,{f:F.serif(22),c:'#B0A392'});
  rr(X,bx,by,bw,bh,16,k>.5?'#E5DDCE':'#FBF8F2',k>.5?null:'#D6CCBB',1.5);
  lines.forEach((l,i)=>T(X,l,bx+28,by+48+i*36,{f:F.serif(22),c:'#2E2622'}));
  if(t<10.45&&nl&&fr(t)%8<5){const last=lines[nl-1];X.fillStyle='#C8643B';X.fillRect(bx+30+tw(X,last,F.serif(22)),by+26+(nl-1)*36,3,28)}
  if(chip){
    const cy=by+48+nl*36-4,pa=thr(t,9.95,.1);X.save();X.globalAlpha*=pa;
    rr(X,bx+28,cy,560,92,10,'#EAF0F6','#AFC4D8',1.5);
