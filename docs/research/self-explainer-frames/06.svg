    </g>
  </g>
  <circle cx="460" cy="240" r="46" fill="none" stroke="#a9f3cc" stroke-width="3"/>
  <path d="M 64 555 H 1136" fill="none" stroke="#354257" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="603" font-size="36" fill="#f0f4fa" text-anchor="start">intend = a fork</text>
  <text x="64" y="641" font-size="36" fill="#f0f4fa" text-anchor="start">scheduled by a cue</text>
</svg>
