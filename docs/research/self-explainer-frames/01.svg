  <text x="1080" y="407" font-size="38" fill="#a9f3cc" text-anchor="middle">b·_·d</text>
  <text x="1080" y="446" font-size="30" fill="#aab6c8" text-anchor="middle">keeper</text>
  <circle cx="260" cy="345" r="10" fill="#101724" stroke="#a9f3cc" stroke-width="5"/>
