  <circle cx="490" cy="345" r="10" fill="#101724" stroke="#a9f3cc" stroke-width="5"/>
  <text x="490" y="300" font-size="36" fill="#a9f3cc" text-anchor="middle">notebook</text>
  <circle cx="720" cy="345" r="10" fill="#101724" stroke="#a9f3cc" stroke-width="5"/>
  <text x="720" y="300" font-size="36" fill="#a9f3cc" text-anchor="middle">warp</text>
