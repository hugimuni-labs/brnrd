name: Publish backend container

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Unconstrained: every commit still gets its own immutable
  # `sha-<7>` tag in both registries, whatever else is racing (#848 —
  # "registry tags are the release mechanism, and a published image
  # nobody rolls out is not a release"). A `concurrency:` group here
  # would cancel or requeue builds and leave commits with no image
  # anywhere in either `cancel-in-progress` variant (#1039 comment 1).
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    env:
      GHCR_IMAGE: ghcr.io/hugimuni-labs/brnrd
      # Full target without a tag, for example:
      # rg.<region>.scw.cloud/<namespace>/brnrd
      SCW_REGISTRY_IMAGE: ${{ secrets.SCW_REGISTRY_IMAGE }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive immutable image tag
        id: image
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Require Scaleway registry configuration for a manual run
        if: ${{ github.event_name == 'workflow_dispatch' && (env.SCW_SECRET_KEY == '' || env.SCW_REGISTRY_IMAGE == '') }}
        shell: bash
        run: |
          echo "::error::A manual publication requires SCW_SECRET_KEY and SCW_REGISTRY_IMAGE repository secrets."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push canonical image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.image.outputs.tag }}
          build-args: BRNRD_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Missing secrets expand to empty strings. Keep every Scaleway operation
      # inside this guarded step so main remains green before the account and
      # registry namespace exist.
      - name: Mirror image to Scaleway Container Registry
        if: ${{ env.SCW_SECRET_KEY != '' && env.SCW_REGISTRY_IMAGE != '' }}
        shell: bash
        run: |
          registry="${SCW_REGISTRY_IMAGE%%/*}"
          printf '%s' "$SCW_SECRET_KEY" | docker login "$registry" --username nologin --password-stdin
          docker pull "$GHCR_IMAGE:${{ steps.image.outputs.tag }}"
          docker tag "$GHCR_IMAGE:${{ steps.image.outputs.tag }}" "$SCW_REGISTRY_IMAGE:${{ steps.image.outputs.tag }}"
          docker push "$SCW_REGISTRY_IMAGE:${{ steps.image.outputs.tag }}"

  # Constrained: at most one rollout per ref in flight at a time, and a
  # superseded one is cancelled outright (#1039 — four builds in three
  # minutes overlapped freely and prod ended up serving whichever deploy
  # step finished last, with no relationship to commit order). Cancelling
  # here is the right call precisely because it does *not* touch the
  # image: `build` already pushed this commit's `sha-<7>` tag to both
  # registries, so a cancelled rollout loses only a container update
  # that a newer commit is already about to redo.
  deploy:
    name: Deploy the mirrored image
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: scw-rollout-${{ github.ref }}
      cancel-in-progress: true
    env:
      SCW_REGISTRY_IMAGE: ${{ secrets.SCW_REGISTRY_IMAGE }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # The Serverless Container to roll the mirrored image out to. Optional
      # until the cutover target exists; when absent the deploy tail is
      # skipped with a visible notice, never silently.
      SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}

    steps:
      # Full history, not the default depth-1 shallow clone: scw_rollout.py's
      # commit-ordering guard (#1045) needs `git merge-base --is-ancestor` to
      # resolve the *currently deployed* commit locally, and that commit is
      # not necessarily this job's parent — a quiet weekend can leave prod
      # several merges behind. A depth-1 checkout would make that guard read
      # `unknown` (and roll out anyway) far more often than it needs to. This
      # repo is small (~1400 commits, tens of MB packed); the full fetch costs
      # a few seconds here, once, and buys the guard an ancestor answer on
      # every deploy instead of only the ones that follow their predecessor
      # closely. Revisit if repo growth ever makes that trade worse.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The deploy tail (#848: registry tags are the release mechanism, and a
      # published image nobody rolls out is not a release). The whole rollout
      # lives in scripts/scw_rollout.py — its docstring carries why, including
      # the two mistakes the inline-curl first draft made and the `409` they
      # cost. A deploy that never goes ready is still a failed publication,
      # reported red here (#892's rule: the step outcome is the receipt).
      - name: Deploy the mirrored image to the Serverless Container
        if: ${{ env.SCW_SECRET_KEY != '' && env.SCW_REGISTRY_IMAGE != '' && env.SCW_CONTAINER_ID != '' }}
        shell: bash
        run: python3 scripts/scw_rollout.py "$SCW_REGISTRY_IMAGE:${{ needs.build.outputs.tag }}"

      - name: Note the skipped deploy tail
        if: ${{ env.SCW_SECRET_KEY != '' && env.SCW_REGISTRY_IMAGE != '' && env.SCW_CONTAINER_ID == '' }}
        shell: bash
        run: |
          echo "::notice::Image mirrored but not deployed - SCW_CONTAINER_ID is not set, so no container was rolled out."
