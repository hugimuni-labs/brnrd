name: Temporary release-gate generated fixes

on:
  push:
    branches:
      - brr/release-gate-0.6.17

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brr/release-gate-0.6.17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend formatter
        working-directory: src/frontend
        run: npm ci

      - name: Format pricing page
        working-directory: src/frontend
        run: npx prettier --write src/routes/pricing/+page.svelte

      - name: Refresh legal export pins after formatting
        run: python scripts/legal_manifest.py --write

      - name: Commit generated release-gate fixes only
        shell: bash
        run: |
          paths=(
            src/frontend/src/routes/pricing/+page.svelte
            docs/legal/export/SHA256SUMS
            docs/legal/export/document-manifest.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Generated release-gate files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore: refresh generated release-gate files"
          git push origin HEAD:brr/release-gate-0.6.17
