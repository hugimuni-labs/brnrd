name: CLA

# Signatures are committed to `cla-signatures` by this action. That branch
# has to stay unprotected, or the commit is rejected.
#
# `pull_request_target` runs the workflow file from the base branch, with
# this repository's token, so a fork can be checked without trusting the
# fork's workflows. This job must not check out the pull request. The
# action is pinned to a commit for that reason.
#
# `actions: write` is required by contributor-assistant/github-action v2.
# Without it the job fails after it has recognised a signature.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check the agreement
        if: "(github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/hugimuni-labs/brnrd/blob/main/CLA.md
          branch: cla-signatures
          allowlist: brnrd-dev[bot],brnrd-bot,StrayUnicorn,dependabot[bot]
          # The signature file is the record. Locking every merged pull
          # request would freeze the conversation after merge.
          lock-pullrequest-aftermerge: false
