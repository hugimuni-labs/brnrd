name: Installer end to end

# The real installer, run on the PR's own checkout under a throwaway HOME:
# real uv, real venv, real editable install, real `python -I -m
# ...install_checkout`, the shim, and two reruns for env cleanup. Unit tests
# drive install.sh with fakes; this job is the one place nothing is faked.
# It needs network to astral.sh (uv), PyPI (deps), GitHub (origin/main and
# board assets) and, on the npm leg, the npm registry.
on:
  pull_request:
    paths:
      - docs/public/install.sh
      - src/brr/loom/runtime/install_checkout.py
      - src/brr/loom/runtime/spabuild.py
      - src/brr/loom/runtime/board_asset.py
      - .github/workflows/install-e2e.yml
  push:
    branches: [main]
    paths:
      - docs/public/install.sh
      - src/brr/loom/runtime/install_checkout.py
      - src/brr/loom/runtime/spabuild.py
      - src/brr/loom/runtime/board_asset.py
      - .github/workflows/install-e2e.yml

permissions:
  contents: read

# bash, so pipefail holds: `install.sh | tee` fails when the installer does.
defaults:
  run:
    shell: bash

jobs:
  install:
    name: Install (${{ matrix.os }}, board via ${{ matrix.board }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node present: the board comes from the exact asset or a local npm build.
          - os: ubuntu-latest
            board: npm
          # npm hidden: the asset or its ancestor, or no board; install must still succeed.
          - os: macos-latest
            board: none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the checkout as a resident's would be
        run: |
          # The installer accepts only an upstream origin; actions/checkout already sets it.
          test "$(git remote get-url origin)" = "https://github.com/hugimuni-labs/brnrd"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          E=$RUNNER_TEMP/e2e
          mkdir -p "$E/home"
          echo "E=$E" >> "$GITHUB_ENV"
      - if: matrix.board == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.board == 'none'
        name: Remove node and npm
        run: |
          # A machine without Node has no npm at all. A stub that fails is not that: the
          # installer's npm collision check rightly refuses when `npm root -g` fails.
          # The runner is thrown away after the job.
          while p=$(command -v npm || command -v node); do sudo rm -f "$p"; hash -r; done
          ! command -v npm && ! command -v node
      - name: Install, three runs
        run: |
          export HOME=$E/home BRNRD_ROOT=$E/home/.brnrd BRNRD_DEV_DIR=$GITHUB_WORKSPACE
          for n in 1 2 3; do
            echo "::group::run $n"
            sh docs/public/install.sh </dev/null 2>&1 | tee "$E/run$n.log"
            echo "::endgroup::"
          done
      - name: Check what landed
        run: |
          R=$E/home/.brnrd
          fail() { echo "::error::$1"; exit 1; }
          "$R/bin/brnrd" --version || fail 'the shim does not answer'
          cur=$(cd "$R/current" && pwd -P)
          case "$cur/" in "$(cd "$R/envs" && pwd -P)"/install-*) : ;; *) fail "current is $cur, outside envs/install-*" ;; esac
          "$cur/bin/python" -I -c 'import brr, os, sys; p = os.path.realpath(brr.__file__); sys.exit(0 if p.startswith(os.path.realpath(sys.argv[1])) else f"brr imports from {p}")' "$GITHUB_WORKSPACE"
          # Current and the one before are kept; the first run's env is gone.
          n=$(ls -d "$R"/envs/install-* | wc -l | tr -d ' ')
          [ "$n" = 2 ] || fail "$n installer environments left, want 2"
          grep -q '^previous prefix retained: ' "$E/run3.log" || fail 'third run names no retained prefix'
          grep -q '^removed older installer environment: ' "$E/run3.log" || fail 'third run removed nothing'
          grep -q '^service: none installed' "$E/run1.log" || fail 'a service was touched under a throwaway HOME'
          grep -q "^HEAD: $(git rev-parse HEAD)" "$E/run1.log" || fail 'receipt names another HEAD'
          # Exactly one board line. Either leg must end with a board: with npm hidden it is
          # the exact asset or one of upstream main's nearest published first parents,
          # read by release downloads with no API listing to rate-limit a shared runner IP.
          [ "$(grep -c '^board: ' "$E/run1.log")" = 1 ] || fail 'the receipt has more than one board line'
          if grep -q '^board: unavailable' "$E/run1.log"; then
            fail "no board fetched or built (board via ${{ matrix.board }})"
          fi
          grep '^board: \|^spa: board is from older' "$E/run1.log"
          test -f "$GITHUB_WORKSPACE/src/frontend/build/200.html" || fail 'the receipt names a board with no 200.html'
