# Upsun config for the brnrd backend (the managed inbox service).
# The brr daemon runs on your own machine and dials out to this — only
# brnrd is deployed here. Reference:
# https://docs.upsun.com/create-apps/app-reference/single-runtime-image.html
applications:
  brnrd:
    # The whole repo is the build context; brnrd lives under src/.
    source:
      root: "/"

    type: "python:3.12"

    # Node/npm are only needed to build the SvelteKit static frontend
    # (src/frontend) during the build hook below; the running app stays
    # pure Python/uvicorn. This is the standard Platform.sh/Upsun trick
    # for pulling in a second language toolchain for a build-only step.
    dependencies:
      nodejs:
        npm: "*"

    # Expose the PostgreSQL service to the app. Upsun publishes its
    # credentials as POSTGRESQL_* env vars (consumed in .environment).
    relationships:
      postgresql: "postgresql:postgresql"

    web:
      commands:
        # ASGI factory; reads its config (incl. BRNRD_DATABASE_URL) from
        # the environment. Listens on the TCP port Upsun provides.
        start: "uvicorn brnrd:create_app --factory --host 0.0.0.0 --port $PORT"
      upstream:
        socket_family: tcp
      locations:
        # Static files off disk, everything else to the app (#847).
        #
        # This block used to carry a `rules:` regex naming every backend
        # prefix — a hand-maintained second copy of src/brnrd/app.py's
        # include_router calls, which nothing could check, because CI never
        # runs this router. `create_app` now serves the SvelteKit build
        # itself and decides the backend/SPA boundary from its own route
        # table (src/brnrd/spa.py, tests/test_spa_serving.py).
        #
        # What is left here is an optimisation, not a contract: nginx
        # answers requests that name a real file in the build tree (hashed
        # assets, robots.txt) without waking uvicorn, and passes everything
        # else through. Delete this whole block and the app still behaves
        # correctly — just with Python serving the assets. That is the
        # portability property #848 needs, stated as a property.
        "/":
          root: "src/frontend/build"
          index: ["index.html"]
          passthru: true
          scripts: false

    variables:
      env:
        # Disable the dev enqueue stand-in in production; the real
        # producer is POST /v1/webhooks/telegram. Secrets (bot token,
        # webhook secret) are set out-of-band via `upsun variable:create`.
        BRNRD_ENABLE_DEV: "0"

    hooks:
      build: |
        set -eux
        pip install --upgrade pip
        pip install ".[backend,postgres]"
        # Stamp the installed package with the build identity so
        # /v1/stats/version can answer "is my merge live?" honestly
        # (src/brnrd/version_info.py). scripts/stamp_build_info.py is the
        # one writer of build_info.txt, shared with the backend Dockerfile;
        # this git-less exported tree resolves to PLATFORM_TREE_ID and the
        # third line records that, so the reader never has to guess.
        python scripts/stamp_build_info.py
        cd src/frontend
        # `npm ci` demands byte-exact lock/registry agreement; several
        # frontend deps (rolldown/tailwindcss oxide) ship optional
        # per-platform native/wasm binaries whose own nested ranges (e.g.
        # @emnapi/core) get satisfied by whatever patch the registry has
        # live that day, so a lock resolved on one npm/date can disagree
        # with `ci`'s sync check on another even with unchanged
        # package.json (hit live 2026-07-06: local npm resolved
        # @emnapi/core@1.11.1, Upsun's npm ci wanted 1.11.2 — same lock,
        # same registry, different day). `npm install` self-heals that
        # drift instead of hard-failing the build over it.
        npm install --no-audit --no-fund
        npm run build
        cd -

    # No mounts: all state lives in PostgreSQL; nothing writes to disk.

services:
  postgresql:
    type: postgresql:15

routes:
  "https://{default}/":
    type: upstream
    upstream: "brnrd:http"
    # HSTS: probed absent 2026-07-27 (open-facts item, settled negatively —
    # a security page that promises TLS and serves no HSTS header leaves
    # first-visit downgrade open). enabled:true = 1-year max-age.
    # include_subdomains / preload deliberately left at their false
    # defaults: preload is semi-irreversible (list removal is slow) and
    # subdomain coverage is an inventory question — both the operator's
    # call, not a default. Upsun caveat: HSTS on exactly one route per
    # domain; this is the only route.
    tls:
      strict_transport_security:
        enabled: true
