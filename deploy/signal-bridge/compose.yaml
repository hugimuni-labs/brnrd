services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:0.100
    restart: unless-stopped
    environment:
      MODE: json-rpc
      RECEIVE_WEBHOOK_URL: http://relay:8090/receive
    volumes:
      - signal-state:/home/.local/share/signal-cli
    depends_on:
      - relay

  relay:
    build: .
    restart: unless-stopped
    environment:
      SIGNAL_API_URL: http://signal-api:8080
      BRNRD_WEBHOOK_URL: ${BRNRD_WEBHOOK_URL}
      BRNRD_SIGNAL_WEBHOOK_SECRET: ${BRNRD_SIGNAL_WEBHOOK_SECRET}
      BRNRD_SIGNAL_API_TOKEN: ${BRNRD_SIGNAL_API_TOKEN}
      SPOOL_DIR: /data/inbox
    volumes:
      - relay-data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SIGNAL_BRIDGE_HOST: ${SIGNAL_BRIDGE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - relay

volumes:
  signal-state:
  relay-data:
  caddy-data:
