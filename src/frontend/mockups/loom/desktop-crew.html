<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Loom — crew</title>
		<link rel="stylesheet" href="loom.css" />
	</head>
	<body>
		<main class="screen">
			<header class="top">
				<div class="wordmark">⌂ HOME / loom</div>
				<div class="heddles">
					<span class="rune active" style="color: var(--rose)">ᚨ</span
					><span class="rune" style="color: var(--blue)">ᚱ</span
					><span class="rune" style="color: var(--cyan)">ᛚ</span>
				</div>
				<div class="vitals">
					<span>crew shed</span><span><i class="live-dot"></i> 3 threads</span>
				</div>
			</header>
			<section class="crew-window panel">
				<div class="trunk"></div>
				<div class="crew-root glow">b·_·d</div>
				<div class="branch one">
					<div class="thread" style="--angle: 23deg">
						<span class="glow">▷</span> audit the rail<br /><small>allowance 94k / 150k</small>
						<div class="bar"></div>
					</div>
					<div class="loot" style="right: -28px; top: -18px">✣ PR</div>
				</div>
				<div class="branch two">
					<div class="thread" style="--angle: -18deg">
						<span class="glow">▷</span> read the seat<br /><small class="ask">◌ ask +150k</small
						><button class="grant">grant</button>
						<div
							class="bar"
							style="
								background: linear-gradient(90deg, var(--ice) 0 28%, rgba(198, 224, 235, 0.16) 28%);
							"
						></div>
					</div>
				</div>
				<div class="branch three">
					<div class="thread" style="--angle: -38deg">
						<span class="glow">▷</span> drive the mock<br /><small>allowance 51k / 90k</small>
						<div
							class="bar"
							style="
								background: linear-gradient(
									90deg,
									var(--green) 0 78%,
									rgba(138, 203, 120, 0.16) 78%
								);
							"
						></div>
					</div>
					<div class="loot" style="right: -26px; top: -12px">✣ PR</div>
				</div>
			</section>
		</main>
	</body>
</html>
