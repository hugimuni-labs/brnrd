<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Loom — the crew moves</title>
		<style>
			:root {
				color-scheme: dark;
				--void: #0c0906;
				--ink: #f3e8d8;
				--quiet: #a8a29e;
				--mute: #736d65;
				--amber: #d9a441;
				--amber-bright: #f0c85c;
				--ice: #c6e0eb;
				--line: rgba(120, 95, 55, 0.42);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
			}

			body {
				margin: 0;
				overflow: hidden;
				background: var(--void);
				color: var(--ink);
				font:
					14px/1.35 ui-monospace,
					SFMono-Regular,
					Menlo,
					Monaco,
					Consolas,
					monospace;
			}

			body::before {
				position: fixed;
				inset: 0;
				background-image:
					repeating-linear-gradient(rgba(243, 232, 216, 0.018) 0 1px, transparent 1px 3px),
					radial-gradient(ellipse at 50% 0%, rgba(217, 164, 65, 0.1), transparent 62%);
				box-shadow:
					inset 0 0 0 1px rgba(198, 224, 235, 0.1),
					inset 0 0 70px 10px rgba(4, 3, 2, 0.66);
				content: '';
				pointer-events: none;
			}

			.scene {
				position: relative;
				display: grid;
				grid-template-rows: 48px minmax(0, 1fr) 40px;
				width: 100%;
				height: 100%;
				padding: 12px 18px;
			}

			.heddles,
			.console {
				display: grid;
				align-items: center;
				border-color: rgba(120, 95, 55, 0.28);
			}

			.heddles {
				grid-template-columns: 1fr auto 1fr;
				border-bottom: 1px solid rgba(120, 95, 55, 0.28);
			}

			.wordmark {
				font-weight: 700;
				letter-spacing: 0.08em;
			}

			.runes {
				display: flex;
				gap: 17px;
				align-items: center;
				font-size: 21px;
			}

			.rune {
				color: var(--mute);
				opacity: 0.62;
			}

			.rune.live {
				color: var(--amber-bright);
				opacity: 1;
				text-shadow:
					0 0 5px var(--amber),
					0 0 15px rgba(217, 164, 65, 0.8);
			}

			.vitals {
				justify-self: end;
				color: var(--quiet);
				font-size: 11px;
				letter-spacing: 0.05em;
			}

			.live-dot {
				display: inline-block;
				width: 6px;
				height: 6px;
				margin: 0 5px 1px 8px;
				border-radius: 50%;
				background: var(--amber-bright);
				box-shadow: 0 0 9px var(--amber);
			}

			.frame {
				position: relative;
				min-height: 0;
				margin: 8px 0;
				border: 1px solid var(--line);
				background: rgba(12, 9, 6, 0.72);
				box-shadow:
					0 0 18px rgba(217, 164, 65, 0.055),
					inset 0 0 30px rgba(217, 164, 65, 0.025);
			}

			.frame::after {
				position: absolute;
				inset: -1px;
				background:
					linear-gradient(var(--amber), var(--amber)) 0 0/13px 1px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 0 0/1px 13px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 100% 0/13px 1px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 100% 0/1px 13px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 0 100%/13px 1px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 0 100%/1px 13px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 100% 100%/13px 1px no-repeat,
					linear-gradient(var(--amber), var(--amber)) 100% 100%/1px 13px no-repeat;
				content: '';
				opacity: 0.72;
				pointer-events: none;
			}

			canvas {
				display: block;
				width: 100%;
				height: 100%;
				cursor: none;
			}

			.console {
				grid-template-columns: 1fr auto;
				border-top: 1px solid rgba(120, 95, 55, 0.34);
				color: var(--quiet);
				font-size: 12px;
			}

			.console strong {
				color: var(--amber-bright);
				font-weight: 500;
			}

			.beat {
				color: var(--mute);
				font-size: 10px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<main class="scene">
			<header class="heddles" aria-label="Heddles">
				<div class="wordmark">⌂ HOME / loom</div>
				<div class="runes" aria-label="Six heddles, crew raised">
					<span class="rune">ᚨ</span><span class="rune">ᚱ</span><span class="rune live">ᛚ</span
					><span class="rune">ᚹ</span><span class="rune">ᛟ</span><span class="rune">ᛞ</span>
				</div>
				<div class="vitals">crew shed <span class="live-dot"></span>3 threads</div>
			</header>

			<section class="frame">
				<canvas
					id="crew-scene"
					width="1280"
					height="720"
					aria-label="A looping crew scene, drawn as a cmdline tree. Click daemon.py to open the fold/split/test menu, or click grant when a thread asks for fuel."
				></canvas>
			</section>

			<footer class="console">
				<div><strong>› split daemon.py at the seams</strong> · the shuttle is listening</div>
				<div class="beat">600 ms beat · deterministic replay</div>
			</footer>
		</main>
		<script src="crew-scene.js"></script>
	</body>
</html>
