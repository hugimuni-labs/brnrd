<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Loom — watch</title>
		<link rel="stylesheet" href="loom.css" />
	</head>
	<body>
		<main class="phone">
			<section class="phone-shell">
				<div class="phone-head"><span>⌂ watch</span><span class="glow">weaving</span></div>
				<div class="face">b·_·d</div>
				<div class="mood">mood: intent, with a little static</div>
				<section class="feed">
					<div class="bead">
						<span class="glow">●</span> <b>12:16</b> · thread read the water line
						<span class="spark">✦</span>
					</div>
					<div class="bead"><span class="glow">●</span> <b>12:14</b> · knot dropped at runner</div>
					<div class="bead">
						<span class="glow">●</span> <b>12:10</b> · card carried topic: loom
					</div>
					<div class="bead">
						<span class="glow">●</span> <b>12:06</b> · shuttle found the file leaf
					</div>
				</section>
				<section class="phone-gauge">
					<span>fuel <span class="glow">██████░░</span></span
					><span>▷2</span><span>seat: weaving</span>
				</section>
			</section>
			<section class="phone-console">
				<span class="prompt">›</span> say where the thread goes <span class="chip">@daemon.py</span>
			</section>
		</main>
	</body>
</html>
