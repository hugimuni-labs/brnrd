<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- No <title> here on purpose (was a bare "brnrd" before this fix) —
		     see the note by %sveltekit.head% below for why: any tag here that
		     a prerendered page's own <svelte:head> also sets becomes a second,
		     order-dependent instance of that tag rather than a clean fallback,
		     because this file is the shared template for every route, not just
		     the ones with nothing more specific to say. The client-only
		     dashboard routes (`/login`, `/daily`, `/new`, …) already set their
		     own <title> via their own <svelte:head> (unchanged by this fix);
		     losing the ~100ms pre-hydration placeholder there is the accepted
		     cost of not shipping an ambiguous duplicate <title> on every public
		     page a crawler actually reads. -->
		<!-- The product mark is the site's face (his ask, 2026-08-12, #1329):
		     the power-rune — the engineering glyph cut as a galdrastafur —
		     same brr-avatar the docs use as favicon and logo, so every
		     surface wears one identity in a tab strip. -->
		<link rel="icon" type="image/png" href="/brr-avatar.png" />
		<link rel="apple-touch-icon" href="/brr-avatar.png" />
		<!-- Site/entity signals live in the initial SPA shell so crawlers do not
		     have to execute JavaScript before they can identify brnrd. This is
		     the template every prerendered page shares (%sveltekit.head% below
		     is substituted per route) — title, description, canonical, robots
		     and og:url/og:title/og:description/twitter:title/twitter:description
		     are therefore owned per-route (+layout.svelte / each page's own
		     <svelte:head>, `/` included — see routes/+page.svelte), never here:
		     a value hardcoded in this shared shell would apply to every route
		     and fight the route-specific one once %sveltekit.head% is spliced
		     in (measured while building the unfurl fix, 2026-09-01 — every
		     prerendered page briefly carried two conflicting <title>s). -->
		<meta property="og:site_name" content="brnrd" />
		<meta property="og:type" content="website" />
		<!-- Social card: the banner (#1329) — die-floorplan basalt, the rune,
		     the bitmap wordmark. og:image wants absolute URLs; brnrd.dev is
		     the canonical host for the dashboard build. -->
		<meta property="og:image" content="https://brnrd.dev/brr-banner.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebSite",
						"@id": "https://brnrd.dev/#website",
						"url": "https://brnrd.dev/",
						"name": "brnrd",
						"alternateName": "brnrd.dev",
						"publisher": { "@id": "https://brnrd.dev/#organization" }
					},
					{
						"@type": "Organization",
						"@id": "https://brnrd.dev/#organization",
						"name": "HugiMuni SAS",
						"sameAs": ["https://github.com/hugimuni-labs"]
					},
					{
						"@type": "SoftwareApplication",
						"@id": "https://brnrd.dev/#software",
						"name": "brnrd",
						"url": "https://brnrd.dev/",
						"applicationCategory": "DeveloperApplication",
						"description": "An open-source resident layer for persistent coding agents that keeps continuity around the agent CLI already running on your machine.",
						"codeRepository": "https://github.com/hugimuni-labs/brnrd",
						"license": "https://github.com/hugimuni-labs/brnrd/blob/main/LICENSE",
						"isAccessibleForFree": true,
						"publisher": { "@id": "https://brnrd.dev/#organization" }
					}
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
