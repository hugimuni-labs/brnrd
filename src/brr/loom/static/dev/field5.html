<!doctype html>
<meta charset="utf-8">
<title>the pods — scene one, above the water</title>
<style>
:root{--bg:#070604;--amber:#f2b134;--ice:#8fd3ff;--dim:#8f8470;--absent:#5a4d3c;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#e8dcc0;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font:11px ui-monospace,Menlo,monospace}
#top{top:0;left:0;right:0;padding:12px 16px;display:flex;gap:14px;align-items:baseline}
#top b{font-size:14px;color:#e8dcc0;font-weight:650}#top span{color:var(--dim);letter-spacing:2px;font-size:10px}
#src{margin-left:auto;color:var(--absent);font-size:10px}
#belt{right:16px;top:52px;width:210px}
.vial{margin-bottom:10px}.vial .h{display:flex;justify-content:space-between;align-items:baseline}
.vial .h i{font-style:normal;color:var(--dim);font-size:10px}.vial .h b{font-weight:400;font-size:17px}
.vial .bar{height:3px;background:#17110a;margin-top:3px;position:relative;overflow:hidden}
.vial .bar i{position:absolute;inset:0 auto 0 0;display:block}
.vial.torn .bar{background:repeating-linear-gradient(90deg,#241c12 0 3px,transparent 3px 7px)}
#state{left:16px;top:52px;width:280px;line-height:1.7}
#state .k{color:var(--absent)}#state .v{color:#e8dcc0}#state .amber{color:var(--amber)}#state .ice{color:var(--ice)}
#legend{left:16px;bottom:14px;color:var(--absent);line-height:1.7}
#legend b{color:var(--dim);font-weight:400}
#hover{position:fixed;pointer-events:none;background:#0b0906ee;border:1px solid #3a3328;padding:5px 8px;font:10px ui-monospace,Menlo,monospace;display:none;z-index:5}
</style>
<canvas id="c"></canvas>
<div class="hud" id="top"><b>brnrd</b><span>/ THE PODS · scene one · above the water</span><span id="src"></span></div>
<div class="hud" id="state"></div>
<div class="hud" id="belt"></div>
<div class="hud" id="legend"></div>
<div id="hover"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TWO REGIONS, TWO HANDS — do not edit outside your own region.

   [WORLD]  layout · ingest · drawWorld · the camera axis.        owner: camera strand
   [FRAME]  the loop · offscreen buffers · the post-pass · chrome. owner: post-pass strand

   The seam between them, and the only thing either may assume of the other:
     drawWorld(ctx, now)   — draws the scene in CSS pixels into whatever context it
                             is handed. Never clears. Never applies effects.
     worldHud()            — {state,pod,last,why,vials:[{n,pct,src}],doors} for chrome.
     CAM = {z}             — 1 = interior (the tree). Below 1 the world rises toward
                             the schematic. [FRAME] may read CAM.z (e.g. to scale
                             bloom); only [WORLD] writes it.
   Both regions share the palette constants and `num/clamp/hash/heat` helpers below.
   A change that needs the other region is a message to the parent, not an edit.
   ═══════════════════════════════════════════════════════════════════════════ */
const cv=document.getElementById('c'),x=cv.getContext('2d');
const $=s=>document.querySelector(s);
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);layout();}
addEventListener('resize',resize);
// ═══ [WORLD] ═══════════════════════════════════════════════════════════════
// ── the feed ───
const FEEDS=['/loom/state.json','http://127.0.0.1:7777/loom/state.json'];
let S=null, nodes=[], byPath=new Map(), pods=[], pings=[], sonar=[], t0=performance.now(), seenBead=-1, water=0;
const A='#f2b134', I='#8fd3ff';
const num=v=>typeof v==='number'&&isFinite(v);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;};
// the temperature law: amber warm, ice cold, black absent
const temp=p=>!num(p)?null:clamp((p-18)/30,0,1);
const heat=p=>{const t=temp(p);if(t===null)return '#2b2318';const e=t*t*(3-2*t);
  const c=[[143,211,255],[242,177,52]];return `rgb(${Math.round(c[0][0]+(c[1][0]-c[0][0])*e)},${Math.round(c[0][1]+(c[1][1]-c[0][1])*e)},${Math.round(c[0][2]+(c[1][2]-c[0][2])*e)})`;};
async function pull(){
  for(const u of FEEDS){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const d=await r.json();ingest(d);return;}catch(e){}
  }
  $('#src').textContent='no feed — the water is dark, and that is honest';
}
// ── the tree above the water: places, placed by their own path ─────────────
function layout(){
  water=H*0.72;
  if(!S)return;
  const places=(S.tree&&S.tree.repo)||[];
  const keep=places.filter(p=>!p.path.includes('node_modules')).slice(0,220);
  // group by top segment → an island; within an island, depth is height, hash is drift
  const islands=new Map();
  for(const p of keep){const top=p.path.split('/')[0];if(!islands.has(top))islands.set(top,[]);islands.get(top).push(p);}
  const list=[...islands.entries()].sort((a,b)=>b[1].length-a[1].length);
  nodes=[];byPath=new Map();
  const span=W*0.92, left=W*0.04;
  let cursor=0, total=list.reduce((n,[,v])=>n+Math.max(2,Math.sqrt(v.length)),0)||1;
  for(const [top,ps] of list){
    const w=span*Math.max(2,Math.sqrt(ps.length))/total, cx=left+cursor+w/2; cursor+=w;
    ps.sort((a,b)=>a.path.localeCompare(b.path));
    ps.forEach(p=>{
      const depth=p.path.split('/').length;
      const y=water-30-Math.min(depth,7)*(H*0.075)-hash(p.path)*18;
      const nx=cx+(hash(p.path+'x')-0.5)*w*0.86;
      const n={...p,x:nx,y,island:top,r:2.2+Math.min(3.4,(p.knots||1)*0.5),flare:0,depth};
      nodes.push(n);byPath.set(p.path,n);
    });
    nodes.push({island:top,label:top,x:cx,y:water-8,isLabel:true,w:w});
  }
  // the branches: each place hangs off the nearest ancestor the feed also named
  for(const n of nodes){
    if(n.isLabel)continue;
    const parts=n.path.split('/');
    for(let k=parts.length-1;k>0;k--){
      const up=parts.slice(0,k).join('/');
      const a=byPath.get(up);
      if(a&&a!==n){n.up=a;break;}
    }
    if(!n.up){n.root=true;const lab=nodes.find(m=>m.isLabel&&m.island===n.island);if(lab)n.islandX=lab.x;}
  }
}
function podFor(id,kind){
  let p=pods.find(p=>p.id===id);
  if(!p){p=({id,kind,x:W/2,y:water-120,tx:W/2,ty:water-120,trail:[]});pods.push(p);}
  return p;
}
function ingest(d){
  const first=!S;S=d;
  if(first||!nodes.length)layout();
  $('#src').textContent=`${d.repo||'local'} · live · ${(d.tree&&d.tree.repo||[]).length} places · beat ${d.beat_ms||600}ms`;
  // the resident pod
  const pod=podFor('resident','resident');
  const beads=d.beads||[];
  // replay: every bead not yet seen becomes a ping from the pod at that place
  for(const b of beads){
    if(b.n<=seenBead)continue;seenBead=b.n;
    const place=(b.places||[])[0]||null;
    const n=place?byPath.get(place)||[...byPath.keys()].filter(k=>k.startsWith(place)).map(k=>byPath.get(k))[0]:null;
    if(n){pod.tx=n.x;pod.ty=n.y-30;}
    pings.push({x:pod.tx,y:pod.ty,to:n,born:performance.now(),act:b.act,kind:b.place_kind,detail:b.detail||''});
  }
  // the await: the daemon's own heartbeat is the beat, and the return is empty
  const st=(d.shuttle||{}).state||'';
  pod.listening=/listen|await|held/.test(st)||((d.run||{}).name||'').includes('await');
  renderHud(d);
}
function renderHud(d){
  const sh=d.shuttle||{}, run=d.run||{};
  const last=(d.beads||[]).slice(-1)[0]||{};
  $('#state').innerHTML=`<div><span class=amber style="font-size:15px">${run.mood_glyph||'b·_·d'}</span> <span class=v>${sh.state||'unmeasured'}</span></div>`+
   `<div><span class=k>pod</span> <span class=v>${run.name||'—'}</span> · <span class=k>${run.core||''}</span></div>`+
   `<div><span class=k>last act</span> <span class=v>${last.act||'—'}</span> <span class=k>${last.place_kind||''}</span></div>`+
   `<div><span class=k>why</span> <span class=v>${sh.why||'—'}</span></div>`;
  // the belt: the feed's fuel when it has it; else the chip's own reading, labelled
  let vials=[];
  const f=(d.fuel&&d.fuel.buckets)||null;
  if(f){for(const b of f)for(const w of (b.windows||[]))vials.push({n:`${b.name} ${w.name}`,pct:w.pct_left,src:'feed'});}
  else{const chip=(d.hud&&d.hud.chip)||'';const m=chip.match(/q S(\d+)[^W]*W(\d+)/);
    if(m)vials=[{n:'session',pct:+m[1],src:'chip'},{n:'week',pct:+m[2],src:'chip'}];
    else vials=[{n:'fuel',pct:null,src:'none'}];}
  $('#belt').innerHTML=vials.map(v=>`<div class="vial ${num(v.pct)?'':'torn'}"><div class=h><i>${v.n}${v.src==='chip'?' · from the chip':''}</i><b style="color:${heat(v.pct)}">${num(v.pct)?v.pct+' %':'—'}</b></div><div class=bar><i style="width:${num(v.pct)?v.pct:100}%;background:${heat(v.pct)}"></i></div></div>`).join('');
  $('#legend').innerHTML=`<b>light is an act</b> — a ping leaves the pod only when a boundary lands · <b>the ring with no return</b> is the await, on the daemon's own ~10 s beat<br><b>amber</b> warm, touched this week · <b>ice</b> his, and cold readings · <b>black</b> never touched · <b>torn</b> unmeasured`;
}
let CAM={z:1};
// ═══ [FRAME] ═══════════════════════════════════════════════════════════════
// ── the draw · the post-pass lives here ───
function drawWorld(x,now){  // [WORLD] draws; [FRAME] decides where
  drawScene(x,now);
}
function drawScene(x,now){
  // water: a horizon, and the dark below it
  const g=x.createLinearGradient(0,water-180,0,H);
  g.addColorStop(0,'#07060400');g.addColorStop(0.62,'#0a0a10');g.addColorStop(1,'#05060b');
  x.fillStyle=g;x.fillRect(0,water-180,W,H-water+180);
  x.strokeStyle='#2a2a3a';x.lineWidth=1;x.beginPath();x.moveTo(0,water);x.lineTo(W,water);x.stroke();
  // the dive teaser: his ready decisions as ice motes under the surface
  const items=((S&&S.warp&&S.warp.items)||[]).filter(i=>i.type==='decision'&&i.state==='ready');
  items.slice(0,26).forEach((it,i)=>{
    const px=W*0.06+ (i/25)*W*0.88, py=water+46+Math.sin(now/2600+i)*7+ (i%3)*30;
    x.globalAlpha=.5+.3*Math.sin(now/1400+i);x.fillStyle=I;x.beginPath();x.arc(px,py,1.8,0,7);x.fill();x.globalAlpha=1;
  });
  if(items.length){x.fillStyle='#4a6a80';x.font='10px ui-monospace,Menlo,monospace';
    x.fillText(`${items.length} doors below the water — his · dive to read them`,W*0.06,water+26);}
  // the tree
  for(const n of nodes){
    if(n.isLabel){
      x.fillStyle='#161208';x.beginPath();x.moveTo(n.x-n.w*0.36,water);
      x.quadraticCurveTo(n.x,water-16,n.x+n.w*0.36,water);x.closePath();x.fill();
      x.strokeStyle='#3a3020';x.lineWidth=.8;x.beginPath();x.moveTo(n.x-n.w*0.36,water);
      x.quadraticCurveTo(n.x,water-16,n.x+n.w*0.36,water);x.stroke();
      x.fillStyle='#6b5f47';x.font='10px ui-monospace,Menlo,monospace';x.textAlign='center';
      x.fillText(n.label,n.x,water+14);x.textAlign='left';continue;}
    const hv=clamp(n.heat||0,0,1), flare=n.flare;
    // the branch: to its parent place, or down to the island it grew from
    const a=n.up;
    x.strokeStyle=`rgba(110,94,64,${0.12+hv*0.5})`;x.lineWidth=n.up?0.7:1.1;
    x.beginPath();x.moveTo(n.x,n.y);
    if(a){x.bezierCurveTo(n.x,(n.y+a.y)/2,a.x,(n.y+a.y)/2,a.x,a.y);}
    else{x.bezierCurveTo(n.x,(n.y+water)/2,n.x,(n.y+water)/2,n.islandX!=null?n.islandX:n.x,water-4);}
    x.stroke();
    const lum=hv+flare;
    if(lum>0.02){x.save();x.globalCompositeOperation='lighter';
      const r=n.r+14*lum;const rg=x.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
      rg.addColorStop(0,`rgba(242,177,52,${0.30*lum+flare*0.5})`);rg.addColorStop(1,'rgba(242,177,52,0)');
      x.fillStyle=rg;x.beginPath();x.arc(n.x,n.y,r,0,7);x.fill();x.restore();}
    x.fillStyle=lum>0.02?A:'#2b2318';x.globalAlpha=lum>0.02?clamp(0.35+lum,0,1):0.55;
    x.beginPath();x.arc(n.x,n.y,n.r,0,7);x.fill();x.globalAlpha=1;
    n.flare*=0.955;
  }
  // pings: light leaves the pod, reaches the place, the place flares
  const PING=1700;
  pings=pings.filter(p=>{
    const k=(now-p.born)/PING;if(k>1.6)return false;
    const to=p.to;
    if(to){
      const e=clamp(k,0,1), px=p.x+(to.x-p.x)*e, py=p.y+(to.y-p.y)*e;
      x.save();x.globalCompositeOperation='lighter';
      x.strokeStyle=`rgba(242,177,52,${0.75*(1-e)})`;x.lineWidth=1.6;
      x.beginPath();x.moveTo(p.x,p.y);x.lineTo(px,py);x.stroke();
      x.fillStyle=`rgba(255,228,170,${1-e})`;x.beginPath();x.arc(px,py,3.4,0,7);x.fill();x.restore();
      if(e>=1&&!p.hit){p.hit=true;to.flare=1;}
    }else{
      // an act with no place the feed could name: the return comes back torn
      const e=clamp(k,0,1);x.save();x.globalCompositeOperation='lighter';
      for(let i=0;i<4;i++){const a=(hash(p.detail+i)*6.28), rr=40*e+i*4;
        x.strokeStyle=`rgba(242,177,52,${0.16*(1-e)})`;x.lineWidth=1;
        x.beginPath();x.arc(p.x,p.y,rr,a,a+0.5+hash(p.detail+'b'+i));x.stroke();}
      x.restore();
    }
    return true;
  });
  // the pods
  for(const p of pods){
    p.x+=(p.tx-p.x)*0.045;p.y+=(p.ty-p.y)*0.045;
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>60)p.trail.shift();
    x.save();x.globalCompositeOperation='lighter';
    x.beginPath();p.trail.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));
    x.strokeStyle='rgba(242,177,52,0.13)';x.lineWidth=1.2;x.stroke();x.restore();
    // the await sonar: the daemon's real ~10 s heartbeat, and nothing comes back
    if(p.listening){
      const beat=10000, ph=((now%beat)/beat);
      x.save();x.globalCompositeOperation='lighter';
      for(const off of [0,0.34,0.68]){
        const e=(ph+off)%1, rr=18+e*Math.min(W,H)*0.42;
        x.strokeStyle=`rgba(242,177,52,${0.20*(1-e)*(1-e)})`;x.lineWidth=1.4*(1-e)+0.3;
        x.beginPath();x.arc(p.x,p.y,rr,0,7);x.stroke();
      }
      x.restore();
    }
    // the hull
    x.save();x.globalCompositeOperation='lighter';
    const rg=x.createRadialGradient(p.x,p.y,0,p.x,p.y,26);
    rg.addColorStop(0,'rgba(242,177,52,0.35)');rg.addColorStop(1,'rgba(242,177,52,0)');
    x.fillStyle=rg;x.beginPath();x.arc(p.x,p.y,26,0,7);x.fill();x.restore();
    x.strokeStyle=A;x.lineWidth=1.2;x.beginPath();x.ellipse(p.x,p.y,11,6.5,0,0,7);x.stroke();
    x.fillStyle='#0b0906';x.beginPath();x.ellipse(p.x,p.y,7,3.6,0,0,7);x.fill();
    x.fillStyle=A;x.font='10px ui-monospace,Menlo,monospace';x.textAlign='center';
    x.fillText((S&&S.run&&S.run.mood_glyph)||'b·_·d',p.x,p.y-13);x.textAlign='left';
  }
}
function frame(now){        // [FRAME] owns this loop: buffers, effects, chrome
  x.clearRect(0,0,W,H);
  drawWorld(x,now);
  requestAnimationFrame(frame);
}
cv.addEventListener('mousemove',e=>{
  const n=nodes.find(n=>!n.isLabel&&Math.hypot(n.x-e.clientX,n.y-e.clientY)<7);
  const h=$('#hover');
  if(n){h.style.display='block';h.style.left=(e.clientX+12)+'px';h.style.top=(e.clientY+12)+'px';
    h.textContent=`${n.path} · heat ${(n.heat||0).toFixed(2)} · ${n.knots||0} knots · last ${n.last||'—'}`;}
  else h.style.display='none';
});
resize();pull();setInterval(pull,3000);requestAnimationFrame(frame);
</script>
