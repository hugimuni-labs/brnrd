// ═══ end [ACTOR] ═══════════════════════════════════════════════════════════

// ═══ [FRAME] ═══════════════════════════════════════════════════════════════
// ── the draw · the post-pass lives here ───
function drawWorld(x,now){  // [WORLD] draws; [FRAME] decides where
  drawScene(x,now);
}
// ═══════════════════════════════════════════════════════════════════════════
// [FRAME] · the loop · the buffers · the post-pass · the chrome
//
// One light source: acts. Four states — amber warm · ice his and cold ·
// black absent · torn unmeasured. Nothing pulses on a timer. The pass is a
// lens, never a light: it may bend, smear and dim what [WORLD] drew, and it
// may not add a reading. If an effect makes an unmeasured thing look
// measured, it is wrong however good it looks.
//
// Pipeline, per frame:
//   wb   phosphor decay, then drawWorld() — the only buffer that remembers
//   cv   bg · wb · chrome                 — the composed frame
//   q*   bright-pass (square) · blur · 3 channel copies, scaled about centre
//   ov   scanlines × vignette (static) + grain (moving) — darken only
//
// ?fx=off bypasses the whole pass (raw world + raw chrome).
// Also: ?bloom=chain|filter|off · ?ab=off · ?grain=off · ?dither=off
//       ?chrome=off|dom · ?perf=1 · ?tau=<ms> · ?bloomA= · ?abk=
// ═══════════════════════════════════════════════════════════════════════════
const Q=new URLSearchParams(location.search);
let   FX      = Q.get('fx')!=='off';  // ?fx=off, or flipped live by __fxSet
const CHROME  = Q.get('chrome')!=='off' && Q.get('chrome')!=='dom';
const BLOOM   = Q.get('bloom')||'chain';
let   AB      = Q.get('ab')!=='off';
const GRAIN   = Q.get('grain')!=='off';
const DITHER  = Q.get('dither')==='on';     // off: a screen-space pattern inside the
                                            // phosphor is a texture the bloom then
                                            // blurs — light must carry no pattern
const PERF    = Q.get('perf')==='1';
const SYNC    = Q.get('sync')==='1';        // measurement only: a 1×1 readback per
                                            // frame flushes the GPU pipeline, so the
                                            // timed span includes the work the driver
                                            // would otherwise defer past it
const TAU     = +(Q.get('tau')||380);       // ms · a ghost reaches 2 % in ~1.5 s
const BLOOM_A = +(Q.get('bloomA')||0.45);
const BP      = +(Q.get('bp')||8);          // the bright-pass exponent: v→v^BP
const AB_K    = +(Q.get('abk')||0.00085);   // ±0.6 px at the edge of a 1440 frame
const BG='#070604', DIM='#6b5f47', INK='#e8dcc0', ABSENT='#5a4d3c', GLASS='#1b1610';
// (duplicate `const MONO` from the merge — both regions declared it; the first stands)

const mk=()=>document.createElement('canvas');
const wb=mk(), wx=wb.getContext('2d');                       // the phosphor
const ws=mk(), sx=ws.getContext('2d');                       // this frame's world, clean
const half=mk(), qA=mk(), qB=mk(), eA=mk(), sA=mk(), tA=mk(), bt=mk(), qC=mk();// the bloom ladder
const OV=[mk(),mk(),mk(),mk()];                              // scanlines × grain × vignette
const gr=mk();                                               // the grain tile
const dz=mk();                                               // the dither tile
const cb=mk();                                               // the chrome plate
const cx2=c=>c.getContext('2d');
let grainPat=null, ditherPat=null, lastNow=0, BW=0,BH=0, chromeKey='';

function mkNoise(c,size,fn){c.width=c.height=size;const g=cx2(c),d=g.createImageData(size,size);
  for(let i=0;i<size*size;i++){const a=fn();d.data[i*4]=0;d.data[i*4+1]=0;d.data[i*4+2]=0;d.data[i*4+3]=a;}
  g.putImageData(d,0,0);}

function ensureBuffers(){
  if(wb.width===cv.width&&wb.height===cv.height&&cv.width)return;
  wb.width=cv.width;wb.height=cv.height;ws.width=cv.width;ws.height=cv.height;
  wx.setTransform(1,0,0,1,0,0);wx.globalCompositeOperation='source-over';wx.globalAlpha=1;
  wx.fillStyle='#000';wx.fillRect(0,0,wb.width,wb.height);   // opaque: alpha pinned at 1
  BW=Math.max(2,Math.round(cv.width/4));BH=Math.max(2,Math.round(cv.height/4));
  half.width=Math.max(2,Math.round(cv.width/2));half.height=Math.max(2,Math.round(cv.height/2));
  for(const c of [qA,qB,bt,qC]){c.width=BW;c.height=BH;}
  eA.width=Math.max(1,BW>>1);eA.height=Math.max(1,BH>>1);
  sA.width=Math.max(1,BW>>2);sA.height=Math.max(1,BH>>2);
  tA.width=Math.max(1,BW>>3);tA.height=Math.max(1,BH>>3);
  for(const c of [half,qA,qB,eA,sA,tA,bt,qC]){const g=cx2(c);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';}
  cb.width=cv.width;cb.height=cv.height;chromeKey='';
  if(!grainPat){mkNoise(gr,180,()=>Math.random()*22|0);grainPat=cx2(OV[0]).createPattern(gr,'repeat');}
  if(!ditherPat){mkNoise(dz,64,()=>Math.random()<0.06?96:0);ditherPat=cx2(OV[0]).createPattern(dz,'repeat');}
  buildOverlay();
}

// ── the overlay: scanlines and vignette, built once per size ───────────────
// Screen space, device-pixel aligned, never moved by the camera — a scanline
// that travels with the world shimmers, and this one cannot travel.
// Four variants with the grain baked in, picked at random each frame: the
// overlay is then one drawImage instead of a drawImage plus a full-res pattern
// fill, and the grain still moves.
function buildOverlay(){
  const per=Math.max(2,Math.round(3*DPR)), dark=Math.max(1,Math.round(DPR));
  for(const o of OV){
    o.width=cv.width;o.height=cv.height;const g=cx2(o);
    g.clearRect(0,0,o.width,o.height);
    g.globalAlpha=1;g.fillStyle='rgba(0,0,0,0.10)';
    for(let y=0;y<o.height;y+=per)g.fillRect(0,y,o.width,dark);
    if(GRAIN){g.save();g.globalAlpha=0.5;g.fillStyle=g.createPattern(gr,'repeat');
      g.translate(Math.random()*180|0,Math.random()*180|0);
      g.fillRect(-180,-180,o.width+360,o.height+360);g.restore();}
    const cxp=o.width/2, cyp=o.height/2, r=Math.hypot(cxp,cyp);
    const vg=g.createRadialGradient(cxp,cyp,r*0.35,cxp,cyp,r);
    // pulled back from 0.20/0.52: the corners are where the dim end of the scene
    // lives — the never-touched places and the legend that names them — and a
    // vignette that reads well on the pod costs the 'black' state its legibility
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.72,'rgba(0,0,0,0.13)');vg.addColorStop(1,'rgba(0,0,0,0.38)');
    g.fillStyle=vg;g.fillRect(0,0,o.width,o.height);
    // the glass edge: the frame is a tube, and a tube has corners it cannot reach
    g.strokeStyle='rgba(0,0,0,0.55)';g.lineWidth=Math.max(2,6*DPR);
    g.strokeRect(g.lineWidth/2,g.lineWidth/2,o.width-g.lineWidth,o.height-g.lineWidth);
  }
  ditherPat=cx2(OV[0]).createPattern(dz,'repeat');
}

// ── 1 · the phosphor ───────────────────────────────────────────────────────
// Stop clearing. Erode what is there toward nothing, frame-rate independent,
// so a ping that crossed the tree a second ago is still faintly on the glass.
//
// A phosphor is excited to a brightness and decays from it; it does not sum.
// Two ways to get that wrong, both measured here, both of which produced the
// same hard-edged disc on every warm node — 'the glow reads cheap':
//
//   summing   — drawing this frame onto the decayed one with 'lighter' amplifies
//               every static source by 1/(1-e^-dt/τ) ≈ 24× at 60 fps.
//   alpha     — 'lighten' blends *colour* as a max but still composites *alpha*
//               as a union (αs+αb−αs·αb), so on a transparent buffer a gradient
//               drawn at α=0.3 climbs to opaque in ~10 frames. Same disc, and it
//               survives with the bloom switched off, which is how it was caught.
//
// So the buffer is opaque and grounded on black: alpha is pinned at 1, 'lighten'
// is a true per-channel max, and the frame composites it additively over the
// background. Decay is two moves, because one does not reach zero: a proportional
// fade (the ~1.5 s curve) plus a 'color-burn' constant that subtracts ~1 level a
// frame and clamps at 0. Without the second, an 8-bit channel stalls wherever the
// proportional step rounds below half a level and parks a permanent smear where
// the pod has been, at about 4 % — dim, and never going anywhere.
//
// The dither is the older fix for that floor and is off by default: a screen-space
// pattern inside the buffer the bloom reads is a texture on the light itself.
function phosphor(dt,src){
  wx.save();wx.setTransform(1,0,0,1,0,0);wx.globalAlpha=1;
  wx.globalCompositeOperation='source-over';                 // proportional: the curve
  wx.fillStyle=`rgba(0,0,0,${1-Math.exp(-dt/TAU)})`;
  wx.fillRect(0,0,wb.width,wb.height);
  wx.globalCompositeOperation='color-burn';                  // constant: the floor
  wx.fillStyle='rgb(254,254,254)';
  wx.fillRect(0,0,wb.width,wb.height);
  if(DITHER&&ditherPat){wx.globalCompositeOperation='destination-out';wx.fillStyle=ditherPat;
    wx.translate(Math.random()*64|0,Math.random()*64|0);
    wx.fillRect(-64,-64,wb.width+128,wb.height+128);wx.setTransform(1,0,0,1,0,0);}
  wx.globalCompositeOperation='lighten';                     // excite: a true max
  wx.drawImage(src,0,0);
  wx.restore();
}

// ── 2 · bloom ──────────────────────────────────────────────────────────────
// Wide and weak, over a high threshold. The threshold is a power curve built
// from repeated 'multiply' — v → v^8 — which costs three quarter-res draws and
// no pixel readback: 1.0 survives, 0.85 falls to 0.27, 0.5 to 0.004. That is what
// reserves the halo for what an act *just* lit — the pod, a ping in flight, a
// place still flaring — and leaves a warm-but-older node a bright core and
// nothing around it. Light decays to a core, not to a smaller disc.
//
// Then four octaves down to 1/32, weighted 35/36/21/8 from 1/4 outward — enough
// width that no halo has a findable edge, little enough of the widest octave
// that a crowded canopy does not wash the black. A tight bright blur clips
// channels and walks amber toward white; a wide dim one adds light without
// giving anything a shape it did not already have.
function bloomPass(){
  if(BLOOM==='off')return null;
  const h=cx2(half), a=cx2(qA), b=cx2(qB);
  h.globalCompositeOperation='source-over';h.globalAlpha=1;
  h.clearRect(0,0,half.width,half.height);h.drawImage(cv,0,0,half.width,half.height);
  a.globalCompositeOperation='source-over';a.globalAlpha=1;
  a.clearRect(0,0,BW,BH);a.drawImage(half,0,0,BW,BH);
  b.globalCompositeOperation='source-over';b.globalAlpha=1;
  b.clearRect(0,0,BW,BH);b.drawImage(qA,0,0);
  b.globalCompositeOperation='multiply';b.drawImage(qA,0,0);
  const c=cx2(qC);
  for(let k=2;k<BP;k*=2){                       // v² → v⁴ → v⁸, one draw-pair each
    c.globalCompositeOperation='source-over';c.globalAlpha=1;
    c.clearRect(0,0,BW,BH);c.drawImage(qB,0,0);
    b.globalCompositeOperation='multiply';b.drawImage(qC,0,0);
  }
  b.globalCompositeOperation='source-over';
  if(BLOOM==='filter'){
    a.clearRect(0,0,BW,BH);a.filter='blur(9px)';a.drawImage(qB,0,0);a.filter='none';
    return qA;
  }
  const e=cx2(eA), s=cx2(sA), t=cx2(tA);
  e.clearRect(0,0,eA.width,eA.height);e.drawImage(qB,0,0,eA.width,eA.height);
  s.clearRect(0,0,sA.width,sA.height);s.drawImage(eA,0,0,sA.width,sA.height);
  t.clearRect(0,0,tA.width,tA.height);t.drawImage(sA,0,0,tA.width,tA.height);
  a.clearRect(0,0,BW,BH);a.globalAlpha=1;a.drawImage(tA,0,0,BW,BH);
  a.globalAlpha=0.72;a.drawImage(sA,0,0,BW,BH);
  a.globalAlpha=0.55;a.drawImage(eA,0,0,BW,BH);
  a.globalAlpha=0.35;a.drawImage(qB,0,0,BW,BH);
  a.globalAlpha=1;
  return qA;
}

// ── 3 · chromatic aberration ───────────────────────────────────────────────
// Lateral, which is what a real lens does: the channels are the same image at
// slightly different magnifications, so the error is zero at the centre and
// grows to ±0.6 px at the edge. A constant offset would smear the middle of
// the frame too, and that reads as "blurry", not as glass.
const CHAN=[['#ff0000',1+AB_K],['#00ff00',1],['#0000ff',1-AB_K]];
function composite(bloom){
  if(!bloom)return;
  x.save();x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='lighter';x.globalAlpha=BLOOM_A;
  if(!AB){x.drawImage(bloom,0,0,cv.width,cv.height);}
  else{
    // The split happens at bloom resolution, not screen resolution: the offsets
    // are relative, so a quarter-res scale is the same screen displacement, and
    // the frame pays one full-res composite instead of three.
    const g=cx2(bt), c=cx2(qC);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;g.clearRect(0,0,BW,BH);
    g.globalCompositeOperation='lighter';
    for(const [tint,s] of CHAN){
      c.globalCompositeOperation='source-over';c.globalAlpha=1;
      c.clearRect(0,0,BW,BH);c.drawImage(bloom,0,0);
      c.globalCompositeOperation='multiply';c.fillStyle=tint;c.fillRect(0,0,BW,BH);
      c.globalCompositeOperation='source-over';
      const w=BW*s, hh=BH*s;
      g.drawImage(qC,(BW-w)/2,(BH-hh)/2,w,hh);
    }
    g.globalCompositeOperation='source-over';
    x.drawImage(bt,0,0,cv.width,cv.height);
  }
  x.restore();
}

// ── 4 · scanlines · grain · vignette ───────────────────────────────────────
// One pass, all of it darkening only. Additive grain would light the black,
// and the black is a reading: never touched. So the grain multiplies down.
function overlayPass(){
  x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.drawImage(OV[Math.random()*4|0],0,0);
  x.restore();
}

// ── the chrome, made diegetic ──────────────────────────────────────────────
// The readings are not mine to compute. [WORLD] renders them — today into the
// hidden #state/#belt/#legend/#top panels, tomorrow through worldHud() when it
// lands. Both are read, never recomputed: the vial's colour is the colour
// heat() already chose, lifted off the element [WORLD] wrote it onto. This is
// a renderer for [WORLD]'s HUD, not a second opinion about the numbers.
function hudModel(){
  if(typeof worldHud==='function'){
    try{
      const h=worldHud();
      if(h) return {
        title:'brnrd', sub:'/ THE PODS · scene one · above the water',
        src:(($('#src')||{}).textContent)||'',
        rows:[[{t:(h.pod&&h.pod.glyph)||'b·_·d',ink:'glyph'},{t:' '+(h.state||'unmeasured'),ink:'v'}],
              [{t:'pod ',ink:'k'},{t:(h.pod&&h.pod.name)||'—',ink:'v'},{t:' · '+((h.pod&&h.pod.core)||''),ink:'k'}],
              [{t:'last act ',ink:'k'},{t:(h.last&&h.last.act)||'—',ink:'v'},{t:' '+((h.last&&h.last.kind)||''),ink:'k'}],
              [{t:'why ',ink:'k'},{t:h.why||'—',ink:'v'}]],
        vials:(h.vials||[]).map(v=>({n:v.n+(v.src==='chip'?' · from the chip':''),
          pct:typeof v.pct==='number'&&isFinite(v.pct)?v.pct:null,
          text:typeof v.pct==='number'&&isFinite(v.pct)?v.pct+' %':'—',
          color:heat(v.pct),torn:!(typeof v.pct==='number'&&isFinite(v.pct))})),
        legend:legendFromDom()
      };
    }catch(e){}
  }
  return domHud();
}
const INKS={k:ABSENT,v:INK,amber:A,ice:I,glyph:A,b:DIM,'':ABSENT};
function runsOf(el){
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){const t=n.textContent;if(t.trim()||t===' ')out.push({t,ink:''});}
    else if(n.tagName==='BR')out.push({br:true});
    else out.push({t:n.textContent,ink:n.tagName==='B'?'b':(n.className||'')});
  });
  return out;
}
function legendFromDom(){
  const el=$('#legend');if(!el)return [];
  const lines=[[]];
  for(const r of runsOf(el)){if(r.br)lines.push([]);else lines[lines.length-1].push(r);}
  return lines;
}
function domHud(){
  const st=$('#state'), belt=$('#belt');
  const rows=st?[...st.children].map((d,i)=>runsOf(d).map(r=>i===0&&r.ink==='amber'?{...r,ink:'glyph'}:r)):[];
  const vials=belt?[...belt.querySelectorAll('.vial')].map(v=>{
    const b=v.querySelector('.h b'), i=v.querySelector('.h i'), f=v.querySelector('.bar i');
    const torn=v.classList.contains('torn');
    return {n:i?i.textContent:'', text:b?b.textContent:'—', color:b?b.style.color||DIM:DIM,
            pct:torn?null:parseFloat((f&&f.style.width)||'0'), torn};
  }):[];
  return {title:($('#top b')||{}).textContent||'brnrd',
          sub:(($('#top span')||{}).textContent)||'',
          src:(($('#src')||{}).textContent)||'', rows, vials, legend:legendFromDom()};
}
function hair(g,x1,y1,x2,y2,a){g.strokeStyle=`rgba(154,133,94,${a})`;g.lineWidth=1;
  g.beginPath();g.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);g.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);g.stroke();}
function runLine(g,runs,px,py,size){
  let cur=px;
  for(const r of runs){
    if(r.br||!r.t)continue;
    const glyph=r.ink==='glyph';
    g.font=`${glyph?size+3:size}px ${MONO}`;
    g.fillStyle=INKS[r.ink]!==undefined?INKS[r.ink]:INK;
    g.fillText(r.t,cur,py);cur+=g.measureText(r.t).width;
  }
  return cur;
}
function drawChrome(g){
  const m=hudModel();
  g.textAlign='left';g.textBaseline='alphabetic';
  // ── the head rule ──
  g.font=`650 13px ${MONO}`;g.fillStyle=INK;g.fillText(m.title,16,25);
  const tw=g.measureText(m.title).width;
  g.font=`10px ${MONO}`;g.fillStyle=DIM;g.fillText(m.sub,16+tw+8,25);
  g.fillStyle=ABSENT;g.textAlign='right';g.fillText(m.src,W-16,25);g.textAlign='left';
  hair(g,16,36,W-16,36,0.26);
  hair(g,16,36,16,30,0.26);hair(g,W-16,36,W-16,30,0.26);        // the corner ticks
  // ── the state block: a bracket, and the readings inside it ──
  let y=60;
  const bx=16, bw=300;
  hair(g,bx,y-14,bx,y-14+(m.rows.length*19)+6,0.24);
  hair(g,bx,y-14,bx+9,y-14,0.24);hair(g,bx,y-14+(m.rows.length*19)+6,bx+9,y-14+(m.rows.length*19)+6,0.24);
  m.rows.forEach((r,i)=>{runLine(g,r,bx+12,y+i*19,11);});
  // ── the belt: etched glass, and the fill is the reading's own colour ──
  const vw=196, vx=W-16-vw;
  let vy=54;
  for(const v of m.vials){
    g.font=`10px ${MONO}`;g.fillStyle=DIM;g.fillText(v.n,vx,vy);
    g.font=`15px ${MONO}`;g.fillStyle=v.torn?ABSENT:v.color;g.textAlign='right';
    g.fillText(v.text,vx+vw,vy+1);g.textAlign='left';
    const gy=vy+9, gh=11;
    // the glass: a body, two lips, a specular line
    g.fillStyle=GLASS;g.fillRect(vx,gy,vw,gh);
    if(v.torn){
      g.save();g.beginPath();g.rect(vx,gy,vw,gh);g.clip();
      g.strokeStyle='rgba(90,77,60,0.55)';g.lineWidth=1;
      for(let hx=-gh;hx<vw+gh;hx+=6){g.beginPath();g.moveTo(vx+hx,gy+gh);g.lineTo(vx+hx+gh,gy);g.stroke();}
      g.restore();
    }else{
      const fw=Math.max(0,Math.min(1,v.pct/100))*vw;
      g.fillStyle=v.color;g.globalAlpha=0.85;g.fillRect(vx,gy,fw,gh);g.globalAlpha=1;
      g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(vx,gy+1,fw,1);
      for(const f of [0.25,0.5,0.75]){hair(g,vx+vw*f,gy+gh-4,vx+vw*f,gy+gh,0.30);}
    }
    hair(g,vx,gy,vx+vw,gy,0.30);hair(g,vx,gy+gh,vx+vw,gy+gh,0.30);
    hair(g,vx,gy,vx,gy+gh,0.42);hair(g,vx+vw,gy,vx+vw,gy+gh,0.42);
    vy+=42;
  }
  // ── the legend, under its own rule ──
  const ll=m.legend.filter(l=>l.length);
  if(ll.length){
    const ly=H-14-(ll.length-1)*16;
    hair(g,16,ly-16,16+380,ly-16,0.14);
    ll.forEach((l,i)=>runLine(g,l,16,ly+i*16,10));
  }
}

// The plate is redrawn when [WORLD]'s HUD changes, not sixty times a second:
// the signature is the markup [WORLD] wrote, so a reading that moves redraws
// the chrome and a reading that stands still costs one drawImage.
function chromePlate(){
  const key=[($('#state')||{}).innerHTML,($('#belt')||{}).innerHTML,
             ($('#legend')||{}).innerHTML,($('#src')||{}).textContent,W,H].join('\u0001');
  if(key!==chromeKey){
    chromeKey=key;const g=cx2(cb);
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cb.width,cb.height);
    g.setTransform(DPR,0,0,DPR,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;
    drawChrome(g);
  }
  x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.drawImage(cb,0,0);x.restore();
}

// ── the loop ───────────────────────────────────────────────────────────────
const RING=[]; let fpsWin=[], stat={frame:0,world:0,pass:0,chrome:0,fps:0};
function perf(now,total,world,chromeMs,passMs){
  RING.push([total,world,chromeMs,passMs]);if(RING.length>90)RING.shift();
  fpsWin.push(now);while(fpsWin.length&&now-fpsWin[0]>1000)fpsWin.shift();
  const n=RING.length,s=RING.reduce((a,r)=>[a[0]+r[0],a[1]+r[1],a[2]+r[2],a[3]+r[3]],[0,0,0,0]);
  stat={frame:s[0]/n,world:s[1]/n,chrome:s[2]/n,pass:s[3]/n,fps:fpsWin.length};
  window.__fx={on:FX,bloom:FX?BLOOM:'off',ab:FX&&AB,chrome:CHROME,dpr:DPR,w:W,h:H,
    frameMs:+stat.frame.toFixed(3),worldMs:+stat.world.toFixed(3),
    chromeMs:+stat.chrome.toFixed(3),passMs:+stat.pass.toFixed(3),fps:stat.fps,frames:RING.length};
}
// One hook, for the rehearsal harness: the same scene state, photographed with
// the pass on and off, is a comparison two page loads cannot make.
window.__fxSet=(v,k)=>{
  if(k==='ab'){AB=!!v;return AB;}
  FX=!!v;if(!FX){wx.save();wx.setTransform(1,0,0,1,0,0);
    wx.globalCompositeOperation='source-over';wx.globalAlpha=1;
    wx.fillStyle='#000';wx.fillRect(0,0,wb.width,wb.height);wx.restore();}
  return FX;};
function frame(now){        // [FRAME] owns this loop: buffers, effects, chrome
  const p0=performance.now();
  ensureBuffers();
  const dt=Math.max(1,Math.min(100,now-(lastNow||now-16)));lastNow=now;
  // this frame's world, drawn clean, then merged into the phosphor
  x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.fillStyle=BG;x.fillRect(0,0,cv.width,cv.height);x.restore();
  if(FX){
    // grounded on opaque black, not cleared: 'lighten' takes the max of two
    // *unpremultiplied* colours, so a glow drawn at α=0.3 onto a transparent
    // scratch converges the phosphor to full-strength amber across the whole
    // gradient — the flat disc again. Over opaque black the scratch already
    // holds what the glow looks like, and the max is the max of what is seen.
    sx.save();sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='source-over';
    sx.globalAlpha=1;sx.fillStyle='#000';sx.fillRect(0,0,ws.width,ws.height);sx.restore();
    sx.save();sx.setTransform(DPR,0,0,DPR,0,0);sx.globalCompositeOperation='source-over';sx.globalAlpha=1;
    drawWorld(sx,now);sx.restore();
    phosphor(dt,ws);
    x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';x.globalAlpha=1;
    x.drawImage(wb,0,0);x.restore();
  }else{
    x.save();x.setTransform(DPR,0,0,DPR,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
    drawWorld(x,now);x.restore();
  }
  const p1=performance.now();
  // chrome, in the same ink, under the same glass
  if(CHROME)chromePlate();
  const p2=performance.now();
  if(FX){composite(bloomPass());overlayPass();}
  if(SYNC)x.getImageData(0,0,1,1);
  const p3=performance.now();
  if(PERF){x.save();x.setTransform(DPR,0,0,DPR,0,0);x.font=`10px ${MONO}`;x.fillStyle=DIM;x.textAlign='right';
    x.fillText(`${stat.fps} fps · frame ${stat.frame.toFixed(2)} ms · pass ${stat.pass.toFixed(2)} ms · chrome ${stat.chrome.toFixed(2)} ms · ${FX?BLOOM:'fx off'}`,W-16,H-6);
    x.restore();}
  perf(now,p3-p0,p1-p0,p2-p1,p3-p2);
  requestAnimationFrame(frame);
}
if(CHROME)for(const id of ['top','state','belt','legend']){const el=$('#'+id);if(el)el.style.display='none';}
addEventListener('resize',()=>{wb.width=0;});
cv.addEventListener('mousemove',e=>{
  const n=nodes.find(n=>!n.isLabel&&Math.hypot(n.x-e.clientX,n.y-e.clientY)<7);
  const h=$('#hover');
  if(n){h.style.display='block';h.style.left=(e.clientX+12)+'px';h.style.top=(e.clientY+12)+'px';
    h.textContent=`${n.path} · heat ${(n.heat||0).toFixed(2)} · ${n.knots||0} knots · last ${n.last||'—'}`;}
  else h.style.display='none';
});
resize();pull();setInterval(pull,3000);requestAnimationFrame(frame);
</script>
