      g.lineWidth=(a?0.7:1.1);
      g.beginPath();g.moveTo(n.x,ny);
      if(a){const ay=rootY(a,z);g.bezierCurveTo(n.x,(ny+ay)/2,a.x,(ny+ay)/2,a.x,ay);}
      else g.lineTo(n.x,waterAt(z)+bandAt(z)-2);
      g.stroke();
      const rr=Math.max(0.8,n.r*(0.5+0.5*(1-diveAt(z))));
      if(lum>0.02&&dp>14){
        g.save();g.globalCompositeOperation='lighter';
        const R2=rr+12*lum, rg=g.createRadialGradient(n.x,ny,0,n.x,ny,R2);
        rg.addColorStop(0,`rgba(242,177,52,${0.26*lum})`);rg.addColorStop(1,'rgba(242,177,52,0)');
        g.fillStyle=rg;g.beginPath();g.arc(n.x,ny,R2,0,7);g.fill();g.restore();
      }
      g.fillStyle=lum>0.02?A:'#2b2318';
      g.globalAlpha=lum>0.02?clamp(0.35+lum,0,1):0.5;
      g.beginPath();g.arc(n.x,ny,rr,0,7);g.fill();g.globalAlpha=1;
      if(lam.has(n.path)){            // the fold, where a pass touched a page
        g.strokeStyle=INK;g.lineWidth=1;
        g.beginPath();g.arc(n.x,ny,rr+3.5,0,7);g.stroke();
      }
    }
    if(dp>26&&R.rootTops){            // the three tops name themselves
      g.font=`9px ${MONO}`;g.textAlign='center';
      g.globalAlpha=clamp((dp-26)/40,0,1);
      for(const t of R.rootTops){
        if(t.w<t.top.length*6.6+10)continue;
        g.fillStyle='#5f5642';g.fillText(`${t.top} \u00b7 ${t.n}`,t.x,rootY({e:1},z)+11);
      }
      g.globalAlpha=1;g.textAlign='left';
    }
    g.restore();
  }

  // ── geometry ─────────────────────────────────────────────────────────────
  // THE CLOTH YIELDS. Where a window and a stream want the same pixels, the
  // stream is the one that moves: the cloth's right end stops at the room
  // card's left edge instead of being clipped out from under its own key row.
  function geom(){
    const n=R.passes.length||1;
    const cd=(typeof RESERVE!=='undefined'&&RESERVE.card)||null;
    const x0=W*0.045, base=H-BOTTOM;
    const x1=Math.max(x0+60,Math.min(W*0.975,cd?cd.x-10:W*0.975));
    const pw=(x1-x0)/n, gap=Math.min(2.2,pw*0.22);
    return R.geom={x0,x1,base,pw,gap,n};
  }
  const dur=p=>num(p.duration_s)?p.duration_s
    :(p.t1&&p.t0?(p.t1-p.t0)/1000:(p.live&&p.t0?(Date.now()-p.t0)/1000:0));
  const plaqueH=p=>5+16*clamp(Math.log10(1+Math.max(0,dur(p))/60)/Math.log10(4401),0,1);
  const plaqueX=i=>{const g=R.geom;return {x:g.x0+i*g.pw+g.gap/2,w:Math.max(1.6,g.pw-g.gap)};};
  // recency is a reading: the same week-long curve the rooms are lit by
  const recency=p=>{const t=p.live?Date.now():(p.t1||p.t0);
    return t?clamp(1-(Date.now()-t)/(7*DAY),0,1):null;};
  const fmtDur=s=>s>=3600?`${(s/3600).toFixed(1)} h`:s>=60?`${Math.round(s/60)} min`:`${Math.round(s)} s`;

  // ── 1 · the cloth: one plaque per pass, time left to right ───────────────
  function drawCloth(g){
    const G=geom(), lit=litPasses(), s=sel();
    g.save();g.font=`9px ${MONO}`;
    g.strokeStyle='rgba(90,77,60,0.30)';g.lineWidth=1;
    g.beginPath();g.moveTo(G.x0,Math.round(G.base)+.5);g.lineTo(G.x1,Math.round(G.base)+.5);g.stroke();
    g.fillStyle='#4a4336';g.textAlign='right';
    g.fillText('THE CLOTH',G.x0-6,G.base-1);g.textAlign='left';
    let lastDay=null;
    const NOW=performance.now();
    R.passes.forEach((p,i)=>{
      const {x:px,w:pw}=plaqueX(i), ph=plaqueH(p), rc=recency(p);
      const gk=glitchK(p.born,NOW);           // A NEW PASS LANDING IS AN ARRIVAL
      const y=G.base-(p.parent?3:0), top=y-ph;
      const d=p.t0?Math.floor(p.t0/DAY):null;
      if(d!==null&&d!==lastDay){          // the time axis, said where the day turns
        lastDay=d;
        g.strokeStyle='rgba(90,77,60,0.18)';g.lineWidth=1;
        g.beginPath();g.moveTo(Math.round(px)+.5,G.base+1);g.lineTo(Math.round(px)+.5,G.base+9);g.stroke();
        if(pw>3.2){g.fillStyle='#3f3a30';g.fillText(new Date(p.t0).toISOString().slice(5,10),px+2,G.base+9);}
      }
      const a=rc===null?0.22:0.20+0.62*rc;
      g.fillStyle=R.tint(p.topics,a*0.55);g.fillRect(px,top,pw,ph);
      g.strokeStyle=rc===null?'rgba(90,77,60,0.45)':R.tint(p.topics,Math.min(1,a+0.22));
      g.lineWidth=0.8;
      if(p.live){                         // the live run: a plaque with no right wall
        g.beginPath();g.moveTo(px,y);g.lineTo(px,top);g.lineTo(px+pw,top);g.stroke();
        g.fillStyle=A;g.beginPath();g.arc(px+pw/2,top-4,1.6,0,7);g.fill();
      }else g.strokeRect(px,top,pw,Math.max(1,ph));
      if((p.prs||[]).length&&pw>2.6){     // produce: a notch of his ice on the lip
        g.fillStyle='rgba(143,211,255,0.55)';g.fillRect(px,top-2,Math.min(pw,2.2),1.6);}
      if(!num(p.tokens)&&pw>3){           // torn: a pass whose spend was never read
        g.strokeStyle='rgba(90,77,60,0.40)';g.lineWidth=0.6;
        g.beginPath();g.moveTo(px,y+2.5);g.lineTo(px+pw,y+2.5);g.stroke();}
      const k=lit.get(p.run);
      if(k){                              // THE FOLD, inward: lit in interface ink
        g.strokeStyle=INK;g.lineWidth=1;
        g.beginPath();g.moveTo(px-0.5,top-4.5);g.lineTo(px-0.5,top-8.5);
        g.lineTo(px+pw+0.5,top-8.5);g.lineTo(px+pw+0.5,top-4.5);g.stroke();
        if(pw>5&&s&&s.kind==='room'){g.fillStyle=INK;g.textAlign='center';g.font=`8px ${MONO}`;
          g.fillText(String(k),px+pw/2,top-10);g.textAlign='left';g.font=`9px ${MONO}`;}
      }
      if(R.pass===p.run){                 // the selected pass
        g.strokeStyle=INK;g.lineWidth=1.2;g.strokeRect(px-1.5,top-2.5,pw+3,ph+4.5);
        const j=p.parent?R.passes.findIndex(q=>q.run===p.parent):-1;
        if(j>=0){                         // parentage, drawn only when asked for
          const q=plaqueX(j);
          g.strokeStyle='rgba(232,220,192,0.35)';g.lineWidth=0.8;g.setLineDash([2,2]);
          g.beginPath();g.moveTo(px+pw/2,y+2);g.lineTo(px+pw/2,G.base+13);
          g.lineTo(q.x+q.w/2,G.base+13);g.lineTo(q.x+q.w/2,G.base+2);g.stroke();g.setLineDash([]);
        }
      }
      if(R.cursor===i&&R.pass!==p.run){
        g.strokeStyle='rgba(232,220,192,0.45)';g.lineWidth=1;
        g.beginPath();g.moveTo(px+pw/2,G.base+2);g.lineTo(px+pw/2,G.base+5);g.stroke();}
      if(gk!==null)glitchSlices(g,px-4,top,pw+8,Math.max(3,ph),gk,INK);
    });
    // THE TOPIC LEGEND ROW IS DELETED. We settled today that a topic is a deck
    // and an item is a room on it — so the decks ARE the legend, and a chip row
    // duplicated the one place that owns topics while reading as a filter bar
    // out of the old dashboard. The tint itself stays: the tint is what was
    // asked for. This block's keys ride the cloth's own label row now, not a
    // row of their own, because a row of their own was one of the four bands.
    g.fillStyle='rgba(74,67,54,0.9)';g.textAlign='right';
    g.fillText('\u2190 \u2192 scrub \u00b7 L history \u00b7 P body \u00b7 \u21b5 inspect \u00b7 Esc',G.x1,G.base-1);
    g.textAlign='left';
    const say=foldSay();
    if(say){g.fillStyle=INK;g.globalAlpha=0.85;g.fillText(say,G.x0,G.base-SAY);g.globalAlpha=1;}
    g.restore();
  }
  // the fold, said out loud — including the case the brief singled out: a room
  // with no footprints must say so instead of reading as unvisited-by-choice.
  function foldSay(){
    if(R.pass){
      const m=R.roomsOf(R.pass), n=[...m.values()].reduce((a,b)=>a+b,0), p=R.byRun.get(R.pass);
      const who=p?`${p.name||p.title||R.pass} · ${p.shell||'?'}/${p.core||'?'}`:R.pass;
      return m.size?`${who} → ${m.size} room${m.size>1?'s':''} · ${n} footprint${n>1?'s':''} · lit in the warp`
        :`${who} — this pass left no footprint in any room · ${(p&&p.knots)||0} knots, ${(p&&p.pages)||0} pages`;
    }
    if(R.place){
      const m=R.passesOfPlace(R.place), n=[...m.values()].reduce((a,b)=>a+b,0);
      const root=R.byRoot&&R.byRoot.has(R.place);
      return m.size?`${R.place} \u2192 ${m.size} pass${m.size>1?'es':''} \u00b7 ${n} touch${n>1?'es':''} \u00b7 lit on the cloth`
        :`${R.place} \u2014 no pass in the record's ${R.passes.length} names this place`
          +(root?' \u00b7 and no pass ever names a home place: the trail carries only repo paths':'');
    }
    const s=sel();if(!s)return null;
    if(s.kind==='deck'){
      const m=R.passesOfDeck(s.id);
      return `deck ${s.id} → ${m.size} of ${R.passes.length} passes carried it`;
    }
    const m=R.passesOf(s.id), n=[...m.values()].reduce((a,b)=>a+b,0);
    const it=itemOf(s.id), v=it&&it.it.visited_at;
    if(!m.size)return `${s.id} — no pass in the record's ${R.passes.length} left a footprint here`
      +(v?` · the warp says visited ${v}, so the record is thinner than the warp`
         :' · and the warp has no visit for it either: never entered, not un-drawn');
    return `${s.id} → ${m.size} pass${m.size>1?'es':''} · ${n} footprint${n>1?'s':''} · lit on the cloth`;
  }

  // ── 2 · the fold outward, drawn over the warp ────────────────────────────
  // The rooms are [WORLD]'s to draw and [ACTOR]'s to select; the fold only adds
  // its own mark over them, so neither loop needs an edit. A bracket, not a
  // glow: selection is interface, and the light in this scene means an act.
  function drawLitRooms(g,z,rms){
    const m=litRooms();if(!m.size||!rms||!rms.length)return;
    const rs=roomAt(z);
    g.save();g.strokeStyle=INK;g.lineWidth=1;g.font=`8px ${MONO}`;
    for(const r of rms){
      const k=m.get(r.it.id);if(!k)continue;
      const {x:rx,y:ry}=roomXY(r,z);
      const w=Math.max(3,r.rw*rs)/2+2.5, h=Math.max(3,r.rh*rs)/2+2.5;
      for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        g.beginPath();
        g.moveTo(rx+sx*w-sx*Math.min(4,w*0.6),ry+sy*h);
        g.lineTo(rx+sx*w,ry+sy*h);
        g.lineTo(rx+sx*w,ry+sy*h-sy*Math.min(4,h*0.6));
        g.stroke();
      }
      if(rs>0.4){g.fillStyle=INK;g.globalAlpha=0.8;g.fillText(`×${k}`,rx+w+2,ry-h+3);g.globalAlpha=1;}
    }
    g.restore();
  }

  // ── 2b · the fold onto the canopy: the files a pass touched ──────────────
  // Same mark as the rooms get, for the same reason: interface ink, never
  // warmth. `trail` is ordered newest-first, so the pass's own last touch gets
  // the one label — the rest are rings.
  function drawLitFiles(g,z,nds){
    const s=litPlaces(); if(!s.size||!nds||!nds.length)return;
    const p=R.byRun.get(R.pass), newest=((p&&p.trail)||[])[0];
    g.save();g.strokeStyle=INK;g.lineWidth=1;g.font=`8px ${MONO}`;
    let hit=0;
    for(const n of nds){
      if(!s.has(n.path))continue;
      hit++;
      const ny=treeY(n,z), rr=Math.max(2.2,n.r*(0.42+0.58*z))+3.5;
      g.beginPath();g.arc(n.x,ny,rr,0,7);g.stroke();
      if(newest&&n.path===newest.path){
        g.fillStyle=INK;g.globalAlpha=0.9;
        g.textAlign=n.x>W*0.8?'right':'left';
        g.fillText(n.path.split('/').pop(),n.x+(n.x>W*0.8?-rr-3:rr+3),ny+3);
        g.textAlign='left';g.globalAlpha=1;
      }
    }
    R.litFiles={of:s.size,drawn:hit};
    g.restore();
  }

  // ── 3 · the body: the hull as the window it is holding ───────────────────
  // The dispatch asked for `pack` (wake blocks with bytes). This feed has no
  // `pack`, and `resources.context_window` says in its own words: "665.3k tok
  // occupied (no window size yet)". So the hull shows the occupancy it has and
  // is TORN where the denominator is missing — the fill switches to a real
  // level the moment a reading names a window, and not one hour earlier.
  function podHull(pds){
    const p=(pds||[]).find(q=>q.kind==='resident');
    if(!p)return null;
    if(typeof ACTOR!=='undefined'&&ACTOR&&typeof ACTOR.podMetrics==='function'){
      try{const m=ACTOR.podMetrics(p);if(m&&num(m.rx))return {p,x:num(m.x)?m.x:p.x,y:num(m.y)?m.y:p.y,rx:m.rx,ry:m.ry};}catch(e){}
    }
    const sc=podAt(CAM.z);                 // [WORLD]'s own geometry, today
    return {p,x:p.x,y:p.y,rx:11*sc,ry:6.5*sc};
  }
  function drawBody(g,pds){
    const h=podHull(pds);if(!h||!R.body||R.body.occ===null)return;
    const {occ,win}=R.body;
    g.save();
    g.beginPath();g.ellipse(h.x,h.y,h.rx,h.ry,0,0,7);g.clip();
    if(win){                               // measured denominator ⇒ a real level
      const f=clamp(occ/win,0,1), fy=h.y+h.ry-2*h.ry*f;
      g.fillStyle='rgba(242,177,52,0.34)';g.fillRect(h.x-h.rx,fy,h.rx*2,2*h.ry*f);
      g.strokeStyle='rgba(242,177,52,0.7)';g.lineWidth=1;
      g.beginPath();g.moveTo(h.x-h.rx,fy);g.lineTo(h.x+h.rx,fy);g.stroke();
    }else{                                 // TORN: occupied, against no window
      g.strokeStyle='rgba(90,77,60,0.75)';g.lineWidth=1;
      for(let k=-h.ry*2;k<h.rx*2+h.ry*2;k+=4){
        g.beginPath();g.moveTo(h.x-h.rx+k,h.y+h.ry);g.lineTo(h.x-h.rx+k+h.ry*2,h.y-h.ry);g.stroke();}
    }
    g.restore();
    // beside the hull, not under it: under it is where the hub writes its caption
    g.save();g.font=`9px ${MONO}`;
    const tag=win?`${(occ/1000).toFixed(0)}k of ${(win/1000).toFixed(0)}k`
                 :`${(occ/1000).toFixed(1)}k tok \u00b7 window unmeasured`;
    const tw=g.measureText(tag).width, tx=h.x+h.rx+7;
    g.fillStyle='rgba(7,6,4,0.90)';g.fillRect(tx-3,h.y-7,tw+6,13);
    g.fillStyle=win?'#8a7c5e':ABSENT_INK;g.fillText(tag,tx,h.y+3);
    g.restore();
  }
  // ── THE WINDOW: a posture, not a panel ───────────────────────────────────
  // The rule that governs this whole surface, in his words and it is the better
  // cut: A STREAM BELONGS IN THE WATER, AN INSPECTION BELONGS IN A WINDOW.
  //   the water ... ground · pods · cloth · the chat — live, unframed
  //   windows ..... body · pass · page — one thing, stopped, closable
  //   the edges ... the belt and the sounder right, the chat's corner left
  // So this is ONE window, drawn once and opened by anything worth stopping
  // for: `P` inspects the body, `Enter` inspects whatever is selected. If a
  // thing does not fit water, window or edge, that is the signal to ask.
  function windowRect(rows,note,gap){
    const w=Math.min(520,W*0.42), lh=18;
    const foot=(note?30:10)+(gap?16:0);
    const h=Math.min(H*0.80,58+lh*rows.length+foot);
    return {x:Math.round(W*0.5-w/2),y:Math.round(H*0.5-h/2),w,h};
  }
  function drawWindow(g,rect,title,rows,note,gap){
    // the base row is the one whose label names it; everything else is an act
    const isBase=r=>/\bbase\b/i.test(String(r.k||r.l||r.label||''));
    const rowMax=Math.max(0,...rows.filter(r=>!isBase(r)).map(r=>num(r.v)?r.v:0));
    const lh=18;
    const foot=(note?30:10)+(gap?16:0);
    const {x,y,w,h}=rect;
    g.save();
    // the dim belongs to the compositor now — a window says how far it reaches
    // and the ground layer does the dimming, once, for every window at once.
    g.fillStyle='#070604';g.fillRect(x,y,w,h);               // the window's own ground
    g.strokeStyle='rgba(122,104,72,0.55)';g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1);
    g.font=`10px ${MONO}`;g.fillStyle='#8a7c5e';g.fillText(title,x+14,y+22);
    g.strokeStyle='rgba(122,104,72,0.28)';
    g.beginPath();g.moveTo(x+14,y+30.5);g.lineTo(x+w-14,y+30.5);g.stroke();
    g.fillStyle='rgba(74,67,54,0.9)';g.textAlign='right';g.fillText('esc',x+w-14,y+22);
    g.textAlign='left';
    const tot=rows.reduce((a,r)=>a+Math.max(0,r.v||0),0)||1;
    g.font=`9px ${MONO}`;
    // the pinned rows go last and are never dropped: the base is the point of
    // the panel, and a panel that silently drops the point is worse than a
    // shorter one. Everything above it is the newest that fit.
    const pinned=rows.filter(r=>r.base||r.his);
    const flow=rows.filter(r=>!r.base&&!r.his);
    const room=Math.max(1,Math.floor((h-58-foot)/lh)-pinned.length);
    const cut=Math.max(0,flow.length-room);
    const show=[...rows.filter(r=>r.his),...flow.slice(0,room),
                ...(cut?[{k:`\u2026 ${cut} older act${cut>1?'s':''} above the base, not shown`,t:''}]:[]),
                ...rows.filter(r=>r.base)];
    let ry=y+50;
    for(const r of show){
      if(num(r.v)){
        // softer than a tick was, because the label now rides it
        g.fillStyle=isBase(r)?'rgba(143,211,255,0.20)':'rgba(242,177,52,0.17)';
        // His read, 2026-09-17: a per-row tick beside the text spends a column
        // to say what the row can say by itself. So THE ROW IS THE BAR — the
        // weight is a fill running the row's own width, behind the label, and
        // the stack reads as a profile instead of a list with decoration.
        // Two scales, because one lies: an act is 1–6k against a 462k base, so
        // scaling every row to the total leaves the acts invisible. The base
        // row keeps the total's scale (it *is* most of the body); an act row
        // scales against the largest act, so the stack is scannable and the
        // base still says plainly that it dominates.
        const den=(isBase(r)?tot:(rowMax||tot))||1;
        g.fillRect(x+10,ry-11,(w-20)*clamp(r.v/den,0,1),lh-3);
      }
      if(r.his){                       // his line, on the top layer, in his ice
        g.strokeStyle='rgba(143,211,255,0.5)';g.lineWidth=1;
        g.beginPath();g.moveTo(x+14,ry+3.5);g.lineTo(x+w-14,ry+3.5);g.stroke();
      }
      // the label must read over its own bar: brighter than the old dim ink
      g.fillStyle=r.his?'#cfe9fb':(isBase(r)?'#a8c4d6':'#c2b393');
      let lb=r.k; while(lb.length&&g.measureText(lb).width>w-150)lb=lb.slice(0,-2);
      g.fillText(lb,x+14,ry+8);   // the label rides the fill (the row is the bar)
      if(r.t!==undefined){g.fillStyle='#d9cba9';g.textAlign='right';
        g.fillText(r.t,x+w-14,ry+8);g.textAlign='left';}
      ry+=lh;
    }
    if(note){g.fillStyle='#8a7c5e';
      let nl=note; while(nl.length&&g.measureText(nl).width>w-28)nl=nl.slice(0,-2);
      g.fillText(nl,x+14,y+h-(gap?28:12));}
    if(gap){g.fillStyle=ABSENT_INK;g.font=`8px ${MONO}`;
      let gl=gap; while(gl.length&&g.measureText(gl).width>w-28)gl=gl.slice(0,-2);
      g.fillText(gl,x+14,y+h-12);}
    g.restore();
  }
  // the body, ITEMIZED — the hull stays its one-glance summary
  function bodyRows(){
    // THE BODY, ITEMIZED — the most valuable single panel in anything drawn so
    // far (his words, on field3's L+P screenshot), so it is built for its value
    // and not its layout:
    //   1. every act carries its price ON the act — the cost sits beside the
    //      decision, never in a status bar
    //   2. the base is the oldest and heaviest row, at the bottom
    //   3. one total line: boot + run = what is on the body at this boundary
    //   4. his line lands on the top layer and grows it — kept, and made
    //      honest: see the note on the row
    //   5. the delta since P was last opened, in memory only, no storage
    // SINGLE COLUMN, deliberately: the log is already the chat's job out in the
    // water, so a second column here would be the same list twice. What the
    // window adds is the price, and a price reads best beside its own act.
    const S0=R.src||{}, b=S0.beads||[];
    if(!b.length)return null;
    const base=(b[0].ctx_after||0)-(b[0].delta||0);
    const run=b.reduce((a,q)=>a+Math.max(0,q.delta||0),0);
    const tot=base+run;
    const rows=[];
    // his arrival, on the top layer, when it is newer than my last act
    const inb=(((S0.hud||{}).full||{}).inbound||{}).events||[];
    const his=inb.filter(e=>e.source==='cloud'||e.cloud_username||e.cloud_user)
                 .sort((x,y)=>Date.parse(y.created||0)-Date.parse(x.created||0))[0];
    const lastAct=b.length?Date.parse(b[b.length-1].at||0):0;
    if(his&&Date.parse(his.created||0)>=lastAct)
      rows.push({k:'a user line lands on the top layer and grows it',
                 t:'\u2014',his:true,v:0});
    // the run's own acts, newest first, each with its price
    const acts=b.filter(q=>(q.delta||0)>0).slice().reverse();
    for(const q of acts)rows.push({
      k:`${(q.at||'').slice(11,16)}  ${q.act}  ${(q.places||[])[0]||(q.home_places||[])[0]||q.place_kind||''}`,
      v:q.delta,t:`+${(q.delta/1000).toFixed(1)}k`});
    // the base, at the bottom, oldest and heaviest
    rows.push({k:'the base \u2014 the wake, as one row',v:base,
               t:`${(base/1000).toFixed(1)}k`,base:true});
    // the total line, and the hour's price if this window has been open before
    let note=`boot ${(base/1000).toFixed(1)}k + run ${(run/1000).toFixed(1)}k = `
      +`${(tot/1000).toFixed(1)}k on the body at this boundary`;
    if(num(R.lastOpen)&&R.lastOpen!==tot){
      const d=tot-R.lastOpen, mins=Math.max(1,Math.round((Date.now()-R.lastOpenAt)/60000));
      note+=` \u00b7 +${(d/1000).toFixed(1)}k since you last looked, ${mins} min ago`;
    }
    R.pendingOpen=tot;
    return {rows,note,
      // the two readings this panel cannot take, said inside it rather than
      // faked: `pack.blocks` is not in this feed at all, so the base is one
      // arithmetic row instead of `work surface 51.3k \u00b7 portals 12.1k \u2026`;
      // and the feed prices ACTS, not arrivals, so his line has no number.
      gap:'no `pack` in the feed: the base is one row, not its blocks \u00b7 '
         +'tokens, not bytes \u2014 the feed measures ctx_after/delta'};
  }
  // a pass, inspected — the window's second legitimate user
  function passRows(){
    const p=R.byRun.get(R.pass); if(!p)return null;
    const m=R.roomsOf(p.run), fp=[...m.values()].reduce((a,b)=>a+b,0);
    const tr=(p.trail||[]).length;
    return {rows:[
      {k:'core',t:`${p.shell||'?'}/${p.core||'?'}`},
      {k:'ran for',t:fmtDur(dur(p))},
      {k:'started',t:(p.started||'').replace('T',' ').replace('Z','')},
      {k:'knots \u00b7 pages',t:`${p.knots||0} \u00b7 ${p.pages||0}`},
      {k:'tokens',t:num(p.tokens)?`${(p.tokens/1e6).toFixed(2)}m`:'unmeasured'},
      {k:'prs',t:String((p.prs||[]).length)},
      {k:'decks',t:(p.topics||[]).join(', ')||'none measured'},
      {k:'rooms \u00b7 footprints',t:`${m.size} \u00b7 ${fp}`},
      {k:'places its trail names',t:String(tr)},
      {k:'parent',t:p.parent||'none'}],
      note:p.name||p.title||p.run};
  }

  // ── 4 · the wire: the last things said, in the same ink ──────────────────
  function wireMetrics(z){
    const vis=R.log?1:INTERIOR(z);
    const G=R.geom||geom();
    const lh=R.log?14:13;
    const n=R.log?Math.max(8,Math.floor((G.base-90)/lh)):8;
    const lines=R.wire.slice(-n);
    const x0=W*0.045, bot=G.base-WIRE, wmax=R.log?W*0.66:W*0.44;
    R.wireTop=lines.length?bot-lh*(lines.length-1):bot;
    return {vis,G,lh,n,lines,x0,bot,wmax};
  }
  function drawWire(g,z,M){
    // ── THE CHAT: an online game's, not a panel ──────────────────────────
    // The maintainer's shape, superseding 'a log window' and then 'lines in the
    // water': bottom-left, IN the water, no chrome — no border, no header, no
    // ground, the scene showing through it. It sits under the MOTHERSHIP,
    // moored at the shore's left end, so a message appears where the thing that
    // received it lives; the right edge already owns the sounder and the belt.
    // One instrument per edge. Persistent and capped: the last 8, older sinking
    // out and fading to nothing before they reach the cloth. No scrollbar
    // furniture: L pulls the history up over the scene, Esc drops it.
    // THREE SIZES, ONE GESTURE (his refinement, and field3's L *behaviour* is
    // the reference — never its look, which is the bordered spreadsheet this
    // generation exists to not be):
    //   corner  — the last 8 in the water, bottom-left, no chrome
    //   L       — the transcript grows over the scene, still unframed, the
    //             ground dimmed behind it, each line carrying its act kind and
    //             the place it names, so it reads as the run's own history
    //   Esc     — back to the corner
    // Same colour law at both sizes. No scrollbars, no header, no panel.
    // TWO LAYERS, ONE ELEMENT, and the dispatch named it in both lists. The
    // measurement settles it: in the corner the wire fades with INTERIOR(z) and
    // is anchored to the mothership — it is altitude-scoped and world-anchored,
    // which is water, not an instrument at an edge. Expanded, it dims the ground
    // and stops: that is a window. So the corner is water, `L` is a window, and
    // the one thing that changes between them is which layer draws it.
    const {vis,G,lh,lines,x0,bot,wmax}=M;
    if(vis<=0.01||!lines.length)return;
    g.save();
    g.font=`${R.log?10:9}px ${MONO}`;
    lines.forEach((l,i)=>{
      // i ascending = older -> newer. The newest sits highest and brightest;
      // in the corner the oldest has sunk to the band's floor and is nearly
      // gone. Expanded, nothing sinks out: the whole list is the point.
      const age=(lines.length-1-i)/Math.max(1,lines.length-1);
      const fade=R.log?1:(1-age)*(1-age);
      // the whisper channel keeps a floor the others do not
      const a=clamp((l.chan==='his'?0.34+0.66*fade:0.06+0.94*fade)*vis,0,1);
      const y=R.wireTop+age*lh*(lines.length-1);
      const ink=l.chan==='mine'?R.tint(l.topics,a)
              :`rgba(${l.chan==='his'?'143,211,255':'107,95,71'},${a})`;
      g.fillStyle=`rgba(90,77,60,${a*0.7})`;
      g.fillText(l.at?new Date(l.at).toISOString().slice(11,16):'  .  ',x0,y);
      let cur=x0+38;
      g.fillStyle=ink;g.fillText(l.who,cur,y);
      cur+=g.measureText(l.who).width+7;
      if(R.log&&l.place){               // the place the act names: history, not chat
        g.fillStyle=`rgba(138,124,94,${a*0.85})`;
        const pl=l.place.length>46?'\u2026'+l.place.slice(-45):l.place;
        g.fillText(pl,cur,y);cur+=g.measureText(pl).width+8;
      }
      let t=l.text;
      const room=wmax-(cur-x0)-16;
      while(t.length&&g.measureText(t).width>room)t=t.slice(0,-2);
      // his words carry his colour too; mine and the machinery's stay ink
      g.fillStyle=l.chan==='his'?`rgba(191,226,248,${a})`:`rgba(232,220,192,${a*0.8})`;
      g.fillText(t,cur,y);
    });
    g.restore();
  }

  // ── the hover plaque: this block's own, on the canvas ────────────────────
  function hoverPlaque(g){
    if(!R.hover||!R.mouse)return null;
    const p=R.hover, m=R.roomsOf(p.run), fp=[...m.values()].reduce((a,b)=>a+b,0);
    const ls=[`${p.run}${p.live?'  · live':''}`,
      p.name||p.title||'—',
      `${p.shell||'?'}/${p.core||'?'} · ${fmtDur(dur(p))}`,
      `${p.knots||0} knots · ${p.pages||0} pages · ${(p.prs||[]).length} prs`,
      num(p.tokens)?`${(p.tokens/1e6).toFixed(2)}m tokens`:'tokens unmeasured',
      (p.topics||[]).length?`decks ${p.topics.join(', ')}`:'no deck measured',
      m.size?`${m.size} rooms · ${fp} footprints · click to light them`:'no footprint in any room',
      p.parent?`child of ${p.parent}`:'no parent'];
    g.save();g.font=`9px ${MONO}`;
    const w=Math.max(...ls.map(l=>g.measureText(l).width))+14, h=ls.length*12+10;
    g.restore();
    const bx=clamp(R.mouse.x+12,4,W-w-4);
    const by=clamp(R.mouse.y-h-10,40,(R.geom?R.geom.base-26:H)-h-4);
    return {ls,w,h,bx,by};
  }
  function drawHover(g,m){
    g.save();g.font=`9px ${MONO}`;
    const {ls,w,h,bx,by}=m;
    g.fillStyle='rgba(11,9,6,0.93)';g.fillRect(bx,by,w,h);
    g.strokeStyle='rgba(58,51,40,0.9)';g.lineWidth=1;g.strokeRect(bx+.5,by+.5,w-1,h-1);
    ls.forEach((l,i)=>{g.fillStyle=i===0?INK:(i===1?'#d9cba9':'#8a7c5e');g.fillText(l,bx+7,by+16+i*12);});
    g.restore();
  }

  // ── the hand ─────────────────────────────────────────────────────────────
  R.hit=(mx,my)=>{                    // the seam: a plaque under the cursor, or null
    const G=R.geom;if(!G)return null;
    if(my<G.base-26||my>G.base+14)return null;
    const i=Math.floor((mx-G.x0)/G.pw);
    return (i>=0&&i<R.passes.length)?R.passes[i]:null;
  };
  // only while [ACTOR] has no select(): a local mirror, never a write to SELECTED
  R.pickRoom=(mx,my)=>{
    // no guard left to keep: this block covers nothing now, so it hides no
    // room. The guard existed for the strip, and the strip is gone with it.
    const rms=(R.view&&R.view.rooms)||(typeof rooms!=='undefined'?rooms:[]);
    const rs=roomAt(CAM.z);
    for(const r of rms){
      const {x:rx,y:ry}=roomXY(r,CAM.z);
      if(Math.abs(rx-mx)<=Math.max(6,r.rw*rs)/2&&Math.abs(ry-my)<=Math.max(6,r.rh*rs)/2){
        R.roomLocal=r.it.id;R.pass=null;return true;}
    }
    return false;
  };
  // the other direction of the place fold: a file or a page, and the passes
  // that touched it light on the cloth. Uses this block's own selection, so it
  // still never writes SELECTED.
  R.pickPlace=(mx,my)=>{
    const z=CAM.z;
    const nds=(R.view&&R.view.nodes)||(typeof nodes!=='undefined'?nodes:[]);
    const near=(px,py)=>Math.hypot(px-mx,py-my)<7;
    for(const n of nds)if(near(n.x,treeY(n,z))){R.place=n.path;R.pass=null;R.roomLocal=null;return true;}
    for(const n of (R.roots||[]))if(near(n.x,rootY(n,z))){R.place=n.path;R.pass=null;R.roomLocal=null;return true;}
    return false;
  };
  // place → the passes whose trail names it
  R.passesOfPlace=path=>new Map(R.passes
    .filter(p=>((p.trail)||[]).some(t=>t.path===path))
    .map(p=>[p.run,((p.trail)||[]).filter(t=>t.path===path).length]));
  cv.addEventListener('mousemove',e=>{R.mouse={x:e.clientX,y:e.clientY};R.hover=R.hit(e.clientX,e.clientY);});
  cv.addEventListener('mouseleave',()=>{R.hover=null;R.mouse=null;});
  cv.addEventListener('click',e=>{
    const p=R.hit(e.clientX,e.clientY);
    if(p){R.cursor=R.passes.indexOf(p);R.pass=p.run;R.roomLocal=null;R.place=null;return;}
    if(typeof ACTOR!=='undefined'&&ACTOR&&typeof ACTOR.select==='function'){
      try{if(ACTOR.select(e)){R.pass=null;return;}}catch(err){}
    }
    if(R.pickRoom(e.clientX,e.clientY))return;
    if(R.pickPlace(e.clientX,e.clientY))return;
    R.pass=null;R.roomLocal=null;
  });
  addEventListener('keydown',e=>{     // field3's model: ← → scrub · L wire · P body · Esc
    const k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'){
      if(!R.passes.length)return;
      R.cursor=clamp((R.cursor<0?R.passes.length-1:R.cursor)+(k==='ArrowRight'?1:-1),0,R.passes.length-1);
      R.pass=R.passes[R.cursor].run;R.roomLocal=null;R.place=null;e.preventDefault();
    }
    else if(k==='l'||k==='L'){R.log=!R.log;R.win=null;}
    else if(k==='p'||k==='P'){
      // the hour's price: what changed since this window was last opened. In
      // memory only, by his instruction — nothing is stored.
      if(R.win==='body'){R.lastOpen=R.pendingOpen;R.lastOpenAt=Date.now();R.win=null;}
      else R.win='body';
    }
    else if(k==='Enter')R.win=R.win?null:(R.pass?'pass':'body');
    else if(k==='Escape'){
      if(R.win){
        if(R.win==='body'){R.lastOpen=R.pendingOpen;R.lastOpenAt=Date.now();}
        R.win=null;return;}                    // a window closes first
      R.pass=null;R.roomLocal=null;R.place=null;R.log=false;}
  });

  // ── the one entry point [WORLD] calls, last inside drawScene ─────────────
  // TWO MEASURED FACTS ABOUT THE CONTEXT THIS BLOCK IS HANDED, both found by
  // looking at frames and then probing, not by reading the code:
  //
  // 1. IT IS NOT CLEAN. [WORLD]'s pods loop opens `save()` + composite
  //    'lighter' once per pod and restores only three of its four saves, so
  //    everything drawn after it — the depth sounder included — runs ADDITIVE.
  //    Probed: `globalCompositeOperation` reads 'lighter' on entry to this
  //    function. A dark plate is invisible in that mode, which is why this
  //    block resets the state it depends on instead of assuming it. Their line
  //    to fix; named in the report.
  // 2. THE STRIP OCCLUDES THE WORLD, NOT THE PHOSPHOR'S GHOST OF IT. With
  //    ?fx=off the strip measures 0 pixels over luminance 70 where the warp's
  //    room labels are; with the pass on, a room that moved *through* this
  //    region is still decaying in the phosphor for ~1.5 s and prints through,
  //    because the phosphor is a per-channel max and dark ink cannot lower it.
  //    Correct behaviour for that pipeline, and not this block's to change: a
  //    fix is one `destination-out` rect in [FRAME]'s phosphor. Consequence to
  //    know: read this strip a second after a camera move, not during one.
  // THE SEAM IS FIVE NAMES NOW, NOT ONE. `R.draw` was a single entry point
  // called last inside drawScene, which is exactly how this block's work ended
  // up in three different layers at once: the roots are ground, the fold's
  // brackets are ground (they are ON the rooms), the cloth and the corner wire
  // are water, and the body window, the pass window, the transcript and the
  // hover plaque are windows. One function could not be all four, so it is not
  // one function.
  //
  // WHAT THIS REPAIRS, from the two facts this block measured and could not fix
  // from inside its own fence:
  //   1. "globalCompositeOperation reads 'lighter' on entry" — the compositor
  //      enters every layer with a known state and repairs a leaked save(), so
  //      this block no longer has to reset what it depends on.
  //   2. "the strip occludes the world, not the phosphor's ghost of it" — the
  //      fix named there (one destination-out rect in [FRAME]'s phosphor) is
  //      built: every window pane is punched out of the phosphor each frame.
  R.prepare=(g,z,now)=>{
    const S0=(typeof S!=='undefined'?S:null);
    R.ready=!!S0; if(!S0)return;
    if(R.src!==S0)sync(S0);
    if(R.rootsFor!==S0){layoutRoots(S0);R.rootsFor=S0;}
    geom();                       // reads RESERVE.card: the cloth's own width
    R.wireM=wireMetrics(z);       // sets R.wireTop, which rootDepth reads
  };
  R.ground=(g,z)=>{if(R.ready)drawRoots(g,z);};   // NOT `R.roots`: that name is the array
  R.marks=(g,z)=>{
    if(!R.ready)return;
    drawLitRooms(g,z,typeof rooms!=='undefined'?rooms:[]);
    drawLitFiles(g,z,typeof nodes!=='undefined'?nodes:[]);
  };
  R.water=(g,z,now)=>{
    if(!R.ready)return;
    drawBody(g,typeof pods!=='undefined'?pods:[]);
    drawCloth(g);
    if(!R.log)drawWire(g,z,R.wireM);       // the corner. `L` is a window.
  };
  R.wireWindow=(g,z)=>{
    if(!R.ready||!R.log||!R.wireM||!R.wireM.lines.length)return null;
    const M=R.wireM;
    return {name:'wire',x:M.x0-10,y:R.wireTop-16,w:M.wmax+20,
            h:Math.max(20,(M.bot-R.wireTop)+26),dim:'scene',
            draw:gg=>drawWire(gg,z,M)};
  };
  R.paneWindow=g=>{
    if(!R.ready||!R.win)return null;
    const b=R.win==='body'?bodyRows():passRows();
    if(!b)return null;
    const title=R.win==='body'?'THE BODY · every act, with its price'
                              :`THE PASS · ${R.pass}`;
    const rect=windowRect(b.rows,b.note,b.gap);
    return {...rect,name:R.win,dim:'scene',
            draw:gg=>drawWindow(gg,rect,title,b.rows,b.note,b.gap)};
  };
  R.hoverWindow=(g,wins)=>{
    if(!R.ready||R.win)return null;        // a hover is not a stop, and a stop wins
    const m=hoverPlaque(g);
    if(!m)return null;
    const q=placeClear(R.mouse.x,R.mouse.y,m.w,m.h,wins||[]);
    m.bx=q.x;m.by=q.y;
    return {name:'hover',x:m.bx,y:m.by,w:m.w,h:m.h,dim:'none',
            draw:gg=>drawHover(gg,m)};
  };
  return R;
})();
// ═══ end [RECORD] ══════════════════════════════════════════════════════════

// ═══ [FRAME] ═══════════════════════════════════════════════════════════════
// ── the draw · the post-pass lives here ───
function drawWorld(x,now){  // [WORLD] draws; [FRAME] decides where
  drawScene(x,now);
}
// ═══════════════════════════════════════════════════════════════════════════
// [FRAME] · the loop · the buffers · the post-pass · the chrome
//
// One light source: acts. Four states — amber warm · ice his and cold ·
// black absent · torn unmeasured. Nothing pulses on a timer. The pass is a
// lens, never a light: it may bend, smear and dim what [WORLD] drew, and it
// may not add a reading. If an effect makes an unmeasured thing look
// measured, it is wrong however good it looks.
//
// Pipeline, per frame:
//   wb   phosphor decay · the window punch · drawWorld() — the only buffer
//        that remembers, and the panes are punched out of its memory
//   cv   bg · wb · chrome                 — the composed frame
//   q*   bright-pass (square) · blur · 3 channel copies, scaled about centre
//   ov   scanlines × vignette (static) + grain (moving) — darken only
//
// ?fx=off bypasses the whole pass (raw world + raw chrome).
// Also: ?bloom=chain|filter|off · ?ab=off · ?grain=off · ?dither=off
//       ?chrome=off|dom · ?perf=1 · ?tau=<ms> · ?bloomA= · ?abk=
// ═══════════════════════════════════════════════════════════════════════════
const Q=new URLSearchParams(location.search);
let   FX      = Q.get('fx')!=='off';  // ?fx=off, or flipped live by __fxSet
const CHROME  = Q.get('chrome')!=='off' && Q.get('chrome')!=='dom';
const BLOOM   = Q.get('bloom')||'chain';
let   AB      = Q.get('ab')!=='off';
const GRAIN   = Q.get('grain')!=='off';
const DITHER  = Q.get('dither')==='on';     // off: a screen-space pattern inside the
                                            // phosphor is a texture the bloom then
                                            // blurs — light must carry no pattern
const PERF    = Q.get('perf')==='1';
const SYNC    = Q.get('sync')==='1';        // measurement only: a 1×1 readback per
                                            // frame flushes the GPU pipeline, so the
                                            // timed span includes the work the driver
                                            // would otherwise defer past it
const TAU     = +(Q.get('tau')||380);       // ms · a ghost reaches 2 % in ~1.5 s
const BLOOM_A = +(Q.get('bloomA')||0.45);
const BP      = +(Q.get('bp')||8);          // the bright-pass exponent: v→v^BP
const AB_K    = +(Q.get('abk')||0.00085);   // ±0.6 px at the edge of a 1440 frame
const BG='#070604', DIM='#6b5f47', INK='#e8dcc0', ABSENT='#5a4d3c', GLASS='#1b1610';
// (duplicate `const MONO` from the merge — both regions declared it; the first stands)

const mk=()=>document.createElement('canvas');
const wb=mk(), wx=wb.getContext('2d');                       // the phosphor
const ws=mk(), sx=ws.getContext('2d');                       // this frame's world, clean
const half=mk(), qA=mk(), qB=mk(), eA=mk(), sA=mk(), tA=mk(), bt=mk(), qC=mk();// the bloom ladder
const OV=[mk(),mk(),mk(),mk()];                              // scanlines × grain × vignette
const gr=mk();                                               // the grain tile
const dz=mk();                                               // the dither tile
const cb=mk();                                               // the chrome plate
const cx2=c=>c.getContext('2d');
let grainPat=null, ditherPat=null, lastNow=0, BW=0,BH=0, chromeKey='';

function mkNoise(c,size,fn){c.width=c.height=size;const g=cx2(c),d=g.createImageData(size,size);
  for(let i=0;i<size*size;i++){const a=fn();d.data[i*4]=0;d.data[i*4+1]=0;d.data[i*4+2]=0;d.data[i*4+3]=a;}
  g.putImageData(d,0,0);}

function ensureBuffers(){
  if(wb.width===cv.width&&wb.height===cv.height&&cv.width)return;
  wb.width=cv.width;wb.height=cv.height;ws.width=cv.width;ws.height=cv.height;
  wx.setTransform(1,0,0,1,0,0);wx.globalCompositeOperation='source-over';wx.globalAlpha=1;
  wx.fillStyle='#000';wx.fillRect(0,0,wb.width,wb.height);   // opaque: alpha pinned at 1
  BW=Math.max(2,Math.round(cv.width/4));BH=Math.max(2,Math.round(cv.height/4));
  half.width=Math.max(2,Math.round(cv.width/2));half.height=Math.max(2,Math.round(cv.height/2));
  for(const c of [qA,qB,bt,qC]){c.width=BW;c.height=BH;}
  eA.width=Math.max(1,BW>>1);eA.height=Math.max(1,BH>>1);
  sA.width=Math.max(1,BW>>2);sA.height=Math.max(1,BH>>2);
  tA.width=Math.max(1,BW>>3);tA.height=Math.max(1,BH>>3);
  for(const c of [half,qA,qB,eA,sA,tA,bt,qC]){const g=cx2(c);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';}
  cb.width=cv.width;cb.height=cv.height;chromeKey='';
  if(!grainPat){mkNoise(gr,180,()=>Math.random()*22|0);grainPat=cx2(OV[0]).createPattern(gr,'repeat');}
  if(!ditherPat){mkNoise(dz,64,()=>Math.random()<0.06?96:0);ditherPat=cx2(OV[0]).createPattern(dz,'repeat');}
  buildOverlay();
}

// ── the overlay: scanlines and vignette, built once per size ───────────────
// Screen space, device-pixel aligned, never moved by the camera — a scanline
// that travels with the world shimmers, and this one cannot travel.
// Four variants with the grain baked in, picked at random each frame: the
// overlay is then one drawImage instead of a drawImage plus a full-res pattern
// fill, and the grain still moves.
function buildOverlay(){
  const per=Math.max(2,Math.round(3*DPR)), dark=Math.max(1,Math.round(DPR));
  for(const o of OV){
    o.width=cv.width;o.height=cv.height;const g=cx2(o);
    g.clearRect(0,0,o.width,o.height);
    g.globalAlpha=1;g.fillStyle='rgba(0,0,0,0.10)';
    for(let y=0;y<o.height;y+=per)g.fillRect(0,y,o.width,dark);
    if(GRAIN){g.save();g.globalAlpha=0.5;g.fillStyle=g.createPattern(gr,'repeat');
      g.translate(Math.random()*180|0,Math.random()*180|0);
      g.fillRect(-180,-180,o.width+360,o.height+360);g.restore();}
    const cxp=o.width/2, cyp=o.height/2, r=Math.hypot(cxp,cyp);
    const vg=g.createRadialGradient(cxp,cyp,r*0.35,cxp,cyp,r);
    // pulled back from 0.20/0.52: the corners are where the dim end of the scene
    // lives — the never-touched places and the legend that names them — and a
    // vignette that reads well on the pod costs the 'black' state its legibility
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.72,'rgba(0,0,0,0.13)');vg.addColorStop(1,'rgba(0,0,0,0.38)');
    g.fillStyle=vg;g.fillRect(0,0,o.width,o.height);
    // the glass edge: the frame is a tube, and a tube has corners it cannot reach
    g.strokeStyle='rgba(0,0,0,0.55)';g.lineWidth=Math.max(2,6*DPR);
    g.strokeRect(g.lineWidth/2,g.lineWidth/2,o.width-g.lineWidth,o.height-g.lineWidth);
  }
  ditherPat=cx2(OV[0]).createPattern(dz,'repeat');
}

// ── 1 · the phosphor ───────────────────────────────────────────────────────
// Stop clearing. Erode what is there toward nothing, frame-rate independent,
// so a ping that crossed the tree a second ago is still faintly on the glass.
//
// A phosphor is excited to a brightness and decays from it; it does not sum.
// Two ways to get that wrong, both measured here, both of which produced the
// same hard-edged disc on every warm node — 'the glow reads cheap':
//
//   summing   — drawing this frame onto the decayed one with 'lighter' amplifies
//               every static source by 1/(1-e^-dt/τ) ≈ 24× at 60 fps.
//   alpha     — 'lighten' blends *colour* as a max but still composites *alpha*
//               as a union (αs+αb−αs·αb), so on a transparent buffer a gradient
//               drawn at α=0.3 climbs to opaque in ~10 frames. Same disc, and it
//               survives with the bloom switched off, which is how it was caught.
//
// So the buffer is opaque and grounded on black: alpha is pinned at 1, 'lighten'
// is a true per-channel max, and the frame composites it additively over the
// background. Decay is two moves, because one does not reach zero: a proportional
// fade (the ~1.5 s curve) plus a 'color-burn' constant that subtracts ~1 level a
// frame and clamps at 0. Without the second, an 8-bit channel stalls wherever the
// proportional step rounds below half a level and parks a permanent smear where
// the pod has been, at about 4 % — dim, and never going anywhere.
//
// The dither is the older fix for that floor and is off by default: a screen-space
// pattern inside the buffer the bloom reads is a texture on the light itself.
function phosphor(dt,src){
  wx.save();wx.setTransform(1,0,0,1,0,0);wx.globalAlpha=1;
  wx.globalCompositeOperation='source-over';                 // proportional: the curve
  wx.fillStyle=`rgba(0,0,0,${1-Math.exp(-dt/TAU)})`;
  wx.fillRect(0,0,wb.width,wb.height);
  wx.globalCompositeOperation='color-burn';                  // constant: the floor
  wx.fillStyle='rgb(254,254,254)';
  wx.fillRect(0,0,wb.width,wb.height);
  if(DITHER&&ditherPat){wx.globalCompositeOperation='destination-out';wx.fillStyle=ditherPat;
    wx.translate(Math.random()*64|0,Math.random()*64|0);
    wx.fillRect(-64,-64,wb.width+128,wb.height+128);wx.setTransform(1,0,0,1,0,0);}
  // THE WINDOW PUNCH. [RECORD] measured this and named the fix it could not
  // make from inside its own fence: a dark pane occludes the WORLD but not the
  // phosphor's ghost of it, because the phosphor is a per-channel max and dark
  // ink cannot lower one. So the memory is cleared where a window stands —
  // opaque black through 'source-over', never 'destination-out', which would
  // unpin the alpha this whole buffer depends on being 1.
  if(PANES.length){
    wx.globalCompositeOperation='source-over';wx.fillStyle='#000';
    for(const q of PANES)wx.fillRect(q.x*DPR,q.y*DPR,q.w*DPR,q.h*DPR);
  }
  wx.globalCompositeOperation='lighten';                     // excite: a true max
  wx.drawImage(src,0,0);
  wx.restore();
}

// ── 2 · bloom ──────────────────────────────────────────────────────────────
// Wide and weak, over a high threshold. The threshold is a power curve built
// from repeated 'multiply' — v → v^8 — which costs three quarter-res draws and
// no pixel readback: 1.0 survives, 0.85 falls to 0.27, 0.5 to 0.004. That is what
// reserves the halo for what an act *just* lit — the pod, a ping in flight, a
// place still flaring — and leaves a warm-but-older node a bright core and
// nothing around it. Light decays to a core, not to a smaller disc.
//
// Then four octaves down to 1/32, weighted 35/36/21/8 from 1/4 outward — enough
// width that no halo has a findable edge, little enough of the widest octave
// that a crowded canopy does not wash the black. A tight bright blur clips
// channels and walks amber toward white; a wide dim one adds light without
// giving anything a shape it did not already have.
function bloomPass(){
  if(BLOOM==='off')return null;
  const h=cx2(half), a=cx2(qA), b=cx2(qB);
  h.globalCompositeOperation='source-over';h.globalAlpha=1;
  h.clearRect(0,0,half.width,half.height);h.drawImage(cv,0,0,half.width,half.height);
  a.globalCompositeOperation='source-over';a.globalAlpha=1;
  a.clearRect(0,0,BW,BH);a.drawImage(half,0,0,BW,BH);
  b.globalCompositeOperation='source-over';b.globalAlpha=1;
  b.clearRect(0,0,BW,BH);b.drawImage(qA,0,0);
  b.globalCompositeOperation='multiply';b.drawImage(qA,0,0);
  const c=cx2(qC);
  for(let k=2;k<BP;k*=2){                       // v² → v⁴ → v⁸, one draw-pair each
    c.globalCompositeOperation='source-over';c.globalAlpha=1;
    c.clearRect(0,0,BW,BH);c.drawImage(qB,0,0);
    b.globalCompositeOperation='multiply';b.drawImage(qC,0,0);
  }
  b.globalCompositeOperation='source-over';
  if(BLOOM==='filter'){
    a.clearRect(0,0,BW,BH);a.filter='blur(9px)';a.drawImage(qB,0,0);a.filter='none';
    return qA;
  }
  const e=cx2(eA), s=cx2(sA), t=cx2(tA);
  e.clearRect(0,0,eA.width,eA.height);e.drawImage(qB,0,0,eA.width,eA.height);
  s.clearRect(0,0,sA.width,sA.height);s.drawImage(eA,0,0,sA.width,sA.height);
  t.clearRect(0,0,tA.width,tA.height);t.drawImage(sA,0,0,tA.width,tA.height);
  a.clearRect(0,0,BW,BH);a.globalAlpha=1;a.drawImage(tA,0,0,BW,BH);
  a.globalAlpha=0.72;a.drawImage(sA,0,0,BW,BH);
  a.globalAlpha=0.55;a.drawImage(eA,0,0,BW,BH);
  a.globalAlpha=0.35;a.drawImage(qB,0,0,BW,BH);
  a.globalAlpha=1;
  return qA;
}

// ── 3 · chromatic aberration ───────────────────────────────────────────────
// Lateral, which is what a real lens does: the channels are the same image at
// slightly different magnifications, so the error is zero at the centre and
// grows to ±0.6 px at the edge. A constant offset would smear the middle of
// the frame too, and that reads as "blurry", not as glass.
const CHAN=[['#ff0000',1+AB_K],['#00ff00',1],['#0000ff',1-AB_K]];
function composite(bloom){
  if(!bloom)return;
  x.save();x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='lighter';x.globalAlpha=BLOOM_A;
  if(!AB){x.drawImage(bloom,0,0,cv.width,cv.height);}
  else{
    // The split happens at bloom resolution, not screen resolution: the offsets
    // are relative, so a quarter-res scale is the same screen displacement, and
    // the frame pays one full-res composite instead of three.
    const g=cx2(bt), c=cx2(qC);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;g.clearRect(0,0,BW,BH);
    g.globalCompositeOperation='lighter';
    for(const [tint,s] of CHAN){
      c.globalCompositeOperation='source-over';c.globalAlpha=1;
      c.clearRect(0,0,BW,BH);c.drawImage(bloom,0,0);
      c.globalCompositeOperation='multiply';c.fillStyle=tint;c.fillRect(0,0,BW,BH);
      c.globalCompositeOperation='source-over';
      const w=BW*s, hh=BH*s;
      g.drawImage(qC,(BW-w)/2,(BH-hh)/2,w,hh);
    }
    g.globalCompositeOperation='source-over';
    x.drawImage(bt,0,0,cv.width,cv.height);
  }
  x.restore();
}

// ── 4 · scanlines · grain · vignette ───────────────────────────────────────
// One pass, all of it darkening only. Additive grain would light the black,
// and the black is a reading: never touched. So the grain multiplies down.
function overlayPass(){
  x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.drawImage(OV[Math.random()*4|0],0,0);
  x.restore();
}

// ── the chrome, made diegetic ──────────────────────────────────────────────
// The readings are not mine to compute. [WORLD] renders them — today into the
// hidden #state/#belt/#legend/#top panels, tomorrow through worldHud() when it
// lands. Both are read, never recomputed: the vial's colour is the colour
// heat() already chose, lifted off the element [WORLD] wrote it onto. This is
// a renderer for [WORLD]'s HUD, not a second opinion about the numbers.
function hudModel(){
  if(typeof worldHud==='function'){
    try{
      const h=worldHud();
      if(h) return {
        title:'brnrd', sub:'/ THE PODS · scene one · above the water',
        src:(($('#src')||{}).textContent)||'',
        rows:[[{t:(h.pod&&h.pod.glyph)||'b·_·d',ink:'glyph'},{t:' '+(h.state||'unmeasured'),ink:'v'}],
              [{t:'pod ',ink:'k'},{t:(h.pod&&h.pod.name)||'—',ink:'v'},{t:' · '+((h.pod&&h.pod.core)||''),ink:'k'}],
              [{t:'last act ',ink:'k'},{t:(h.last&&h.last.act)||'—',ink:'v'},{t:' '+((h.last&&h.last.kind)||''),ink:'k'}],
              [{t:'why ',ink:'k'},{t:h.why||'—',ink:'v'}]],
        vials:(h.vials||[]).map(v=>({n:v.n+(v.src==='chip'?' · from the chip':''),
          pct:typeof v.pct==='number'&&isFinite(v.pct)?v.pct:null,
          text:typeof v.pct==='number'&&isFinite(v.pct)?v.pct+' %':'—',
          color:heat(v.pct),torn:!(typeof v.pct==='number'&&isFinite(v.pct))})),
        legend:legendFromDom()
      };
    }catch(e){}
  }
  return domHud();
}
const INKS={k:ABSENT,v:INK,amber:A,ice:I,glyph:A,b:DIM,'':ABSENT};
function runsOf(el){
  const out=[];
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){const t=n.textContent;if(t.trim()||t===' ')out.push({t,ink:''});}
    else if(n.tagName==='BR')out.push({br:true});
    else out.push({t:n.textContent,ink:n.tagName==='B'?'b':(n.className||'')});
  });
  return out;
}
function legendFromDom(){
  const el=$('#legend');if(!el)return [];
  const lines=[[]];
  for(const r of runsOf(el)){if(r.br)lines.push([]);else lines[lines.length-1].push(r);}
  return lines;
}
function domHud(){
  const st=$('#state'), belt=$('#belt');
  const rows=st?[...st.children].map((d,i)=>runsOf(d).map(r=>i===0&&r.ink==='amber'?{...r,ink:'glyph'}:r)):[];
  const vials=belt?[...belt.querySelectorAll('.vial')].map(v=>{
    const b=v.querySelector('.h b'), i=v.querySelector('.h i'), f=v.querySelector('.bar i');
    const torn=v.classList.contains('torn');
    return {n:i?i.textContent:'', text:b?b.textContent:'—', color:b?b.style.color||DIM:DIM,
            pct:torn?null:parseFloat((f&&f.style.width)||'0'), torn};
  }):[];
  return {title:($('#top b')||{}).textContent||'brnrd',
          sub:(($('#top span')||{}).textContent)||'',
          src:(($('#src')||{}).textContent)||'', rows, vials, legend:legendFromDom()};
}
function hair(g,x1,y1,x2,y2,a){g.strokeStyle=`rgba(154,133,94,${a})`;g.lineWidth=1;
  g.beginPath();g.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);g.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);g.stroke();}
function runLine(g,runs,px,py,size){
  let cur=px;
  for(const r of runs){
    if(r.br||!r.t)continue;
    const glyph=r.ink==='glyph';
    g.font=`${glyph?size+3:size}px ${MONO}`;
    g.fillStyle=INKS[r.ink]!==undefined?INKS[r.ink]:INK;
    g.fillText(r.t,cur,py);cur+=g.measureText(r.t).width;
  }
  return cur;
}
function drawChrome(g){
  const m=hudModel();
  g.textAlign='left';g.textBaseline='alphabetic';
  // ── the head rule ──
  g.font=`650 13px ${MONO}`;g.fillStyle=INK;g.fillText(m.title,16,25);
  const tw=g.measureText(m.title).width;
  g.font=`10px ${MONO}`;g.fillStyle=DIM;g.fillText(m.sub,16+tw+8,25);
  g.fillStyle=ABSENT;g.textAlign='right';g.fillText(m.src,W-16,25);g.textAlign='left';
  hair(g,16,36,W-16,36,0.26);
  hair(g,16,36,16,30,0.26);hair(g,W-16,36,W-16,30,0.26);        // the corner ticks
  // ── the state block: a bracket, and the readings inside it ──
  let y=60;
  const bx=16, bw=300;
  hair(g,bx,y-14,bx,y-14+(m.rows.length*19)+6,0.24);
  hair(g,bx,y-14,bx+9,y-14,0.24);hair(g,bx,y-14+(m.rows.length*19)+6,bx+9,y-14+(m.rows.length*19)+6,0.24);
  m.rows.forEach((r,i)=>{runLine(g,r,bx+12,y+i*19,11);});
  // ── the belt: etched glass, and the fill is the reading's own colour ──
  const vw=196, vx=W-16-vw;
  let vy=54;
  for(const v of m.vials){
    g.font=`10px ${MONO}`;g.fillStyle=DIM;g.fillText(v.n,vx,vy);
    g.font=`15px ${MONO}`;g.fillStyle=v.torn?ABSENT:v.color;g.textAlign='right';
    g.fillText(v.text,vx+vw,vy+1);g.textAlign='left';
    const gy=vy+9, gh=11;
    // the glass: a body, two lips, a specular line
    g.fillStyle=GLASS;g.fillRect(vx,gy,vw,gh);
    if(v.torn){
      g.save();g.beginPath();g.rect(vx,gy,vw,gh);g.clip();
      g.strokeStyle='rgba(90,77,60,0.55)';g.lineWidth=1;
      for(let hx=-gh;hx<vw+gh;hx+=6){g.beginPath();g.moveTo(vx+hx,gy+gh);g.lineTo(vx+hx+gh,gy);g.stroke();}
      g.restore();
    }else{
      const fw=Math.max(0,Math.min(1,v.pct/100))*vw;
      g.fillStyle=v.color;g.globalAlpha=0.85;g.fillRect(vx,gy,fw,gh);g.globalAlpha=1;
      g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(vx,gy+1,fw,1);
      for(const f of [0.25,0.5,0.75]){hair(g,vx+vw*f,gy+gh-4,vx+vw*f,gy+gh,0.30);}
    }
    hair(g,vx,gy,vx+vw,gy,0.30);hair(g,vx,gy+gh,vx+vw,gy+gh,0.30);
    hair(g,vx,gy,vx,gy+gh,0.42);hair(g,vx+vw,gy,vx+vw,gy+gh,0.42);
    vy+=42;
  }
  // ── the legend, under its own rule ──
  const ll=m.legend.filter(l=>l.length);
  if(ll.length){
    const ly=H-14-(ll.length-1)*16;
    hair(g,16,ly-16,16+380,ly-16,0.14);
    ll.forEach((l,i)=>runLine(g,l,16,ly+i*16,10));
  }
}

// The plate is redrawn when [WORLD]'s HUD changes, not sixty times a second:
// the signature is the markup [WORLD] wrote, so a reading that moves redraws
// the chrome and a reading that stands still costs one drawImage.
function chromePlate(g0){
  const key=[($('#state')||{}).innerHTML,($('#belt')||{}).innerHTML,
             ($('#legend')||{}).innerHTML,($('#src')||{}).textContent,W,H].join('\u0001');
  if(key!==chromeKey){
    chromeKey=key;const g=cx2(cb);
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cb.width,cb.height);
    g.setTransform(DPR,0,0,DPR,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;
    drawChrome(g);
  }
  g0.save();g0.setTransform(1,0,0,1,0,0);g0.globalCompositeOperation='source-over';g0.globalAlpha=1;
  g0.drawImage(cb,0,0);g0.restore();
}

// ── the loop ───────────────────────────────────────────────────────────────
const RING=[]; let fpsWin=[], stat={frame:0,world:0,pass:0,chrome:0,fps:0};
function perf(now,total,world,chromeMs,passMs){
  RING.push([total,world,chromeMs,passMs]);if(RING.length>90)RING.shift();
  fpsWin.push(now);while(fpsWin.length&&now-fpsWin[0]>1000)fpsWin.shift();
  const n=RING.length,s=RING.reduce((a,r)=>[a[0]+r[0],a[1]+r[1],a[2]+r[2],a[3]+r[3]],[0,0,0,0]);
  stat={frame:s[0]/n,world:s[1]/n,chrome:s[2]/n,pass:s[3]/n,fps:fpsWin.length};
  window.__fx={on:FX,bloom:FX?BLOOM:'off',ab:FX&&AB,chrome:CHROME,dpr:DPR,w:W,h:H,
    frameMs:+stat.frame.toFixed(3),worldMs:+stat.world.toFixed(3),
    chromeMs:+stat.chrome.toFixed(3),passMs:+stat.pass.toFixed(3),fps:stat.fps,frames:RING.length};
}
// One hook, for the rehearsal harness: the same scene state, photographed with
// the pass on and off, is a comparison two page loads cannot make.
window.__fxSet=(v,k)=>{
  if(k==='ab'){AB=!!v;return AB;}
  FX=!!v;if(!FX){wx.save();wx.setTransform(1,0,0,1,0,0);
    wx.globalCompositeOperation='source-over';wx.globalAlpha=1;
    wx.fillStyle='#000';wx.fillRect(0,0,wb.width,wb.height);wx.restore();}
  return FX;};
function frame(now){        // [FRAME] owns this loop: buffers, effects, chrome
  const p0=performance.now();
  ensureBuffers();
  const dt=Math.max(1,Math.min(100,now-(lastNow||now-16)));lastNow=now;
  // this frame's world, drawn clean, then merged into the phosphor
  x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.fillStyle=BG;x.fillRect(0,0,cv.width,cv.height);x.restore();
  if(FX){
    // grounded on opaque black, not cleared: 'lighten' takes the max of two
    // *unpremultiplied* colours, so a glow drawn at α=0.3 onto a transparent
    // scratch converges the phosphor to full-strength amber across the whole
    // gradient — the flat disc again. Over opaque black the scratch already
    // holds what the glow looks like, and the max is the max of what is seen.
    sx.save();sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='source-over';
    sx.globalAlpha=1;sx.fillStyle='#000';sx.fillRect(0,0,ws.width,ws.height);sx.restore();
    sx.save();sx.setTransform(DPR,0,0,DPR,0,0);sx.globalCompositeOperation='source-over';sx.globalAlpha=1;
    drawWorld(sx,now);sx.restore();
    phosphor(dt,ws);
    x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';x.globalAlpha=1;
    x.drawImage(wb,0,0);x.restore();
  }else{
    x.save();x.setTransform(DPR,0,0,DPR,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
    drawWorld(x,now);x.restore();
  }
  const p1=performance.now();
  // the fourth layer: the instruments, in the same ink, under the same glass —
  // and AFTER the phosphor, so a sounder the hand is moving leaves no ghost
  drawEdges(x,now);
  const p2=performance.now();
  if(FX){composite(bloomPass());overlayPass();}
  if(SYNC)x.getImageData(0,0,1,1);
  const p3=performance.now();
  if(PERF){x.save();x.setTransform(DPR,0,0,DPR,0,0);x.font=`10px ${MONO}`;x.fillStyle=DIM;x.textAlign='right';
    x.fillText(`${stat.fps} fps · frame ${stat.frame.toFixed(2)} ms · pass ${stat.pass.toFixed(2)} ms · chrome ${stat.chrome.toFixed(2)} ms · ${FX?BLOOM:'fx off'}`,W-16,H-6);
    x.restore();}
  perf(now,p3-p0,p1-p0,p2-p1,p3-p2);
  requestAnimationFrame(frame);
}
if(CHROME)for(const id of ['top','state','belt','legend']){const el=$('#'+id);if(el)el.style.display='none';}
addEventListener('resize',()=>{wb.width=0;});
// (deleted) a second mousemove handler lived here and matched on `n.y` — a
// field no node has carried since the camera became one axis — so it hid the
// tooltip the [WORLD] handler had just filled, every time the mouse moved.
// [RECORD] found it and wrote "not this block's to fix". The hover is a window
// on the canvas now and this handler had nothing left to do.
resize();pull();setInterval(pull,3000);requestAnimationFrame(frame);
</script>
