<!doctype html>
<meta charset="utf-8">
<title>the pods — field6, the scene with its record and its actor</title>
<style>
:root{--bg:#070604;--amber:#f2b134;--ice:#8fd3ff;--dim:#8f8470;--absent:#5a4d3c;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#e8dcc0;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;font:11px ui-monospace,Menlo,monospace}
#top{top:0;left:0;right:0;padding:12px 16px;display:flex;gap:14px;align-items:baseline}
#top b{font-size:14px;color:#e8dcc0;font-weight:650}#top span{color:var(--dim);letter-spacing:2px;font-size:10px}
#src{margin-left:auto;color:var(--absent);font-size:10px}
#belt{right:16px;top:52px;width:210px}
.vial{margin-bottom:10px}.vial .h{display:flex;justify-content:space-between;align-items:baseline}
.vial .h i{font-style:normal;color:var(--dim);font-size:10px}.vial .h b{font-weight:400;font-size:17px}
.vial .bar{height:3px;background:#17110a;margin-top:3px;position:relative;overflow:hidden}
.vial .bar i{position:absolute;inset:0 auto 0 0;display:block}
.vial.torn .bar{background:repeating-linear-gradient(90deg,#241c12 0 3px,transparent 3px 7px)}
#state{left:16px;top:52px;width:280px;line-height:1.7}
#state .k{color:var(--absent)}#state .v{color:#e8dcc0}#state .amber{color:var(--amber)}#state .ice{color:var(--ice)}
#legend{left:16px;bottom:14px;color:var(--absent);line-height:1.7}
#legend b{color:var(--dim);font-weight:400}
#hover{position:fixed;pointer-events:none;background:#0b0906ee;border:1px solid #3a3328;padding:5px 8px;font:10px ui-monospace,Menlo,monospace;display:none;z-index:5}
</style>
<canvas id="c"></canvas>
<div class="hud" id="top"><b>brnrd</b><span>/ THE PODS · field6 · the record and the actor</span><span id="src"></span></div>
<div class="hud" id="state"></div>
<div class="hud" id="belt"></div>
<div class="hud" id="legend"></div>
<div id="hover"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TWO REGIONS, TWO HANDS — do not edit outside your own region.

   [WORLD]  layout · ingest · drawWorld · the camera axis.        owner: camera strand
   [FRAME]  the loop · offscreen buffers · the post-pass · chrome. owner: post-pass strand

   The seam between them, and the only thing either may assume of the other:
     drawWorld(ctx, now)   — draws the scene in CSS pixels into whatever context it
                             is handed. Never clears. Never applies effects.
     worldHud()            — {state,pod,last,why,vials:[{n,pct,src}],doors} for chrome.
     CAM = {z}             — 1 = interior (the tree). Below 1 the world rises toward
                             the schematic. [FRAME] may read CAM.z (e.g. to scale
                             bloom); only [WORLD] writes it.
   Both regions share the palette constants and `num/clamp/hash/heat` helpers below.
   A change that needs the other region is a message to the parent, not an edit.
   ═══════════════════════════════════════════════════════════════════════════ */
const cv=document.getElementById('c'),x=cv.getContext('2d');
const $=s=>document.querySelector(s);
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);layout();}
addEventListener('resize',resize);
// ═══ [WORLD] ═══════════════════════════════════════════════════════════════
// ── the feed ───
const FEEDS=['/loom/state.json','http://127.0.0.1:7777/loom/state.json'];
const MONO='ui-monospace,Menlo,monospace';
let S=null, nodes=[], byPath=new Map(), homeNodes=[], byHome=new Map(), ground=null,
    island=null, hub=null, hubBy=new Map(), decks=[], rooms=[], byItem=new Map(),
    corridors=[], pods=[], pings=[], seenBead=-1, water=0, lastVials=[];
const A='#f2b134', I='#8fd3ff';
const num=v=>typeof v==='number'&&isFinite(v);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;};
// the temperature law: amber warm, ice cold, black absent
const temp=p=>!num(p)?null:clamp((p-18)/30,0,1);
const heat=p=>{const t=temp(p);if(t===null)return '#2b2318';const e=t*t*(3-2*t);
  const c=[[143,211,255],[242,177,52]];return `rgb(${Math.round(c[0][0]+(c[1][0]-c[0][0])*e)},${Math.round(c[0][1]+(c[1][1]-c[0][1])*e)},${Math.round(c[0][2]+(c[1][2]-c[0][2])*e)})`;};

// ── the camera: ONE axis, and no second space ──────────────────────────────
// z = 1   the interior — the repo's canopy at full height over its island.
// z → 0   the schematic — the canopy COMPRESSES onto the island (it never fades
//         out), the mound flattens into a deck, and the warp rises out of the
//         water beneath it. Nothing switches mode: every quantity below is one
//         continuous function of z, the waterline is on screen at every
//         altitude, and the home ground and the mothership never move.
const ZMIN=0.09, ZMAX=1;
let CAM={z:1,tz:1};
const waterAt=z=>H*(0.28+0.44*z);          // the waterline rises as the camera does
const canopyAt=z=>H*0.50*z;                // canopy height: compression, not opacity
const bandAt=z=>22*z+56*(1-z);             // the home ground's own thickness
const diveAt=z=>clamp((1-z)/0.95,0.04,1);  // how far the warp has risen into view
const roomAt=z=>clamp((0.62-z)/0.53,0.08,1);// a room: a mote, then a block, then a room
const deckAt=z=>clamp((0.78-z)/0.22,0,1);  // when a deck can say its own name
const podAt=z=>0.42+0.58*z;                // the pod: the same object, further away
const hubAt=z=>clamp((1-z)/0.55,0,1);      // how far the mothership has opened up
const RANGE=z=>z<0.30?'schematic':z<0.62?'mid':'interior';
const RANGE_SAY={
  interior:'the repo the pod is working in — one place per file, height is depth in the path',
  mid:'the home is the ground, the repo is the island moored to it, the ship is moored at home',
  schematic:'the whole warp under the island — a deck per topic, a lane per distance from his hand'};

async function pull(){
  for(const u of FEEDS){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const d=await r.json();ingest(d);return;}catch(e){}
  }
  $('#src').textContent='no feed — the water is dark, and that is honest';
}

// ── the hub: §2's fixed rooms, as the mothership moored over the home ──────
// §11's one fixed point. Every act the feed gives a `place_kind` but no path
// lands in its room here and lights it — that is the whole reason the page is
// not dead while the resident is doing shell work (32 of the last 50 beads).
const HUB=[
  {k:'shed',   say:'the seat'},      {k:'forge',  say:'PRs · issues'},
  {k:'wire',   say:'chat'},          {k:'crew',   say:'strands'},
  {k:'clock',  say:'schedule'},      {k:'archive',say:'the trees'},
  {k:'pack',   say:'this wake'},     {k:'belt',   say:'fuel'}];
const HUBCOLS=2;
const hubRoomFor=b=>{
  const kind=(b&&b.place_kind)||'';
  return hubBy.get(kind)||(kind==='file'?hubBy.get('archive'):null)||null;
};

// ── layout: a pure function of the reading. No z, no clock, no stored state. ─
// Screen coordinates are derived at draw time from CAM.z; the layout below is
// the same at every altitude, which is why the zoom cannot reshuffle anything.
const rows=t=>Array.isArray(t)?t:((t&&t.places)||[]);
function layout(){
  water=waterAt(CAM.z);
  if(!S)return;
  const shoreL=W*0.03, shoreW=W*0.94;
  const hubW=clamp(W*0.22,180,320);
  layoutHub(shoreL,hubW);
  layoutGround(shoreL,shoreW);
  layoutIsland(shoreL+hubW+W*0.02,shoreW-hubW-W*0.02);
  layoutWarp(shoreL,shoreW);
}
function layoutHub(x0,w){
  hub={x:x0+w/2,w,cells:[]};hubBy=new Map();
  const n=Math.ceil(HUB.length/HUBCOLS), iw=w-16;
  HUB.forEach((h,i)=>{
    const c=i%HUBCOLS, r=Math.floor(i/HUBCOLS);
    const cell={...h,x:hub.x-iw/2+(c+0.5)*(iw/HUBCOLS),row:r,rows:n,flare:0,cw:iw/HUBCOLS-6};
    hub.cells.push(cell);hubBy.set(h.k,cell);});
}
// the home is the GROUND: the shelf the whole scene stands on. Same brush as
// the canopy, rooted downward — `tree.home` (dominion · knowledge · surface),
// drawn along the full shore, under the island and under the ship alike.
function layoutGround(x0,w){
  const ps=rows(S.tree&&S.tree.home).slice(0,120);
  homeNodes=[];byHome=new Map();
  const g=new Map();
  for(const p of ps){const top=p.path.split('/')[0];if(!g.has(top))g.set(top,[]);g.get(top).push(p);}
  const list=[...g.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const tot=list.reduce((n,[,v])=>n+Math.max(2,Math.sqrt(v.length)),0)||1;
  let cur=0; const roots=[];
  for(const [top,vs] of list){
    const rw=w*Math.max(2,Math.sqrt(vs.length))/tot, cx=x0+cur+rw/2; cur+=rw;
    roots.push({top,x:cx,w:rw,n:vs.length});
    vs.sort((a,b)=>a.path.localeCompare(b.path));
    for(const p of vs){
      const depth=p.path.split('/').length;
      const e=Math.min(depth,4)/4;
      const n={...p,x:cx+(hash(p.path+'h')-0.5)*rw*0.88,e,root:top,
               r:1.8+Math.min(2.6,(p.knots||0)*0.5),flare:0,home:true,up:null};
      homeNodes.push(n);byHome.set(p.path,n);
    }
  }
  for(const n of homeNodes){
    const parts=n.path.split('/');
    for(let k=parts.length-1;k>0;k--){const a=byHome.get(parts.slice(0,k).join('/'));if(a&&a!==n){n.up=a;break;}}
  }
  ground={x:x0,w,roots};
}
// the repo is ONE island moored into that ground. Its top segments are boughs
// inside the island, not islands of their own; the mound wears the repo's own
// label. (The mount table names two more checkouts — the feed carries one, so
// one is what is drawn. §1: nothing draws that was not measured.)
function layoutIsland(x0,w){
  const ps=rows(S.tree&&S.tree.repo).filter(p=>!p.path.includes('node_modules')).slice(0,220);
  nodes=[];byPath=new Map();
  const g=new Map();
  for(const p of ps){const top=p.path.split('/')[0];if(!g.has(top))g.set(top,[]);g.get(top).push(p);}
  const list=[...g.entries()].sort((a,b)=>b[1].length-a[1].length);
  const tot=list.reduce((n,[,v])=>n+Math.max(2,Math.sqrt(v.length)),0)||1;
  const inner=w*0.94, x1=x0+(w-inner)/2;
  let cur=0; const boughs=[];
  for(const [top,vs] of list){
    const bw=inner*Math.max(2,Math.sqrt(vs.length))/tot, cx=x1+cur+bw/2; cur+=bw;
    const bough={top,x:cx,w:bw,n:vs.length}; boughs.push(bough);
    vs.sort((a,b)=>a.path.localeCompare(b.path));
    for(const p of vs){
      const depth=p.path.split('/').length;
      const e=Math.min(depth,7)/7+hash(p.path)*0.045;        // elevation, z-free
      const n={...p,x:cx+(hash(p.path+'x')-0.5)*bw*0.86,e,bough,
               r:2.2+Math.min(3.4,(p.knots||1)*0.5),flare:0,depth,up:null};
      nodes.push(n);byPath.set(p.path,n);
    }
  }
  for(const n of nodes){
    const parts=n.path.split('/');
    for(let k=parts.length-1;k>0;k--){const a=byPath.get(parts.slice(0,k).join('/'));if(a&&a!==n){n.up=a;break;}}
  }
  island={label:(S.repo||'repo'),x:x0+w/2,w,boughs,n:ps.length,
          total:rows(S.tree&&S.tree.repo).length};
}

// ── the warp: §10 way (a), depth-then-lifecycle ────────────────────────────
// The trap §10 measured: this warp is FLAT — 83 items carry 10 `needs` edges,
// so dependency depth as the spatial axis puts 73 rooms on one ring and the
// only honest rendering left is beads. So depth here is LIFECYCLE: a lane is
// how far a room is from his hand, and `needs` stays what it measurably is —
// a corridor drawn between two rooms wherever they landed, never an axis.
const LANES=[
  {k:'his',  label:'his — ready decisions, nearest his hand', pick:i=>i.state==='ready'&&i.type==='decision'},
  {k:'mine', label:'mine — ready work',                       pick:i=>i.state==='ready'},
  {k:'held', label:'held',                                    pick:i=>i.state==='held'},
  {k:'done', label:'done',                                    pick:i=>true}];
const laneOf=it=>{for(let i=0;i<LANES.length;i++)if(LANES[i].pick(it))return i;return LANES.length-1;};
const WEEK=7*864e5;
const litness=it=>{const t=Date.parse(it.visited_at||'');return isFinite(t)?clamp(1-(Date.now()-t)/WEEK,0,1):null;};

function layoutWarp(x0,w){
  decks=[];rooms=[];byItem=new Map();corridors=[];
  const items=(S.warp&&S.warp.items)||[];
  if(!items.length)return;
  const hed=(S.heddles||[]).map(h=>h.slug);
  const runes=new Map((S.heddles||[]).map(h=>[h.slug,h.rune||'']));
  const order=[...new Set([...hed,...items.flatMap(i=>i.topics||[])])];
  // the measured anchor: where this topic's OWN FILES stand on the island.
  // `tree.repo[].topics` is the join — the same rows the canopy is built from —
  // so the deck under a stand of trees is the topic those trees carry.
  const anchor=new Map();
  for(const t of order){
    const fs=nodes.filter(n=>(n.topics||[]).includes(t));
    if(fs.length)anchor.set(t,{x:fs.reduce((s,n)=>s+n.x,0)/fs.length,n:fs.length});
  }
  const groups=new Map();
  for(const it of items){const t=(it.topics&&it.topics[0])||'—';
    if(!groups.has(t))groups.set(t,[]);groups.get(t).push(it);}
  const want=t=>anchor.has(t)?anchor.get(t).x
    :x0+((order.indexOf(t)+0.5)/Math.max(1,order.length))*w;
  const keys=[...groups.keys()].sort((a,b)=>want(a)-want(b)||a.localeCompare(b));
  const tot=keys.reduce((n,k)=>n+Math.max(1.6,Math.sqrt(groups.get(k).length)),0)||1;
  let cur=0;
  for(const t of keys){
    const its=groups.get(t);
    const dw=w*Math.max(1.6,Math.sqrt(its.length))/tot, dx=x0+cur+dw/2; cur+=dw;
    const dk={slug:t,rune:runes.get(t)||'',x:dx,w:dw,n:its.length,
              anchor:anchor.get(t)||null,lanes:LANES.map(()=>[])};
    decks.push(dk);
    for(const it of its)dk.lanes[laneOf(it)].push(it);
    dk.lanes.forEach((ls,li)=>{
      ls.sort((a,b)=>hash(a.id)-hash(b.id));
      const inner=dw-10, MAXROWS=4;
      const cols=Math.max(1,Math.min(ls.length,
        Math.max(Math.floor(inner/96),Math.ceil(ls.length/MAXROWS))));
      const rw=Math.max(34,Math.min(116,inner/cols-5)), rn=Math.ceil(ls.length/cols)||1;
      ls.forEach((it,k)=>{
        const c=k%cols, r=Math.floor(k/cols);
        rooms.push(byItem.set(it.id,{it,deck:dk,lane:li,
          u:dx-inner/2+(c+0.5)*(inner/cols), v:(li+(r+0.6)/(rn+0.4))/LANES.length,
          rw,rh:15,lit:litness(it),fp:(it.footprints||[]).length,opens:[],gated:null}).get(it.id));
      });
    });
  }
  // corridors = the 10 real `needs` edges. A gate that is his and still ready
  // is an ICE DOOR, drawn shut across the corridor it holds.
  for(const it of items)for(const nd of (it.needs||[])){
    const a=byItem.get(nd), b=byItem.get(it.id);
    if(!a||!b)continue;
    const shut=a.it.state!=='done', ice=shut&&a.it.type==='decision'&&a.it.state==='ready';
    a.opens.push(it.id); if(shut)b.gated=a;
    corridors.push({a,b,shut,ice});
  }
}

// ── projection: world → screen, the only place z is spent ──────────────────
const treeY=(n,z)=>waterAt(z)-7*z-n.e*canopyAt(z);
const homeY=(n,z)=>waterAt(z)+6+n.e*(bandAt(z)-12);
const LANETOP=26;
const roomXY=(r,z)=>{const w=waterAt(z)+bandAt(z),d=diveAt(z);
  return {x:r.u,y:w+LANETOP*Math.max(0.3,d)+r.v*(H-w-LANETOP-30)*d};};
const hubH=z=>22*z+92*hubAt(z);
const cellXY=(c,z)=>{const w=waterAt(z),hh=hubH(z);
  return {x:c.x,y:w-6-hh+((c.row+0.5)/c.rows)*(hh-4)};};

// ── the pods: the resident, and one per live strand ────────────────────────
function podFor(id,kind){
  let p=pods.find(p=>p.id===id);
  if(!p){p={id,kind,x:W/2,y:water-120,trail:[],target:null,fill:null,label:''};pods.push(p);}
  return p;
}
const resolveIn=(m,s)=>!s?null:(m.get(s)||[...m.keys()].filter(k=>k.startsWith(s+'/')).map(k=>m.get(k))[0]||null);
// the pod flies between the ranges: over the file it touched at z=1, over the
// island it is working in at altitude — one object, one trail, two readings.
function podXY(p,z){
  const w=waterAt(z), t=p.target;
  if(!t)return {x:p.x||W/2,y:w-110*z-46*(1-z)};
  if(t.cell){const c=cellXY(t.cell,z);return {x:c.x,y:c.y-15*podAt(z)};}
  if(t.home){const n=t.home;return {x:n.x,y:homeY(n,z)-10*podAt(z)};}
  const n=t.node;
  const near={x:n.x,y:treeY(n,z)-30*z-10};
  const far={x:(n.bough?n.bough.x:n.x),y:w-28-16*(1-z)};
  const k=clamp((1-z)/0.6,0,1), e=k*k*(3-2*k);
  return {x:near.x+(far.x-near.x)*e,y:near.y+(far.y-near.y)*e};
}
const aimAt=b=>{
  const n=resolveIn(byPath,(b.places||[])[0]);           if(n)return {node:n};
  const h=resolveIn(byHome,(b.home_places||[])[0]);      if(h)return {home:h};
  const c=hubRoomFor(b);                                 return c?{cell:c}:null;
};

function ingest(d){
  const first=!S;S=d;
  if(first||!nodes.length)layout();else layoutWarp(W*0.03,W*0.94);
  $('#src').textContent=`${d.repo||'local'} · live · ${rows(d.tree&&d.tree.repo).length} places · ${rows(d.tree&&d.tree.home).length} home · ${((d.warp&&d.warp.items)||[]).length} items`;
  const pod=podFor('resident','resident');
  pod.label=(d.run&&d.run.mood_glyph)||'b·_·d';
  pod.listening=/listen|await|held/.test((d.shuttle||{}).state||'');
  for(const b of (d.beads||[])){
    if(b.n<=seenBead)continue;seenBead=b.n;
    const aim=aimAt(b);
    const room=((b.items||[])[0]&&byItem.get((b.items||[])[0]))||null;
    if(aim)pod.target=aim;
    const o=podXY(pod,CAM.z);
    pings.push({u:o.x/W,v:(o.y-waterAt(CAM.z))/H,aim,room,born:performance.now(),
                act:b.act,kind:b.place_kind,detail:b.detail||''});
  }
  // §3: listening ⇒ the resident stands at its listening station in the shed
  if(pod.listening&&hubBy.get('shed'))pod.target={cell:hubBy.get('shed')};
  const live=new Set();
  for(const s of ((d.hud||{}).strands||[])){
    if(s.status&&!/live|running|await/.test(s.status))continue;
    live.add(s.id);
    const sp=podFor(s.id,'strand');
    const n=resolveIn(byPath,(s.places||[])[0]);
    const cell=hubBy.get(s.last_place_kind)||hubBy.get('crew');
    sp.target=n?{node:n}:(cell?{cell}:sp.target);
    sp.fill=num(s.spent)&&num(s.allowance)&&s.allowance>0?clamp(s.spent/s.allowance,0,1):null;
    const tt=String(s.title||s.id), tag=tt.match(/\[([A-Z]+)\]/);
    sp.label=tag?tag[1].toLowerCase():(tt.split('—').pop()||tt).trim().slice(0,18);
    sp.strand=s;
  }
  pods=pods.filter(p=>p.kind!=='strand'||live.has(p.id));
  renderHud(d);
}

function renderHud(d){
  const sh=d.shuttle||{}, run=d.run||{}, last=(d.beads||[]).slice(-1)[0]||{};
  $('#state').innerHTML=`<div><span class=amber style="font-size:15px">${run.mood_glyph||'b·_·d'}</span> <span class=v>${sh.state||'unmeasured'}</span></div>`+
   `<div><span class=k>pod</span> <span class=v>${run.name||'—'}</span> · <span class=k>${run.core||''}</span></div>`+
   `<div><span class=k>last act</span> <span class=v>${last.act||'—'}</span> <span class=k>${last.place_kind||''}</span></div>`+
   `<div><span class=k>why</span> <span class=v>${sh.why||'—'}</span></div>`+
   `<div><span class=k>out</span> <span class=v>${((d.hud||{}).strands||[]).length}</span> <span class=k>strands</span></div>`;
  let vials=[];
  const f=(d.fuel&&d.fuel.buckets)||null;
  if(f){for(const b of f)for(const w of (b.windows||[]))vials.push({n:`${b.name} ${w.name}`,pct:w.pct_left,src:'feed'});}
  else{const chip=(d.hud&&d.hud.chip)||'';const m=chip.match(/q S(\d+)[^W]*W(\d+)/);
    if(m)vials=[{n:'session',pct:+m[1],src:'chip'},{n:'week',pct:+m[2],src:'chip'}];
    else vials=[{n:'fuel',pct:null,src:'none'}];}
  lastVials=vials;
  $('#belt').innerHTML=vials.map(v=>`<div class="vial ${num(v.pct)?'':'torn'}"><div class=h><i>${v.n}${v.src==='chip'?' · from the chip':''}</i><b style="color:${heat(v.pct)}">${num(v.pct)?v.pct+' %':'—'}</b></div><div class=bar><i style="width:${num(v.pct)?v.pct:100}%;background:${heat(v.pct)}"></i></div></div>`).join('');
  $('#legend').innerHTML=`<b>scroll / + − / 1 2 3</b> one camera — the canopy compresses onto its island, the island becomes a deck, the warp rises underneath<br><b>the home is the ground</b> · the repo is an island moored to it · the ship is moored at home<br><b>amber</b> warm, touched this week · <b>ice</b> his, and cold readings · <b>black</b> never visited · <b>◆</b> a door he can open, shut across the corridor it holds`;
}

// the seam: [FRAME] reads this for its chrome; [WORLD] is the only writer.
function worldHud(){
  const sh=(S&&S.shuttle)||{}, last=((S&&S.beads)||[]).slice(-1)[0]||{};
  const me=pods.find(p=>p.kind==='resident')||null;
  const where=p=>!p||!p.target?null:(p.target.cell?p.target.cell.k:(p.target.home?p.target.home.path:(p.target.node?p.target.node.path:null)));
  return {state:sh.state||null,why:sh.why||null,last:last.act||null,vials:lastVials,
    pod:me?{x:me.x,y:me.y,listening:!!me.listening,place:where(me)}:null,
    strands:pods.filter(p=>p.kind==='strand').map(p=>({id:p.id,label:p.label,place:where(p),fill:p.fill})),
    doors:rooms.filter(r=>r.lane===0).length,shut:corridors.filter(c=>c.shut).length,
    rooms:rooms.length,dark:rooms.filter(r=>r.lit===null).length,
    island:island?island.label:null,ground:ground?ground.roots.map(r=>r.top):[],
    z:CAM.z,range:RANGE(CAM.z),say:RANGE_SAY[RANGE(CAM.z)]};
}

// ── drawWorld's scene. [FRAME] decides where it lands; [WORLD] what is in it. ─
let lastStep=-1;
function drawScene(x,now){
  // [FRAME] may hand this several contexts in one tick (buffers, a post-pass).
  // State advances on the first call of a tick only; every call draws.
  const step=(now!==lastStep); if(step){lastStep=now;tickCam();}
  const z=CAM.z; water=waterAt(z);
  const band=bandAt(z), dv=diveAt(z), rs=roomAt(z), ho=hubAt(z);
  const dtx=deckAt(z), txt=clamp((rs-0.45)/0.33,0,1);   // deck names at mid, room names at the schematic
  const g=x.createLinearGradient(0,water-180,0,H);
  g.addColorStop(0,'#07060400');g.addColorStop(0.55,`rgba(10,10,16,${0.30+0.70*z})`);
  g.addColorStop(1,`rgba(5,6,11,${0.40+0.60*z})`);
  x.fillStyle=g;x.fillRect(0,water-180,W,H-water+180);
  x.font=`10px ${MONO}`;

  // ── the warp, in the dark under the ground ───────────────────────────────
  for(const dk of decks){
    if(dk.anchor){                    // the tether: drawn only where it is measured
      x.strokeStyle=`rgba(242,177,52,${0.04+0.16*(1-z)})`;x.lineWidth=0.7;
      x.beginPath();x.moveTo(dk.anchor.x,water+band*0.4);
      x.bezierCurveTo(dk.anchor.x,water+band+8,dk.x,water+band+2,dk.x,water+band+11);x.stroke();
    }
    const dh=water+band+10;
    x.strokeStyle=`rgba(143,211,255,${0.05+0.22*(1-z)})`;x.lineWidth=1;
    x.beginPath();x.moveTo(dk.x-dk.w/2+4,dh);x.lineTo(dk.x+dk.w/2-4,dh);x.stroke();
    if(dtx>0.02){
      x.globalAlpha=dtx;x.textAlign='center';x.fillStyle=dk.anchor?'#8a7c5e':'#4a4336';
      x.fillText(`${dk.rune} ${dk.slug} · ${dk.n}${dk.anchor?'':' · no files measured'}`,dk.x,dh+11);
      x.textAlign='left';x.globalAlpha=1;
    }
  }
  if(dtx>0.02&&decks.length){        // the lane rails: the depth axis, said out loud
    x.globalAlpha=dtx*0.85;x.font=`9px ${MONO}`;
    const top=water+band;
    for(let li=0;li<LANES.length;li++){
      const y=top+LANETOP*Math.max(0.3,dv)+((li+0.04)/LANES.length)*(H-top-LANETOP-30)*dv;
      x.strokeStyle='rgba(90,77,60,0.22)';x.lineWidth=.6;
      x.beginPath();x.moveTo(W*0.03,y);x.lineTo(W*0.97,y);x.stroke();
      x.fillStyle=li===0?'#5c7f96':'#4a4336';x.fillText(LANES[li].label,W*0.03+3,y-3);
    }
    x.globalAlpha=1;x.font=`10px ${MONO}`;
  }
  for(const c of corridors){         // the 10 real `needs` edges, and their doors
    const p=roomXY(c.a,z), q=roomXY(c.b,z), mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    x.strokeStyle=c.shut?(c.ice?`rgba(143,211,255,${0.10+0.45*dv})`:`rgba(90,77,60,${0.08+0.30*dv})`)
                        :`rgba(242,177,52,${0.06+0.28*dv})`;
    x.lineWidth=c.shut?1.1:0.8;
    if(c.shut)x.setLineDash([3,3]);
    x.beginPath();x.moveTo(p.x,p.y);x.bezierCurveTo(p.x,my,q.x,my,q.x,q.y);x.stroke();x.setLineDash([]);
    if(c.shut&&rs>0.2){
      const s=5*rs+1.6;
      x.save();x.translate(mx,my);x.rotate(Math.PI/4);
      x.strokeStyle=c.ice?I:'#6b5f47';x.lineWidth=1.2;x.strokeRect(-s,-s,s*2,s*2);
      if(c.ice){x.fillStyle='rgba(143,211,255,0.14)';x.fillRect(-s,-s,s*2,s*2);}
      x.restore();
    }
  }
  for(const r of rooms){
    const {x:rx,y:ry}=roomXY(r,z);
    const w=Math.max(2.4,r.rw*rs), h=Math.max(2.4,r.rh*rs);
    const warm=r.lit, dark=warm===null, behind=!!r.gated;
    let stroke, fill=null;
    if(dark)stroke=behind?'rgba(43,35,24,0.55)':'rgba(70,60,44,0.75)';
    else{stroke=heat(20+warm*70);fill=`rgba(242,177,52,${0.05+0.13*warm})`;}
    if(r.lane===0&&r.it.state==='ready')stroke=(behind||r.opens.length)?I:'rgba(143,211,255,0.55)';
    if(fill){x.fillStyle=fill;x.fillRect(rx-w/2,ry-h/2,w,h);}
    x.strokeStyle=stroke;x.lineWidth=r.lane===0?1:0.7;x.strokeRect(rx-w/2,ry-h/2,w,h);
    if(warm!==null&&r.fp&&rs>0.3){   // footprints: the runs' own passes through this room
      x.fillStyle=`rgba(242,177,52,${0.25+0.4*warm})`;
      for(let i=0;i<Math.min(r.fp,8);i++)x.fillRect(rx-w/2+2+i*3,ry+h/2-2.5,1.6,1.6);
    }
    if(txt>0.03){
      x.globalAlpha=txt*(dark?0.6:1);
      x.fillStyle=r.lane===0?'#bfe2f8':(dark?'#5f5642':'#d9cba9');
      x.font=`${Math.max(8,Math.min(10,9*rs+3))}px ${MONO}`;
      x.save();x.beginPath();x.rect(rx-w/2,ry-h/2,w-1,h);x.clip();
      x.fillText(`${r.it.id} ${r.it.title||''}`,rx-w/2+2,ry+3);x.restore();
      if(r.opens.length&&rs>0.55){x.fillStyle='#5c7f96';x.font=`8px ${MONO}`;
        x.fillText(`opens ${r.opens.join(', ')}`,rx-w/2+2,ry+h/2+8);}
      x.globalAlpha=1;x.font=`10px ${MONO}`;
    }
  }
  if(z>0.62&&rooms.length){
    x.fillStyle='#4a6a80';x.font=`10px ${MONO}`;
    x.fillText(`${rooms.filter(r=>r.lane===0).length} doors below the ground — his · scroll to rise and read them`,W*0.06,water+band+24);
  }

  // ── the ground: the home, the shelf everything stands on ─────────────────
  if(ground){
    x.fillStyle=`rgba(14,12,9,${0.85})`;x.fillRect(0,water,W,band);
    x.strokeStyle='#2a2a3a';x.lineWidth=1;x.beginPath();x.moveTo(0,water);x.lineTo(W,water);x.stroke();
    x.strokeStyle=`rgba(58,48,32,${0.35+0.4*(1-z)})`;x.lineWidth=.8;
    x.beginPath();x.moveTo(0,water+band);x.lineTo(W,water+band);x.stroke();
    for(const n of homeNodes){
      const ny=homeY(n,z), a=n.up, hv=clamp(n.heat||0,0,1);
      x.strokeStyle=`rgba(110,94,64,${(0.10+hv*0.5)*(0.4+0.6*(1-z))})`;x.lineWidth=0.6;
      x.beginPath();x.moveTo(n.x,ny);
      if(a)x.bezierCurveTo(n.x,(ny+homeY(a,z))/2,a.x,(ny+homeY(a,z))/2,a.x,homeY(a,z));
      else x.lineTo(n.x,water+2);
      x.stroke();
      const lum=hv+n.flare, rr=Math.max(0.8,n.r*(0.5+0.5*(1-z)));
      if(lum>0.02){x.save();x.globalCompositeOperation='lighter';
        const R=rr+12*lum,rg=x.createRadialGradient(n.x,ny,0,n.x,ny,R);
        rg.addColorStop(0,`rgba(242,177,52,${0.28*lum+n.flare*0.5})`);rg.addColorStop(1,'rgba(242,177,52,0)');
        x.fillStyle=rg;x.beginPath();x.arc(n.x,ny,R,0,7);x.fill();x.restore();}
      x.fillStyle=lum>0.02?A:'#2b2318';x.globalAlpha=lum>0.02?clamp(0.35+lum,0,1):0.5;
      x.beginPath();x.arc(n.x,ny,rr,0,7);x.fill();x.globalAlpha=1;
      if(step)n.flare*=0.955;
    }
    if(band>28){
      x.font=`9px ${MONO}`;x.textAlign='center';x.globalAlpha=clamp((band-28)/20,0,1);
      for(const r of ground.roots){x.fillStyle='#5f5642';x.fillText(`${r.top} · ${r.n}`,r.x,water+15);}
      x.fillStyle='#4a4336';x.textAlign='left';
      x.fillText('the home — the ground the islands are moored into',W*0.03,water+band-4);
      x.globalAlpha=1;
    }
  }

  // ── the island: the repo, moored into the home ───────────────────────────
  if(island){
    const hw=island.w*0.5, hh=18*z+12*(1-z);
    x.fillStyle='#161208';x.beginPath();x.moveTo(island.x-hw,water);
    if(z>0.45)x.quadraticCurveTo(island.x,water-hh,island.x+hw,water);
    else{x.lineTo(island.x-hw*0.95,water-hh);x.lineTo(island.x+hw*0.95,water-hh);x.lineTo(island.x+hw,water);}
    x.closePath();x.fill();
    x.strokeStyle=`rgba(58,48,32,${0.7+0.3*(1-z)})`;x.lineWidth=.9;x.stroke();
    if(z<0.62){                       // the boughs name themselves once the canopy folds
      x.font=`9px ${MONO}`;x.textAlign='center';x.globalAlpha=clamp((0.62-z)/0.25,0,1);
      for(const b of island.boughs){if(b.w<b.top.length*6.6+10)continue;
        x.fillStyle='#4a4336';x.fillText(b.top,b.x,water-hh-4);}
      x.globalAlpha=1;
    }
    x.fillStyle='#8a7c5e';x.font=`10px ${MONO}`;x.textAlign='center';
    x.fillText(`${island.label} · ${island.n} of ${island.total} places`,island.x,water+12);x.textAlign='left';
  }

  // ── the canopy: it compresses onto its island; nothing fades out ─────────
  for(const n of nodes){
    const ny=treeY(n,z), hv=clamp(n.heat||0,0,1), a=n.up;
    x.strokeStyle=`rgba(110,94,64,${(0.12+hv*0.5)*(0.45+0.55*z)})`;x.lineWidth=(a?0.7:1.1)*(0.5+0.5*z);
    x.beginPath();x.moveTo(n.x,ny);
    if(a){const ay=treeY(a,z);x.bezierCurveTo(n.x,(ny+ay)/2,a.x,(ny+ay)/2,a.x,ay);}
    else x.bezierCurveTo(n.x,(ny+water)/2,n.x,(ny+water)/2,n.bough?n.bough.x:n.x,water-4);
    x.stroke();
    const rr=Math.max(0.7,n.r*(0.42+0.58*z)), lum=hv+n.flare;
    if(lum>0.02){x.save();x.globalCompositeOperation='lighter';
      const R=rr+14*lum*(0.4+0.6*z), rg=x.createRadialGradient(n.x,ny,0,n.x,ny,R);
      rg.addColorStop(0,`rgba(242,177,52,${0.30*lum+n.flare*0.5})`);rg.addColorStop(1,'rgba(242,177,52,0)');
      x.fillStyle=rg;x.beginPath();x.arc(n.x,ny,R,0,7);x.fill();x.restore();}
    x.fillStyle=lum>0.02?A:'#2b2318';x.globalAlpha=lum>0.02?clamp(0.35+lum,0,1):0.55;
    x.beginPath();x.arc(n.x,ny,rr,0,7);x.fill();x.globalAlpha=1;
    if(step)n.flare*=0.955;
  }

  // ── the mothership: moored over the home, the one fixed point ────────────
  if(hub){
    const hh=hubH(z), top=water-6-hh, hw=hub.w/2;
    x.fillStyle='#120e07';x.beginPath();
    x.moveTo(hub.x-hw,water);x.lineTo(hub.x-hw+9,top);x.lineTo(hub.x+hw-9,top);x.lineTo(hub.x+hw,water);
    x.closePath();x.fill();
    x.strokeStyle='rgba(122,104,72,0.85)';x.lineWidth=1;x.stroke();
    const me=pods.find(p=>p.kind==='resident');
    if(me&&me.listening){            // the tower: the seat watching the wire from the shed
      const sc=hubBy.get('shed');
      if(sc){x.strokeStyle='rgba(242,177,52,0.55)';x.lineWidth=1;
        x.beginPath();x.moveTo(sc.x,top);x.lineTo(sc.x,top-18-12*ho);x.stroke();
        x.fillStyle=A;x.beginPath();x.arc(sc.x,top-20-12*ho,2.4,0,7);x.fill();}
    }
    for(const c of hub.cells){
      const p=cellXY(c,z), cw=Math.max(3,c.cw*(0.2+0.8*ho)), ch=Math.max(3,(hh/c.rows-5)*(0.28+0.72*ho)), f=c.flare;
      x.strokeStyle=f>0.02?`rgba(242,177,52,${0.35+0.6*f})`:'rgba(90,77,60,0.45)';
      x.lineWidth=f>0.02?1.1:0.7;x.strokeRect(p.x-cw/2,p.y-ch/2,cw,ch);
      if(f>0.02){x.save();x.globalCompositeOperation='lighter';
        x.fillStyle=`rgba(242,177,52,${0.16*f})`;x.fillRect(p.x-cw/2,p.y-ch/2,cw,ch);x.restore();}
      if(ho>0.10){
        x.globalAlpha=clamp((ho-0.08)/0.28,0,1);x.textAlign='center';
        x.fillStyle=f>0.02?'#e8dcc0':'#7a6c52';x.font=`9px ${MONO}`;x.fillText(c.k,p.x,p.y+2);
        if(ho>0.7&&ch>22){x.fillStyle='#4a4336';x.font=`8px ${MONO}`;x.fillText(c.say,p.x,p.y+11);}
        x.textAlign='left';x.globalAlpha=1;
      }
      if(step)c.flare*=0.96;
    }
    x.fillStyle='#8a7c5e';x.font=`10px ${MONO}`;x.textAlign='center';
    x.fillText('the hub · moored at home',hub.x,water+12);x.textAlign='left';
  }

  // ── pings: light leaves a pod only when a boundary landed ────────────────
  const PING=1700;
  pings=pings.filter(p=>{
    const k=(now-p.born)/PING;if(k>1.6)return false;
    const ox=p.u*W, oy=waterAt(z)+p.v*H, a=p.aim;
    const to=a&&a.node?{x:a.node.x,y:treeY(a.node,z)}
           :a&&a.home?{x:a.home.x,y:homeY(a.home,z)}
           :a&&a.cell?cellXY(a.cell,z)
           :p.room?roomXY(p.room,z):null;
    x.save();x.globalCompositeOperation='lighter';
    if(to){
      const e=clamp(k,0,1), px=ox+(to.x-ox)*e, py=oy+(to.y-oy)*e;
      x.strokeStyle=`rgba(242,177,52,${0.75*(1-e)})`;x.lineWidth=1.6;
      x.beginPath();x.moveTo(ox,oy);x.lineTo(px,py);x.stroke();
      x.fillStyle=`rgba(255,228,170,${1-e})`;x.beginPath();x.arc(px,py,3.4*(0.5+0.5*z),0,7);x.fill();
      if(e>=1&&!p.hit){p.hit=true;
        if(a&&a.node)a.node.flare=1;else if(a&&a.home)a.home.flare=1;else if(a&&a.cell)a.cell.flare=1;}
    }else{                           // no place, no room, no kind the feed could name: torn
      const e=clamp(k,0,1);
      for(let i=0;i<4;i++){const ang=hash(p.detail+i)*6.28, rr=40*e+i*4;
        x.strokeStyle=`rgba(242,177,52,${0.16*(1-e)})`;x.lineWidth=1;
        x.beginPath();x.arc(ox,oy,rr,ang,ang+0.5+hash(p.detail+'b'+i));x.stroke();}
    }
    x.restore();
    return true;
  });

  // ── the pods: [ACTOR] draws them, as tiled terminal faces ────────────────
  ACTOR.drawPods(x,z,step,now);
  drawSounder(x,z);
  ACTOR.panel(x,z,now);
}

// the depth sounder — the camera's own readout, in the world, because a
// continuous axis with no reading is a control a stranger cannot hold.
// [ACTOR] owns its body now: the three detents are marks on it.
function drawSounder(x,z){ACTOR.sounder(x,z);}

// ── the axis itself: wheel · + − · 1 2 3 · pinch. One control, no modes. ────
const zoom=f=>{CAM.tz=clamp(CAM.tz*f,ZMIN,ZMAX);ACTOR.camera.push(performance.now());};
addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*(e.ctrlKey?0.010:0.0018)));},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='=')zoom(1.18);
  else if(e.key==='-'||e.key==='_')zoom(1/1.18);
  else if(e.key==='1')ACTOR.camera.jump(ZMAX);
  else if(e.key==='2')ACTOR.camera.jump(0.46);
  else if(e.key==='3')ACTOR.camera.jump(ZMIN);
});
let pinch=null;
addEventListener('touchmove',e=>{
  if(e.touches.length!==2){pinch=null;return;}
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)zoom(d/pinch);pinch=d;e.preventDefault();
},{passive:false});
addEventListener('touchend',()=>{pinch=null;});
function tickCam(){ACTOR.camera.settle(performance.now());
  CAM.z+=(CAM.tz-CAM.z)*0.14;if(Math.abs(CAM.tz-CAM.z)<0.0008)CAM.z=CAM.tz;}

// ── the hand: hit-testing is the world's, at every altitude ────────────────
cv.addEventListener('mousemove',e=>{
  const z=CAM.z,h=$('#hover');let txt=null;
  const n=nodes.find(n=>Math.hypot(n.x-e.clientX,treeY(n,z)-e.clientY)<7);
  if(n)txt=`${n.path} · heat ${(n.heat||0).toFixed(2)} · ${n.knots||0} knots · last ${n.last||'—'}`;
  if(!txt){const hn=homeNodes.find(n=>Math.hypot(n.x-e.clientX,homeY(n,z)-e.clientY)<6);
    if(hn)txt=`home / ${hn.path} · ${hn.knots||0} knots · last ${hn.last||'—'}`;}
  if(!txt&&hub)for(const c of hub.cells){
    const p=cellXY(c,z);
    if(Math.abs(p.x-e.clientX)<c.cw/2&&Math.abs(p.y-e.clientY)<Math.max(6,hubH(z)/c.rows/2)){
      txt=`${c.k} — ${c.say}\nthe fixed room every placeless act of this kind lands in`;break;}
  }
  if(!txt){
    const rs=roomAt(z);
    for(const r of rooms){
      const {x:rx,y:ry}=roomXY(r,z), w=Math.max(6,r.rw*rs)/2, hh=Math.max(6,r.rh*rs)/2;
      if(Math.abs(rx-e.clientX)<=w&&Math.abs(ry-e.clientY)<=hh){
        txt=`${r.it.id} · ${r.it.title||''}\n${r.it.type} · ${r.it.state} · ${r.deck.slug}`
          +(r.opens.length?` · opens ${r.opens.join(', ')}`:'')
          +(r.it.visited_at?`\nvisited ${r.it.visited_at} · ${r.fp} footprints`:'\nnever visited')
          +(r.gated?` · behind the door ${r.gated.it.id} holds`:'');break;
      }
    }
  }
  if(txt){h.style.display='block';h.style.left=(e.clientX+12)+'px';h.style.top=(e.clientY+12)+'px';
    h.style.whiteSpace='pre';h.textContent=txt;}
  else h.style.display='none';
});

// ═══ [ACTOR] ═══════════════════════════════════════════════════════════════
// The camera's rest, the pod's face, and the room a hand can choose.
//
// THE FENCE, AND WHY IT IS HERE: this block was dispatched as a stub already
// standing in the file. It was not in `2aac813b` (field6 = field5 + a title),
// so it is written here as one contiguous region inside [WORLD], and every
// line it needed outside itself is listed in the report under *Crossings*.
//
// The seam, as named by the dispatch — the only things another hand may assume:
//   ACTOR.camera.detent(z) → {z,k,key}   the nearest rest on the one axis
//   ACTOR.camera.settle(now)             called from tickCam; eases tz to rest
//   ACTOR.camera.push(now)               "a hand is on the wheel right now"
//   ACTOR.drawPods(g,z,step,now)         every pod, as a tiled terminal face
//   ACTOR.sounder(g,z)                   the depth sounder, with the detents on it
//   ACTOR.panel(g,z,now)                 what is selected, and the verb offered
//   ACTOR.select.room(r) / .deck(d) / .clear() / .at(px,py,z)
//   SELECTED = {kind,id,slug,chosen:Set}  — the shared selection, by ID, so a
//     feed refresh that rebuilds `rooms` cannot drop what a hand had chosen.
// Nothing here writes to the feed, the corridors, the cloth, or the console.

const SELECTED={kind:null,id:null,slug:null,chosen:new Set(),hint:null,open:null};
// the offer's own rectangle, published by panel() each frame so the hand can
// reach it: a verb only the keyboard can press is a verb nobody finds
const BTN={on:false,x:0,y:0,w:0,h:0};
const BENCH={scroll:0,total:0,fit:0};
const inBtn=(px,py)=>BTN.on&&px>=BTN.x&&px<=BTN.x+BTN.w&&py>=BTN.y&&py<=BTN.y+BTN.h;
window.SELECTED=SELECTED;                 // the seam, reachable from a console

// ── 1 · the camera rests, it does not switch ───────────────────────────────
// The maintainer asked for three states and doubted his own ask. He was right
// to: a mode is a thing a stranger has to be told. So the axis stays exactly
// the continuous function it was, and gains three places it comes to rest —
// the wheel eases into the nearest once the hand stops, `1`/`2`/`3` jump, and
// scrolling straight through a detent is never caught by it.
const DETENTS=[{z:ZMAX,k:'interior',key:'1'},{z:0.46,k:'mid',key:'2'},{z:ZMIN,k:'schematic',key:'3'}];
const SETTLE_MS=180;                      // hand off the wheel this long ⇒ it rests
const CAMST={last:0,ease:false,jump:false};
const nearestDetent=z=>DETENTS.reduce((b,d)=>Math.abs(d.z-z)<Math.abs(b.z-z)?d:b,DETENTS[0]);
const atRest=z=>Math.abs(nearestDetent(z).z-z)<0.012;

const ACTOR={
  camera:{
    detent:nearestDetent,
    push(now){CAMST.last=now;CAMST.ease=false;CAMST.jump=false;},   // a hand on the wheel
    jump(z){CAM.tz=z;CAMST.jump=true;CAMST.ease=false;CAMST.last=0;},
    settle(now){
      if(CAMST.jump)return;
      if(!CAMST.last||now-CAMST.last<SETTLE_MS)return;
      const d=nearestDetent(CAM.tz);
      if(Math.abs(d.z-CAM.tz)<0.0015){CAM.tz=d.z;CAMST.last=0;CAMST.ease=false;return;}
      CAMST.ease=true;
      CAM.tz+=(d.z-CAM.tz)*0.16;          // the ease: visible, ~0.4 s, never a snap
    },
    state(){const d=nearestDetent(CAM.z);
      return {detent:d,resting:atRest(CAM.z),easing:CAMST.ease,range:RANGE(CAM.z)};},
  },

// ── 2 · the actor: a tiled terminal face ───────────────────────────────────
// The pod was an ellipse, which is the least characterful object we could have
// picked for the one object on screen that is the product. It is now a cell
// grid in the loom's own ink, carrying `run.mood_glyph` — `b` and `d` are the
// headphone cups, the three middle cells are the face.
//
// What animates it, and what does NOT: a cell retypes when its CHARACTER
// changes, the way a terminal repaints one cell — inverted for ~110 ms, then
// the new glyph, staggered 40 ms per column. A change comes from one of two
// readings: the feed handing down a new `mood_glyph`, or the keyframe step.
// The keyframe step rides the daemon's own ~10 s heartbeat — the same beat the
// sonar rings already draw — so nothing here is on a decorative timer.
//
// The keyframes: `run.mood_frames` if the feed ever carries it (emotes.py has
// it already: `sequences_of(mood)`, base → expression → base). It does not
// today, so the second frame is DERIVED — the eye cells blink `·`/`°` → `-`,
// which is the one motion the emote vocabulary itself uses for half its faces.
// That is motion, not a reading, and it is the only invented thing in here.
  BEAT:10000, RETYPE:110, STAGGER:40,
  frames(pod,run){
    const g=pod.glyphNow||'b·_·d';
    const fed=run&&Array.isArray(run.mood_frames)&&run.mood_frames.length?run.mood_frames:null;
    if(fed)return {list:fed.map(s=>Array.from(String(s))),src:'feed'};
    const base=Array.from(g);
    // no glyph in the feed ⇒ no invented motion either: the frame stands still
    if(!pod.glyphFed)return {list:[base],src:'unfed'};
    const blink=base.map((c,i)=>(i>0&&i<base.length-1&&(c==='·'||c==='°'))?'-':c);
    const same=blink.join('')===base.join('');
    return {list:same?[base]:[base,blink],src:same?'still':'derived'};
  },
  face(pod,now,run){
    if(!pod.face)pod.face={cells:[],want:'',fi:0,src:''};
    const f=pod.face, fr=this.frames(pod,run);
    f.src=fr.src;
    // the keyframe step rides the beat the feed carries — the face blinks when
    // the daemon ticks. No tick in sight ⇒ the page's own 10 s constant, which
    // is the debt the sonar already had and this halves.
    const ph=this.sweep.phase(now), on=ph===null?((now%this.BEAT)/this.BEAT>0.94)
                                               :(now-BEAT.at<520);
    const fi=(fr.list.length>1&&on)?1:0;
    const want=fr.list[Math.min(fi,fr.list.length-1)];
    const key=want.join('');
    if(key!==f.want){
      const old=f.cells;
      f.cells=want.map((ch,i)=>{
        const o=old[i];
        return (o&&o.ch===ch)?o:{ch,prev:o?o.ch:ch,t0:now+i*ACTOR.STAGGER};
      });
      f.want=key;
    }
    return f;
  },
  // one pod, drawn as its grid. Returns nothing; the ink is [WORLD]'s.
  drawPod(g,p,z,now,run){
    const me=p.kind==='resident', sc=podAt(z)*(me?1:0.8);
    const f=this.face(p,now,run), n=Math.max(1,f.cells.length);
    const cw=Math.max(2.2,9.4*sc), ch=Math.max(2.6,12.4*sc);
    const gw=cw*n, gh=ch*(me?1:1);
    const x0=p.x-gw/2, y0=p.y-gh/2;
    const ink=me?A:'rgba(242,177,52,0.62)';
    const legible=cw>=5.2;                 // below this a glyph is a smudge, so
                                           // the face degrades to its lit cells
    if(me){                                // the resident carries its own light
      g.save();g.globalCompositeOperation='lighter';
      const rg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,26*sc);
      rg.addColorStop(0,'rgba(242,177,52,0.30)');rg.addColorStop(1,'rgba(242,177,52,0)');
      g.fillStyle=rg;g.beginPath();g.arc(p.x,p.y,26*sc,0,7);g.fill();g.restore();
    }
    // the glass the cells sit on — the hull, still a body, now a rectangle of it
    g.fillStyle='#0b0906';g.fillRect(x0-2,y0-2,gw+4,gh+4);
    g.strokeStyle=me?'rgba(242,177,52,0.75)':'rgba(242,177,52,0.42)';
    g.lineWidth=me?1.1:0.8;g.strokeRect(x0-2.5,y0-2.5,gw+5,gh+5);
    // a strand's hull still fills with what it has spent — the reading the
    // ellipse carried, kept: the fill rises through the cell grid itself.
    if(!me&&p.fill!=null){
      g.save();g.beginPath();g.rect(x0-2,y0-2,gw+4,gh+4);g.clip();
      g.fillStyle='rgba(242,177,52,0.20)';
      g.fillRect(x0-2,y0+gh+2-(gh+4)*p.fill,gw+4,(gh+4)*p.fill);g.restore();
    }
    g.textAlign='center';g.textBaseline='middle';
    g.font=`${Math.max(6,Math.round(ch*0.82))}px ${MONO}`;
    for(let i=0;i<n;i++){
      const c=f.cells[i], cx=x0+(i+0.5)*cw, cy=y0+gh/2;
      const head=(i===0||i===n-1);         // the headphone cups
      const t=now-c.t0, retyping=t>=0&&t<this.RETYPE;
      const shown=t<0?c.prev:c.ch;
      const lit=shown!==' '&&shown!=='·'&&shown!=='-';
      if(head){                            // the cup: a filled cell, dimmer ink
        g.fillStyle=me?'rgba(242,177,52,0.13)':'rgba(242,177,52,0.08)';
        g.fillRect(cx-cw/2+0.6,cy-ch/2+0.6,cw-1.2,ch-1.2);
      }
      if(legible&&i){                      // the cell wall: it is a GRID, and at
        g.strokeStyle=me?'rgba(242,177,52,0.22)':'rgba(242,177,52,0.14)';
        g.lineWidth=0.6;                   // 4x magnification the first read saw
        g.beginPath();g.moveTo(cx-cw/2,cy-ch/2+0.8);   // amber text in a box
        g.lineTo(cx-cw/2,cy+ch/2-0.8);g.stroke();
      }
      if(!legible){                        // schematic: a lit cell cluster
        if(lit||head){g.fillStyle=head?(me?'rgba(242,177,52,0.42)':'rgba(242,177,52,0.26)'):ink;
          g.fillRect(cx-cw/2+0.5,cy-ch/2+0.5,Math.max(1,cw-1),Math.max(1,ch-1));}
        continue;
      }
      if(retyping){                        // the cell repaints, terminal-style
        g.fillStyle=ink;g.fillRect(cx-cw/2+0.6,cy-ch/2+0.6,cw-1.2,ch-1.2);
        g.fillStyle='#0b0906';g.fillText(shown,cx,cy+0.5);
      }else{
        g.fillStyle=head?(me?'rgba(242,177,52,0.78)':'rgba(242,177,52,0.5)'):ink;
        g.fillText(shown,cx,cy+0.5);
      }
    }
    g.textBaseline='alphabetic';
    // the resident's label WAS its mood glyph — the face says it now, so the
    // name is not printed twice. A strand still names itself: its tag is the
    // only thing on screen that tells two of them apart.
    if(sc>0.5&&!me&&p.label){
      g.fillStyle='rgba(242,177,52,0.62)';g.font=`9px ${MONO}`;
      g.fillText(p.label,p.x,y0-7);
    }
    g.textAlign='left';
  },
  drawPods(g,z,step,now){
    const run=(S&&S.run)||{};
    if(step)this.sweep.poll(now);
    this.sweep.draw(g,z,now);
    for(const p of pods){
      const t=podXY(p,z), me=p.kind==='resident';
      if(step){p.x+=(t.x-p.x)*0.045;p.y+=(t.y-p.y)*0.045;}
      const fed=me?(run.mood_glyph||null):((p.strand&&(p.strand.mood_glyph||p.strand.glyph))||null);
      p.glyphFed=!!fed; p.glyphNow=fed||(me?'b·_·d':'b·:·d');
      if(me&&p.listening){               // the sonar: the daemon's real ~10 s beat
        g.save();g.globalCompositeOperation='lighter';
        const bp=this.sweep.phase(now);
        const ph=bp===null?(now%this.BEAT)/this.BEAT:bp, ps=podAt(z);
        for(const off of [0,0.34,0.68]){
          const e=(ph+off)%1, rr=(18+e*Math.min(W,H)*0.42)*ps;
          g.strokeStyle=`rgba(242,177,52,${0.20*(1-e)*(1-e)})`;g.lineWidth=1.4*(1-e)+0.3;
          g.beginPath();g.arc(p.x,p.y,rr,0,7);g.stroke();
        }
        g.restore();
      }
      this.drawPod(g,p,z,now,me?run:null);
    }
    this.readyPod(g,z,now);
  },
  // the staged pod: what a chosen room has waiting at the hub. Dashed, unlit,
  // never amber-filled — it has not been dispatched, and it must not read as if
  // it had. This is the whole reason the prototype exists.
  readyPod(g,z,now){
    if(!SELECTED.chosen.size)return;
    const cell=hubBy.get('crew');if(!cell)return;
    const sc=podAt(z)*0.85, n=5;
    const cw=Math.max(6.4,9.4*sc), ch=Math.max(9,12.4*sc), gw=cw*n;
    // above the ship's own roof — inside it, it sat across the cell labels and
    // read like one more lit room rather than something waiting to leave
    const p={x:cell.x,y:waterAt(z)-6-hubH(z)-26};
    const x0=p.x-gw/2, y0=p.y-ch/2;
    g.save();g.setLineDash([2,2]);
    g.strokeStyle='rgba(143,211,255,0.55)';g.lineWidth=0.9;
    g.strokeRect(x0-2.5,y0-2.5,gw+5,ch+5);
    // the cells themselves, empty: a hull with no light in it. At schematic the
    // glyph is below legibility and an empty dashed rectangle read as nothing —
    // the grid is what says "a pod, and nobody in it yet".
    g.strokeStyle='rgba(143,211,255,0.28)';g.lineWidth=0.6;
    for(let i=1;i<n;i++){g.beginPath();g.moveTo(x0+i*cw,y0);g.lineTo(x0+i*cw,y0+ch);g.stroke();}
    g.setLineDash([]);
    g.textAlign='center';g.textBaseline='middle';
    g.font=`${Math.max(6,Math.round(ch*0.82))}px ${MONO}`;
    g.fillStyle='rgba(143,211,255,0.60)';
    if(cw>=5.2)Array.from('b·_·d').forEach((c,i)=>g.fillText(c,x0+(i+0.5)*cw,y0+ch/2));
    g.textBaseline='alphabetic';
    g.font=`9px ${MONO}`;g.fillStyle='rgba(143,211,255,0.75)';
    g.fillText(`ready · ${[...SELECTED.chosen].join(' ')}`,p.x,y0-6);
    g.font=`8px ${MONO}`;g.fillStyle='#5c7f96';
    g.fillText('staged · no gate wired',p.x,y0-16);
    g.textAlign='left';g.restore();
  },

// ── 3 · the sounder, with the three rests marked on it ─────────────────────
  sounder(g,z){
    const bx=W-26, top=H*0.34, bot=H*0.78;   // clears the belt: at H*0.26
                                             // the 'interior' mark sat under the
                                             // fifth vial and could not be read
    const at=zz=>bot+(top-bot)*((zz-ZMIN)/(ZMAX-ZMIN));
    g.strokeStyle='rgba(90,77,60,0.35)';g.lineWidth=1;
    g.beginPath();g.moveTo(bx,top);g.lineTo(bx,bot);g.stroke();
    g.font=`9px ${MONO}`;g.textAlign='right';
    const st=this.camera.state();
    for(const d of DETENTS){
      const y=at(d.z), here=st.detent===d, rest=here&&st.resting;
      g.strokeStyle=rest?'rgba(242,177,52,0.85)':'rgba(90,77,60,0.55)';
      g.lineWidth=rest?1.4:1;
      g.beginPath();g.moveTo(bx-6,y);g.lineTo(bx+6,y);g.stroke();
      if(rest){g.fillStyle=A;g.fillRect(bx-2.5,y-2.5,5,5);}      // it is resting here
      else{g.strokeStyle='rgba(90,77,60,0.6)';g.strokeRect(bx-2.5,y-2.5,5,5);}
      g.fillStyle=rest?'#e8dcc0':(here?'#8a7c5e':'#4a4336');
      g.fillText(`${d.k} ${d.key}`,bx-10,y+3);
    }
    const y=at(clamp(z,ZMIN,ZMAX));
    g.fillStyle=A;g.beginPath();g.moveTo(bx+4,y);g.lineTo(bx+11,y-4);g.lineTo(bx+11,y+4);g.closePath();g.fill();
    if(!st.resting){                        // where it will come to rest, and why
      const ty=at(st.detent.z);
      g.strokeStyle='rgba(242,177,52,0.35)';g.lineWidth=1;g.setLineDash([2,3]);
      g.beginPath();g.moveTo(bx+14,y);g.lineTo(bx+14,ty);g.stroke();g.setLineDash([]);
      g.fillStyle='#8a7c5e';g.textAlign='left';
      g.fillText(st.easing?'resting →':'between',bx+18,(y+ty)/2+3);
    }
    g.textAlign='right';
    g.fillStyle='#8a7c5e';g.fillText(RANGE_SAY[RANGE(z)],W-40,H-16);g.textAlign='left';
  },

// ── 4 · the room a hand can choose, and the verb said honestly ─────────────
// A topic is a DECK and an item is a room on it (the maintainer's read), so
// both are selectable and a deck says its own state. The verb offered here
// fires nothing: there is no gate on this page. It stages, it marks, and it
// says which — a button that looks like it worked when it did nothing is the
// one failure this prototype exists to avoid.
  select:{
    room(r){if(!r)return;SELECTED.kind='room';SELECTED.id=r.it.id;SELECTED.slug=r.deck.slug;SELECTED.hint=null;
      if(SELECTED.open)ACTOR.bench.open(r.it.id);},
    deck(d){if(!d)return;SELECTED.kind='deck';SELECTED.slug=d.slug;SELECTED.id=null;SELECTED.hint=null;},
    clear(){SELECTED.kind=null;SELECTED.id=null;SELECTED.slug=null;SELECTED.hint=null;ACTOR.bench.close();},
    room_(){return SELECTED.id?byItem.get(SELECTED.id)||null:null;},
    deck_(){return SELECTED.slug?decks.find(d=>d.slug===SELECTED.slug)||null:null;},
    // what is under the hand: a room, else the deck whose column it is in
    at(px,py,z){
      const rs=roomAt(z);
      for(const r of rooms){
        const {x:rx,y:ry}=roomXY(r,z);
        const w=Math.max(7,r.rw*rs)/2, h=Math.max(7,r.rh*rs)/2;
        if(Math.abs(rx-px)<=w&&Math.abs(ry-py)<=h)return {room:r};
      }
      const top=waterAt(z)+bandAt(z);
      if(py>top+4)for(const d of decks)
        if(Math.abs(d.x-px)<=d.w/2)return {deck:d};
      return null;
    },
    // walking the deck: ← → along a lane, ↑ ↓ across the lanes, [ ] between decks
    walk(dx,dy){
      const r=this.room_();
      if(SELECTED.kind==='deck'||!r){
        const d=this.deck_()||decks[0];
        if(!d)return;
        if(dx){const i=decks.indexOf(d);this.deck(decks[(i+dx+decks.length)%decks.length]);}
        else if(dy>0){const l=d.lanes.find(l=>l.length);if(l)this.room(byItem.get(l[0].id));}
        return;
      }
      const same=rooms.filter(q=>q.deck===r.deck&&q.lane===r.lane).sort((a,b)=>a.u-b.u);
      if(dx){
        const i=same.indexOf(r), nx=i+dx;
        if(nx>=0&&nx<same.length)return this.room(same[nx]);
        // crossing to the next deck keeps the LANE — walking off the end of
        // "his ready decisions" and arriving in someone's done pile is a lie
        // about where you are standing (measured: ← from w-25/mine landed on
        // w-5/his). Same lane if it has rooms, else the nearest lane that does.
        const di=decks.indexOf(r.deck), nd=decks[(di+dx+decks.length)%decks.length];
        const on=l=>rooms.filter(q=>q.deck===nd&&q.lane===l).sort((a,b)=>a.u-b.u);
        let pool=on(r.lane);
        for(let d=1;!pool.length&&d<LANES.length;d++){
          pool=on(r.lane-d);if(!pool.length)pool=on(r.lane+d);
        }
        if(pool.length)return this.room(dx>0?pool[0]:pool[pool.length-1]);
        return;
      }
      if(dy){
        for(let l=r.lane+dy;l>=0&&l<LANES.length;l+=dy){
          const pool=rooms.filter(q=>q.deck===r.deck&&q.lane===l);
          if(pool.length)return this.room(pool.reduce((b,q)=>Math.abs(q.u-r.u)<Math.abs(b.u-r.u)?q:b));
        }
      }
    },
    // the offered verb. It stages an intent and says so; nothing is sent.
    choose(){
      const r=this.room_();if(!r)return false;
      if(SELECTED.chosen.has(r.it.id))SELECTED.chosen.delete(r.it.id);
      else SELECTED.chosen.add(r.it.id);
      return true;
    },
  },

  // the chosen rooms, marked in the world: a second outline, ice, never amber —
  // amber is what an act lit, and choosing is not an act yet.
  marks(g,z){
    const rs=roomAt(z);
    for(const id of SELECTED.chosen){
      const r=byItem.get(id);if(!r)continue;
      const {x:rx,y:ry}=roomXY(r,z);
      const w=Math.max(4,r.rw*rs), h=Math.max(4,r.rh*rs);
      g.save();g.setLineDash([2,2]);g.strokeStyle='rgba(143,211,255,0.8)';g.lineWidth=1;
      g.strokeRect(rx-w/2-3,ry-h/2-3,w+6,h+6);g.setLineDash([]);
      g.fillStyle='rgba(143,211,255,0.9)';g.fillRect(rx-w/2-3,ry-h/2-3,3,3);
      if(rs>0.35){g.font=`8px ${MONO}`;g.fillStyle='#8fd3ff';g.textAlign='center';
        g.fillText('chosen',rx,ry-h/2-6);g.textAlign='left';}
      g.restore();
      const cell=hubBy.get('crew');          // the tether: the ship holds it
      if(cell){const c=cellXY(cell,z);
        g.save();g.setLineDash([1,4]);g.strokeStyle='rgba(143,211,255,0.22)';g.lineWidth=0.8;
        g.beginPath();g.moveTo(c.x,c.y);g.bezierCurveTo(c.x,(c.y+ry)/2,rx,(c.y+ry)/2,rx,ry);
        g.stroke();g.restore();}
    }
    const sel=this.select.room_();
    if(sel){
      const {x:rx,y:ry}=roomXY(sel,z);
      const w=Math.max(4,sel.rw*rs), h=Math.max(4,sel.rh*rs);
      g.strokeStyle='rgba(232,220,192,0.9)';g.lineWidth=1.2;
      g.strokeRect(rx-w/2-1.5,ry-h/2-1.5,w+3,h+3);
      const t=6;                              // the corner ticks: this one
      for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        const px=rx+sx*(w/2+4), py=ry+sy*(h/2+4);
        g.beginPath();g.moveTo(px,py);g.lineTo(px-sx*t,py);g.moveTo(px,py);g.lineTo(px,py-sy*t);g.stroke();
      }
    }
    const dk=SELECTED.kind==='deck'?this.select.deck_():null;
    if(dk){
      const dh=waterAt(z)+bandAt(z)+10;
      g.strokeStyle='rgba(232,220,192,0.75)';g.lineWidth=1.4;
      g.beginPath();g.moveTo(dk.x-dk.w/2+4,dh);g.lineTo(dk.x+dk.w/2-4,dh);g.stroke();
      g.save();g.setLineDash([2,4]);g.strokeStyle='rgba(232,220,192,0.22)';g.lineWidth=0.7;
      for(const sx of [-1,1]){g.beginPath();g.moveTo(dk.x+sx*(dk.w/2-4),dh);
        g.lineTo(dk.x+sx*(dk.w/2-4),H-24);g.stroke();}
      g.restore();
    }
  },

// ── 5 · the panel: what is chosen, and what this page can honestly do ──────
  panel(g,z,now){
    this.marks(g,z);
    this.bench.draw(g,z,now);
    const rows=[];let head=null,foot=null;
    const r=this.select.room_(), dk=SELECTED.kind==='deck'?this.select.deck_():null;
    if(r){
      const it=r.it, staged=SELECTED.chosen.has(it.id);
      head=`ROOM ${it.id} · ${LANES[r.lane].k}`;
      rows.push(['*',it.title||'—']);     // '*' ⇒ the headline: it wraps, never cut
      rows.push(['type',`${it.type} · ${it.state}`]);
      rows.push(['deck',`${r.deck.rune||''} ${r.deck.slug}`]);
      rows.push(['opens',it.opens&&it.opens.length?it.opens.join(', ')
        :(r.opens.length?r.opens.join(', '):'nothing measured')]);
      if(r.gated)rows.push(['behind',`the door ${r.gated.it.id} holds`]);
      rows.push(['stake',it.stake==null?'not measured':String(it.stake)]);
      rows.push(['taken',it.taken==null?'—':String(it.taken)]);
      rows.push(['visited',it.visited_at?`${it.visited_at} · ${r.fp} footprints`:'never']);
      rows.push(['','⏎ opens the body']);
      foot=staged
        ?['CHOSEN — staged, nothing sent',
          `would dispatch: topic ${r.deck.slug} · item ${it.id}`,
          'no gate is wired on this page · d or click to unstage']
        :['d · click   dispatch brnrd here',
          'stages the intent · nothing is sent',
          'there is no gate wired on this page yet'];
    }else if(dk){
      const n=k=>dk.lanes[k].length;
      const lit=rooms.filter(q=>q.deck===dk&&q.lit!==null).length;
      head=`DECK ${dk.rune||''} ${dk.slug} · ${dk.n} rooms`;
      rows.push(['his',`${n(0)} ready decisions`]);
      rows.push(['mine',`${n(1)} ready work`]);
      rows.push(['held',String(n(2))]);
      rows.push(['done',String(n(3))]);
      rows.push(['warm',`${lit} touched this week · ${dk.n-lit} dark`]);
      rows.push(['anchor',dk.anchor?`${dk.anchor.n} files on the island`:'no files measured']);
      foot=['↓ or click a room','a topic is a deck · an item is a room on it'];
    }else{
      head='NOTHING CHOSEN';
      rows.push(['','click a room or a deck']);
      rows.push(['keys','← → along a lane · ↑ ↓ across lanes']);
      rows.push(['','[ ] between decks · ⏎ chooses · esc clears']);
      if(SELECTED.hint)rows.push(['',SELECTED.hint]);
    }
    const pw=360, px=W-16-pw;
    g.save();g.font=`10px ${MONO}`;
    const nlines=rows.reduce((n,[k,v])=>n+(k==='*'?wrapText(g,String(v),pw-20).length:1),0);
    g.restore();
    const ph=26+nlines*14+(foot?foot.length*13+12:0);
    const py=H-20-ph;
    g.save();
    g.fillStyle='#0b0906';g.fillRect(px,py,pw,ph);
    g.strokeStyle='rgba(154,133,94,0.30)';g.lineWidth=1;
    g.strokeRect(px+0.5,py+0.5,pw-1,ph-1);
    g.font=`10px ${MONO}`;g.fillStyle='#e8dcc0';
    g.fillText(head,px+10,py+16);
    g.strokeStyle='rgba(154,133,94,0.18)';
    g.beginPath();g.moveTo(px+10,py+21.5);g.lineTo(px+pw-10,py+21.5);g.stroke();
    let y=py+34;
    for(const [k,v] of rows){
      if(k==='*'){                      // the headline wraps — the one thing a
        g.fillStyle='#e8dcc0';          // human reads was the one thing cut
        for(const l of wrapText(g,String(v),pw-20)){g.fillText(l,px+10,y);y+=14;}
        continue;
      }
      if(k){g.fillStyle='#5a4d3c';g.fillText(k,px+10,y);}
      g.fillStyle=k?'#d9cba9':'#8a7c5e';
      const s=String(v), max=Math.floor((pw-(k?78:20))/5.9);
      g.fillText(s.length>max?s.slice(0,max-1)+'…':s,px+(k?72:10),y);
      y+=14;
    }
    BTN.on=false;
    if(foot){
      const staged=r&&SELECTED.chosen.has(r.it.id);
      y+=2;
      // a deck offers no verb, only a way down: amber is reserved for the offer
      g.strokeStyle=r?(staged?'rgba(143,211,255,0.55)':'rgba(242,177,52,0.45)')
                     :'rgba(154,133,94,0.30)';
      g.save();if(!staged&&r)g.setLineDash([3,2]);
      g.strokeRect(px+10.5,y-11.5,pw-21,foot.length*13+6);g.restore();
      if(r)Object.assign(BTN,{on:true,x:px+10.5,y:y-11.5,w:pw-21,h:foot.length*13+6});
      foot.forEach((t,i)=>{
        g.fillStyle=i===0?(staged?'#8fd3ff':A):'#5a4d3c';
        g.font=`${i===0?10:9}px ${MONO}`;g.fillText(t,px+16,y+i*13);
      });
    }
    g.restore();
  },
};

// ── 6 · the ship's sweep: echography, on the daemon's own beat ─────────────
// The phosphor lights what the resident TOUCHED — that is a trace, and a trace
// only ever shows you where you have already been. Duskers' echography reveals
// structure you did not have. There is a true sweep on this page and it is not
// the pod's: the daemon's heartbeat, which the feed carries as `shuttle.tick`
// (measured on the live daemon: one step every ~10-12 s).
//
// So: a ring leaves the SHIP when the tick advances, and what comes back is
// what that frame actually read. The law, kept:
//   · a field the feed does not carry returns NOTHING — the room stays black.
//   · a field that reads empty returns a DARK echo with its number ("nothing
//     armed" is a reading; an unlit room with no echo is an absence).
//   · a reading that says failure comes back TORN — the hatch, first used here
//     for something operational.
// And it must not be mistakable for the pod's ping: the pod throws an amber
// line at one place when a boundary landed; the ship throws ice rings at every
// room it can hear, on the beat. Same law, two bodies.
const BEAT={tick:null,at:0,stamp:null,period:null,n:0};
const SWEEP_MS=1700, ECHO_MS=2600;
const full=S=>(S&&S.hud&&S.hud.full)||null;
const numOr=(v,d)=>num(v)?v:d;
// each row: the hub room, and the one reading the frame can answer for it
const RETURNS=[
  {k:'clock',read:S=>{const f=full(S),a=f&&f.schedule&&f.schedule.armed;
    if(!Array.isArray(a))return null;                       // no field ⇒ no echo
    return {lit:a.length>0,say:a.length?`${a.length} armed`:'nothing armed'};}},
  {k:'belt',read:S=>{const f=full(S),q=f&&f.resources&&f.resources.quota;
    if(q&&q.status&&q.status!=='known')return {torn:true,say:'quota unread'};
    const b=q&&q.pacing&&q.pacing.binding_remaining_pct;
    if(num(b))return {lit:true,say:`${Math.round(b)} % binding`};
    const w=[].concat(...(((S.fuel||{}).buckets)||[]).map(x=>x.windows||[]))
              .filter(x=>num(x.pct_left));
    if(w.length){const m=w.reduce((a,x)=>x.pct_left<a.pct_left?x:a);
      return {lit:true,say:`${Math.round(m.pct_left)} % ${m.name}`};}
    return null;}},
  {k:'wire',read:S=>{const d=full(S)&&full(S).delivery;
    if(!d||d.known!==true)return null;                      // no poll ⇒ no echo
    return d.would_land?{lit:true,say:`${d.gate||'gate'} · would land`}
                       :{torn:true,say:`${d.gate||'gate'} · would not land`};}},
  {k:'shed',read:S=>{const f=full(S);if(!f)return null;
    const h=f.resource_hold;
    if(h){const r=numOr(h.refill_floor_pct,numOr((((f.resources||{}).quota||{}).pacing||{}).starvation
          &&f.resources.quota.pacing.starvation.refill_floor_pct,null));
      return {torn:true,say:`held · ${h.resume||'hold'}${num(r)?` · refill at ${r} %`:''}`};}
    const st=(((f.resources||{}).quota||{}).pacing||{}).starvation;
    if(st&&st.starved===true)return {torn:true,
      say:`starved · refill at ${numOr(st.refill_floor_pct,'—')} %`};
    return null;}},                                          // not held ⇒ nothing to say
  {k:'crew',read:S=>{const st=(S.hud||{}).strands;
    if(!Array.isArray(st))return null;
    return {lit:st.length>0,say:st.length?`${st.length} out`:'none out'};}},
];
ACTOR.sweep={
  // the beat is READ, not counted: the tick the feed carries is the daemon's.
  // Fired when this page SEES it advance, which is within one 3 s pull of the
  // real thing — the period below is measured between two sightings, never
  // assumed, and a feed whose tick never moves (a fixture) never sweeps.
  poll(now){
    const f=full(S);
    const t=S&&((S.shuttle&&S.shuttle.tick)||(f&&f.tick&&f.tick.n));
    if(!num(t))return;
    const stamp=Date.parse((f&&f.tick&&f.tick.at)||'')||null;
    if(BEAT.tick===null){BEAT.tick=t;BEAT.at=now;BEAT.stamp=stamp;return;}
    if(t===BEAT.tick)return;
    BEAT.period=(stamp&&BEAT.stamp&&stamp>BEAT.stamp)?(stamp-BEAT.stamp)
               :(BEAT.at?now-BEAT.at:null);
    BEAT.stamp=stamp;BEAT.tick=t;BEAT.at=now;BEAT.n++;
    for(const r of RETURNS){
      const cell=hubBy.get(r.k);if(!cell)continue;
      let got=null;try{got=r.read(S);}catch(e){got=null;}
      cell.echo=got?{...got,t0:now,cell}:null;               // null ⇒ silence, drawn as nothing
    }
  },
  phase(now){return BEAT.period?clamp((now-BEAT.at)/BEAT.period,0,1):null;},
  draw(g,z,now){
    if(!hub||!BEAT.at)return;
    const k=(now-BEAT.at)/SWEEP_MS;
    const ox=hub.x, oy=waterAt(z)-6-hubH(z)/2;
    if(k<1){                                    // the ring, leaving the ship
      g.save();g.globalCompositeOperation='lighter';
      for(const off of [0,0.13,0.26]){
        const e=k+off;if(e>1)continue;
        const rr=e*Math.hypot(W,H)*0.62;
        g.strokeStyle=`rgba(143,211,255,${0.20*(1-e)*(1-e)})`;g.lineWidth=1.2*(1-e)+0.3;
        g.beginPath();g.arc(ox,oy,rr,0,7);g.stroke();
      }
      g.restore();
      g.font=`9px ${MONO}`;g.fillStyle=`rgba(143,211,255,${0.7*(1-k)})`;g.textAlign='center';
      g.fillText(`sweep · tick ${BEAT.tick}${BEAT.period?` · +${(BEAT.period/1000).toFixed(1)} s`:''}`,
                 ox,oy-hubH(z)/2-30);
      g.textAlign='left';
    }
    for(const c of hub.cells){                  // and what came back
      const e=c.echo;if(!e)continue;
      const age=now-e.t0;if(age>ECHO_MS){c.echo=null;continue;}
      const p=cellXY(c,z), cw=Math.max(3,c.cw*(0.2+0.8*hubAt(z)));
      const ch=Math.max(3,(hubH(z)/c.rows-5)*(0.28+0.72*hubAt(z)));
      const a=1-age/ECHO_MS;
      if(e.torn){                               // a poll that came back wrong
        g.save();g.beginPath();g.rect(p.x-cw/2,p.y-ch/2,cw,ch);g.clip();
        g.strokeStyle=`rgba(143,211,255,${0.55*a})`;g.lineWidth=1;
        for(let hx=-ch;hx<cw+ch;hx+=6){g.beginPath();
          g.moveTo(p.x-cw/2+hx,p.y+ch/2);g.lineTo(p.x-cw/2+hx+ch,p.y-ch/2);g.stroke();}
        g.restore();
      }else if(e.lit){
        g.save();g.globalCompositeOperation='lighter';
        g.fillStyle=`rgba(143,211,255,${0.13*a})`;g.fillRect(p.x-cw/2,p.y-ch/2,cw,ch);g.restore();
      }
      g.strokeStyle=e.lit||e.torn?`rgba(143,211,255,${0.30+0.5*a})`:`rgba(143,211,255,${0.18*a})`;
      g.lineWidth=1;g.strokeRect(p.x-cw/2,p.y-ch/2,cw,ch);
      if(hubAt(z)>0.10&&e.say){                 // the reading itself, in the ship's ink
        g.font=`8px ${MONO}`;g.textAlign='center';
        g.fillStyle=e.torn?`rgba(143,211,255,${0.85*a})`
                  :(e.lit?`rgba(143,211,255,${0.8*a})`:`rgba(90,120,140,${0.75*a})`);
        g.fillText(e.say,p.x,p.y+ch/2-2);g.textAlign='left';
      }
    }
  },
};

// ── 7 · the bench: the room's own page, opened over the ground ─────────────
// The card is the HEADER of a chosen room. The maintainer's read: the one
// thing a human actually reads — the headline — was the one thing cut, and a
// sentence truncated mid-clause is worse than two lines. So the headline wraps
// here and everywhere, and `⏎` (or a second click) opens the body itself.
//
// The body is not invented and not a new feed field: the daemon already serves
// it at `/loom/page/item?id=<id>` (loom/pages.py → item_page) — title, type,
// state, prompt, metric, refs, the parsed body, and the siblings on the same
// topic. Same origin as state.json, with the same 7777 fallback FEEDS uses, so
// the dev page works when it is served from anywhere. One fetch per id, cached;
// a fetch that fails SAYS so in the panel instead of showing an empty page.
const PAGES=new Map();
const ITEM_URLS=id=>[`/loom/page/item?id=${encodeURIComponent(id)}`,
                     `http://127.0.0.1:7777/loom/page/item?id=${encodeURIComponent(id)}`];
// canvas has no flow: every long string on this page is wrapped by measuring it
function wrapText(g,text,maxw){
  const out=[];
  for(const para of String(text==null?'':text).split('\n')){
    if(!para.trim()){out.push('');continue;}
    let line='';
    for(const word of para.split(/\s+/)){
      const t=line?line+' '+word:word;
      if(g.measureText(t).width<=maxw){line=t;continue;}
      if(line)out.push(line);
      line=word;
      while(g.measureText(line).width>maxw&&line.length>1){   // a word longer than the pane
        let cut=line.length;
        while(cut>1&&g.measureText(line.slice(0,cut)).width>maxw)cut--;
        out.push(line.slice(0,cut));line=line.slice(cut);
      }
    }
    if(line)out.push(line);
  }
  return out;
}
// markdown, flattened for a canvas: headings and bullets keep their shape, the
// emphasis markers and link plumbing go — they are noise without a text engine
const flatten=t=>String(t||'')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1')
  .replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1')
  .replace(/^\s*[-*]\s+/gm,'· ');
ACTOR.bench={
  open(id){
    if(!id)return;SELECTED.open=id;
    if(PAGES.has(id))return;
    PAGES.set(id,{state:'loading'});
    (async()=>{
      for(const u of ITEM_URLS(id)){
        try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;
          const d=await r.json();PAGES.set(id,{state:'ok',d});return;}catch(e){}
      }
      PAGES.set(id,{state:'fail',why:'the daemon did not answer /loom/page/item'});
    })();
  },
  close(){SELECTED.open=null;BENCH.scroll=0;},
  scroll(d){BENCH.scroll=Math.max(0,BENCH.scroll+d);},
  draw(g,z,now){
    const id=SELECTED.open;if(!id)return;
    const pg=PAGES.get(id)||{state:'loading'};
    const x0=Math.round(W*0.055), x1=Math.round(W*0.64), w=x1-x0;
    const y0=Math.round(H*0.17), y1=Math.round(H*0.86), h=y1-y0;
    g.save();
    g.fillStyle='#090806';g.fillRect(x0,y0,w,h);
    g.strokeStyle='rgba(154,133,94,0.34)';g.lineWidth=1;g.strokeRect(x0+0.5,y0+0.5,w-1,h-1);
    // the bench's own corner ticks, so it reads as a surface, not a dialog
    for(const [sx,cx] of [[1,x0],[-1,x1]])for(const [sy,cy] of [[1,y0],[-1,y1]]){
      g.strokeStyle='rgba(154,133,94,0.55)';g.beginPath();
      g.moveTo(cx+sx*0.5,cy+sy*10);g.lineTo(cx+sx*0.5,cy+sy*0.5);g.lineTo(cx+sx*10,cy+sy*0.5);g.stroke();
    }
    // the phosphor composites with 'lighten': a translucent pane can never
    // hide a lit warp (7 % of it read straight through), and 135 characters
    // to a line is a wall. Opaque, and a readable column inside it.
    const pad=16, iw=Math.min(w-pad*2,660);let y=y0+24;
    const line=(t,ink,size,lead)=>{g.font=`${size}px ${MONO}`;g.fillStyle=ink;
      for(const l of wrapText(g,t,iw)){if(y>y1-10)return false;g.fillText(l,x0+pad,y);y+=lead;}return true;};
    g.font=`10px ${MONO}`;g.fillStyle='#5a4d3c';
    g.fillText(`${id} · the bench — esc closes · ↑ ↓ scrolls`,x0+pad,y);y+=18;
    if(pg.state==='loading'){line('reading the item page…','#8a7c5e',11,16);g.restore();return;}
    if(pg.state==='fail'){
      line('the body could not be read','#f2b134',12,17);
      line(pg.why||'no reason given','#8a7c5e',10,14);
      line(ITEM_URLS(id)[0],'#5a4d3c',9,13);
      g.restore();return;
    }
    const d=pg.d||{};
    line(d.title||'(no headline)','#e8dcc0',13,18);          // it WRAPS. That is the fix.
    y+=4;
    line(`${d.type||'—'} · ${d.state||'—'} · ${(d.topics||[]).join(', ')||'no topic'}`
       +(d.taken?` · taken ${d.taken}`:''),'#8a7c5e',10,15);
    y+=6;
    g.strokeStyle='rgba(154,133,94,0.18)';g.beginPath();
    g.moveTo(x0+pad,y-6);g.lineTo(x1-pad,y-6);g.stroke();
    // everything below the rule scrolls as one column
    const rows=[];
    const push=(t,ink,size,lead)=>rows.push({t,ink,size,lead});
    if(d.prompt)push(flatten(d.prompt),'#d9cba9',11,16);
    if(d.metric)push('metric · '+flatten(d.metric),'#8a7c5e',10,15);
    if(d.needs&&d.needs.length)push('needs '+d.needs.join(', '),'#8fd3ff',10,15);
    if(d.advances&&d.advances.length)push('advances '+d.advances.join(', '),'#8a7c5e',10,15);
    if(d.body){push('',null,10,8);
      for(const para of flatten(d.body).split('\n')){
        const head=/^#{1,6}\s/.test(para);
        push(para.replace(/^#{1,6}\s*/,''),head?'#e8dcc0':'#bfb094',head?11:10,head?17:15);
      }}
    if(d.refs)push('refs · '+flatten(d.refs),'#5a4d3c',9,13);
    if((d.siblings||[]).length){
      push('',null,10,8);push(`on this topic · ${d.siblings.length}`,'#5a4d3c',10,15);
      for(const sb of d.siblings.slice(0,8))
        push(`${sb.id}  ${sb.title||''}`,sb.state==='ready'?'#8fd3ff':'#5f5642',9,13);
    }
    // measure, then draw the window the scroll is standing at
    const lines=[];
    for(const r of rows){
      if(!r.ink){lines.push({t:'',ink:'#000',size:r.size,lead:r.lead});continue;}
      g.font=`${r.size}px ${MONO}`;
      for(const l of wrapText(g,r.t,iw))lines.push({t:l,ink:r.ink,size:r.size,lead:r.lead});
    }
    const room=y1-14-y, fit=Math.max(1,Math.floor(room/14));
    BENCH.total=lines.length;BENCH.fit=fit;
    BENCH.scroll=Math.min(BENCH.scroll,Math.max(0,lines.length-fit));
    for(const l of lines.slice(BENCH.scroll,BENCH.scroll+fit)){
      if(l.t){g.font=`${l.size}px ${MONO}`;g.fillStyle=l.ink;g.fillText(l.t,x0+pad,y);}
      y+=l.lead;
      if(y>y1-14)break;
    }
    if(lines.length>fit){
      g.font=`9px ${MONO}`;g.fillStyle='#5a4d3c';g.textAlign='right';
      g.fillText(`${BENCH.scroll+1}–${Math.min(lines.length,BENCH.scroll+fit)} of ${lines.length} lines · ↑ ↓`,
                 x1-pad,y1-6);g.textAlign='left';
      const t0=y0+30, th=(y1-12)-t0, kh=Math.max(14,th*fit/lines.length);
      const ky=t0+(th-kh)*(BENCH.scroll/Math.max(1,lines.length-fit));
      g.strokeStyle='rgba(154,133,94,0.20)';g.strokeRect(x1-7.5,t0,3,th);
      g.fillStyle='rgba(242,177,52,0.45)';g.fillRect(x1-7,ky,2,kh);
    }
    g.restore();
  },
};

// the hand, and the keys. Additive listeners: the wheel/±/123 handlers above
// keep their own, and this block never rewrites them.
cv.addEventListener('mousedown',e=>{
  const z=CAM.z;
  if(inBtn(e.clientX,e.clientY)){ACTOR.select.choose();return;}   // the offer
  const hit=ACTOR.select.at(e.clientX,e.clientY,z);
  if(hit&&hit.room){
    if(SELECTED.kind==='room'&&SELECTED.id===hit.room.it.id)ACTOR.bench.open(SELECTED.id);
    else{ACTOR.bench.close();ACTOR.select.room(hit.room);}
  }
  else if(hit&&hit.deck)ACTOR.select.deck(hit.deck);
  else{ACTOR.select.clear();
    if(RANGE(z)==='interior')SELECTED.hint='the warp is under the ground — 2 or 3 to come down to it';}
});
cv.addEventListener('mousemove',e=>{
  if(inBtn(e.clientX,e.clientY)){cv.style.cursor='pointer';return;}
  const h=ACTOR.select.at(e.clientX,e.clientY,CAM.z);
  cv.style.cursor=h&&h.room?'pointer':(h?'crosshair':'default');
});
addEventListener('keydown',e=>{
  const k=e.key;
  if(SELECTED.open&&(k==='ArrowUp'||k==='ArrowDown')){      // the bench scrolls
    e.preventDefault();ACTOR.bench.scroll(k==='ArrowDown'?3:-3);return;}
  if(k==='Enter'){e.preventDefault();
    if(SELECTED.open)ACTOR.bench.close();else ACTOR.bench.open(SELECTED.id);return;}
  if(k==='d'||k==='D'){ACTOR.select.choose();return;}       // the verb, off ⏎
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();ACTOR.select.walk(k==='ArrowRight'?1:-1,0);}
  else if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();ACTOR.select.walk(0,k==='ArrowDown'?1:-1);}
  else if(k==='['||k===']'){e.preventDefault();
    const d=ACTOR.select.deck_()||decks[0];if(d){const i=decks.indexOf(d);
      ACTOR.select.deck(decks[(i+(k===']'?1:-1)+decks.length)%decks.length]);}}
