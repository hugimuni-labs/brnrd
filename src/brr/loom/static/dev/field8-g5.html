<!doctype html>
<meta charset="utf-8">
<title>field 8 · g5 — the room answers</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0a;color:#bdb9ae;font:12px/1.35 ui-monospace,Menlo,monospace;overflow:hidden}
canvas{display:block}

</style>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="plaque"></div>
<div id="dimmer"></div>
<div id="win"></div>
<div id="search">/ <input id="q" placeholder="a heddle you have not kept"></div>
<div id="legend">solid = in the world · dashed = HUD
amber = a visit, decaying · ice = your hand · black = never visited
drag · wheel · 1 2 3 zoom · f follow · t trail · click or hjkl/arrows to a room · o open it · / search · esc</div>
<script>
// ---------- field 8 · g1 · the walk ----------
// roast of g0: routes hugged street outlines and read as highlight boxes · the drone teleported, so a
// boundary landing looked like nothing · signs collided on narrow fog streets · the home column outgrew
// the repo · the deck was a stub with no stations to stand on.
// roast of g4: a boundary landing moved the drone but the ROOM did nothing — the place that was just
// touched had no moment; fog streets at real scale were black plains that read as emptiness rather
// than as 146 unvisited things; the only way to move the selection was the mouse.
// g5: a new bead pings its room — a ring on the beat from the room, not from the drone · a fog street
// carries its count as a faint dot texture (a silhouette with mass) · arrows / hjkl walk the selection
// room to room along the street, Enter opens · `/` search driven and shot.
// roast of g3: `o` opened every file at line 1 — the drone had just read lines 4650–4690 and the window
// showed the module docstring; the ground stayed bright under the window (§12: an inspection belongs
// in a window and the water dims); the plaque said "mutate" three times and never which lines.
// g4: the beads' chunks (#2011) are indexed per room · a room's plaque lists what this run read and
// wrote, by line · `o` opens the file AT the last chunk, with a reading-heat strip beside the text
// (read = amber, write = ice) · the ground dims while a window is open.
// roast of g2: the corridors read, but the phosphor wake LIED — it was sampled from animation frames,
// so on a slow frame (headless chromium, a busy tab) it drew chords straight through walls; and every
// route began at a room's centre, so a worn path stabbed into the middle of unvisited rooms · the
// hops had direction but no order.
// g3: the wake is sampled along the route's own vertices (it can only ever draw where the corridor is)
// and resets on a teleport instead of bridging it · routes meet a room at its door (top edge), only the
// drone stands inside · hops are numbered at interior zoom · the plaque's `o` was driven and shot.
// roast of g1: the walk is there but the corridors are not DRAWN — a worn route along a street's top
// gutter and left spine traces the street's outline, so wear still reads as a highlight box · at
// schematic zoom the drone is a speck you have to hunt for · `open` on the plaque did nothing.
// g2: gutters are corridor floor, drawn; a sub-street's spine meets its gutter through a DOOR (a gap
// in the wall) · the drone carries dashed HUD hairlines when far out — never lost, law 3 · a click
// fetches the loom's own place page: knots, the forge link, and `o` opens the text in a window.
// g1: wear is footprints (dashed), the run's trail carries direction ticks · the drone WALKS its route,
// one hop per beat, with a phosphor wake · labels only where they fit · room rows squarer · the deck is a
// street of eight stations and a drone doing shell work stands on one · `f` follows the drone.
// law 1 one ground · law 2 light is a visit · law 3 a drone is never lost
// law 4 rooms don't move: the layout is a function of the whole tree (fixtures/tree.json),
//        the fog only lifts — nothing moves when a room is first seen
// streets: a directory is a spine (its corridor) with a sign; files are rooms in rows
//        beside it; subdirectories are streets off it. a walk = a route along spines.
const FEEDS=['/loom/state.json','http://127.0.0.1:7791/loom/state.json','http://127.0.0.1:7777/loom/state.json'];
const TREE='/loom/dev/fixtures/tree.json';
const U=10,G=4,SP=6,SIGN=11;          // room unit · gutter · spine width · sign height · rooms per row
const AMBER='#f0a020',ICE='#8fd0ff',BG='#0b0b0a';
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const hud=document.getElementById('hud'),plaque=document.getElementById('plaque'),srch=document.getElementById('search'),q=document.getElementById('q');
let W=0,H=0,DPR=1,FOLLOW=false,TRAIL=true; const CAM={x:0,y:0,z:1,tz:1,tx:0,ty:0};
let firstIngest=true,PAGE=null,S=null,T=null,ROOT=null,BY=new Map(),ALL=[],SEL=null,QUERY='',seen=-1,beatAt=0,BEAT=600;
const drones=new Map(); const trail=[]; const wear=new Map(); const pings=[]; /* {node,t} */ const CHUNKS=new Map(); /* path → [{from,to,kind,n}] this run */

// ---------- tree ----------
function buildTree(files,rootName,rootPath){
  const root={name:rootName,path:rootPath,dir:true,dirs:[],files:[],depth:0};
  const dirs=new Map([[rootPath,root]]);
  const dirFor=p=>{ if(dirs.has(p))return dirs.get(p); const i=p.lastIndexOf('/'); const parent=dirFor(i<0?rootPath:p.slice(0,i));
    const n={name:p.slice(i+1),path:p,dir:true,dirs:[],files:[],parent,depth:parent.depth+1}; parent.dirs.push(n); dirs.set(p,n); return n; };
  for(const f of files){ const i=f.lastIndexOf('/'); const parent=dirFor(i<0?rootPath:f.slice(0,i));
    parent.files.push({name:f.slice(i+1),path:f,dir:false,parent,depth:parent.depth+1}); }
  for(const d of dirs.values()){ d.dirs.sort((a,b)=>a.name<b.name?-1:1); d.files.sort((a,b)=>a.name<b.name?-1:1); }
  return root;
}
// layout a street: returns {w,h}; children get x,y relative to the street's top-left
function layoutDir(n){
  let y=SIGN+G, x0=SP+G, w=x0, x=x0;
  const ROWMAX=Math.max(6,Math.min(16,Math.ceil(Math.sqrt(n.files.length*1.7))));
  for(const f of n.files){ if(x+U>x0+ROWMAX*(U+G)){x=x0;y+=U+G;} f.x=x;f.y=y;f.w=U;f.h=U; x+=U+G; w=Math.max(w,x); }
  if(n.files.length) y+=U+G;
  const kids=n.dirs.map(d=>(layoutDir(d),d));
  let area=0; for(const d of kids) area+=d.w*d.h;
  const limit=Math.max(6*(U+G)+x0, ...kids.map(d=>d.w+x0), Math.sqrt(area)*1.35+x0);
  x=x0; let shelf=0;
  for(const d of kids){ if(x+d.w>limit&&x>x0){x=x0;y+=shelf+G;shelf=0;} d.x=x;d.y=y; x+=d.w+G; shelf=Math.max(shelf,d.h); w=Math.max(w,x); }
  if(kids.length) y+=shelf+G;
  n.w=Math.max(w,SP+G+U*2)+G; n.h=y+G; n.count=n.files.length+kids.reduce((a,d)=>a+d.count,0);
  return n;
}
function place(n,ox,oy){ n.ax=ox+(n.x||0); n.ay=oy+(n.y||0); ALL.push(n); BY.set(n.path,n);
  if(n.dir){ for(const f of n.files)place(f,n.ax,n.ay); for(const d of n.dirs)place(d,n.ax,n.ay); } }

async function loadTree(){
  T=await (await fetch(TREE,{cache:'no-store'})).json();
  const repo=layoutDir(buildTree(T.repo.files,T.repo.name,'')); repo.island='repo';
  const home=layoutDir(buildTree(T.home.files,'home','~')); home.island='home';
  // moor: home on the left, the deck between, the repo on the right; both signs on one shore line
  const deck=layoutDir(buildTree(['shed','forge','wire','crew','clock','belt','pack','archive'].map(s=>s),'the deck','@deck')); deck.island='deck';
  deck.files.sort((a,b)=>['shed','forge','wire','crew','clock','belt','pack','archive'].indexOf(a.name)-['shed','forge','wire','crew','clock','belt','pack','archive'].indexOf(b.name));
  home.x=0;home.y=0; deck.x=home.w+40; deck.y=0; repo.x=deck.x+deck.w+40; repo.y=0;
  ROOT={home,repo,deck};
  ALL=[];BY=new Map(); place(home,0,0); place(deck,0,0); place(repo,0,0);
  for(const st of deck.files)BY.set('@'+st.name,st);
  ROOT.w=repo.x+repo.w; ROOT.h=Math.max(home.h,repo.h);
  fitAll();
}
// ---------- light ----------
function lightFrom(d){
  for(const n of ALL){n.heat=0;n.last=null;n.knots=0;n.lines=n.lines;}
  const put=(rows,prefix)=>{ for(const r of rows||[]){ const n=BY.get(prefix+r.path); if(!n)continue; n.heat=Math.max(n.heat,r.heat||0); n.last=r.last; n.knots=r.knots||0; if(r.lines)n.lines=r.lines; if(r.topics&&r.topics.length)n.topics=r.topics; } };
  put(d.tree&&d.tree.repo,''); put(d.tree&&d.tree.home&&d.tree.home.places,'');
  // a street is as lit as its brightest room; the fog lifts on the whole street
  const up=n=>{ if(!n.dir)return n.heat; let m=n.heat; for(const f of n.files)m=Math.max(m,f.heat); for(const c of n.dirs)m=Math.max(m,up(c)); n.lit=m; n.litCount=n.files.filter(f=>f.heat>0).length+n.dirs.reduce((a,c)=>a+c.litCount,0); return m; };
  up(ROOT.home); up(ROOT.repo);
}
// ---------- routes: a walk goes to the spine, up the street, out the door ----------
const spineX=n=>n.ax+SP/2, signY=n=>n.ay+SIGN/2, gutterY=n=>n.ay-G/2;
// a room's point is its middle; a street's point is on its sign — a drone in a directory stands in its corridor, not among its rooms
const center=n=>n.dir?[n.ax+SP+G+Math.min(18,n.w*0.25),signY(n)]:[n.ax+n.w/2,n.ay+n.h/2];
const door=n=>n.dir?center(n):[n.ax+n.w/2,n.ay]; // a route meets a room at its door; the drone steps inside
function upPath(n){ // points from n's door up to its island root's sign
  const pts=[door(n)]; let cur=n;
  while(cur.parent){ const P=cur.parent; pts.push([center(cur)[0],gutterY(cur)],[spineX(P),gutterY(cur)],[spineX(P),signY(P)]); cur=P; }
  return pts; // last point = root sign on the spine
}
function route(a,b){
  if(a===b)return [door(a)];
  const A=upPath(a), B=upPath(b);
  const rootOf=n=>{while(n.parent)n=n.parent;return n;};
  if(rootOf(a)!==rootOf(b)){ // island to island: up to the root sign, out to the shore, along it, and in
    const R=B.slice().reverse(); return [...A,[A[A.length-1][0],-G*2],[R[0][0],-G*2],...R];
  }
  // same island: climb until the streets meet
  const chainA=[a],chainB=[b]; for(let n=a;n.parent;n=n.parent)chainA.push(n.parent); for(let n=b;n.parent;n=n.parent)chainB.push(n.parent);
  let lca=null; for(const n of chainA)if(chainB.includes(n)){lca=n;break;}
  const upTo=(n,stop)=>{ const pts=[door(n)]; let cur=n; while(cur!==stop&&cur.parent){ const P=cur.parent; pts.push([center(cur)[0],gutterY(cur)],[spineX(P),gutterY(cur)]); if(P===stop)break; pts.push([spineX(P),signY(P)]); cur=P; } return pts; };
  const pa=upTo(a,lca), pb=upTo(b,lca).reverse();
  if(a===lca)return [door(a),[spineX(lca),door(a)[1]],...pb.slice(0)];
  if(b===lca)return [...pa,[spineX(lca),door(b)[1]],door(b)];
  return [...pa,...pb];
}
// ---------- feed ----------
function resolvePlace(b){ for(const p of b.places||[]){const n=BY.get(p);if(n)return n;} for(const p of b.home_places||[]){const n=BY.get(p);if(n)return n;} return null; }
function ingest(d){
  S=d; BEAT=d.beat_ms||600; lightFrom(d);
  // the resident's walk: every bead with a place, in order; the deck when it is not at a file
  const beads=d.beads||[]; let last=null;
  for(const b of beads){ if(b.n<=seen)continue; seen=b.n;
    for(const c of b.chunks||[]){ const key=c.rel||c.path; if(!key)continue; if(!CHUNKS.has(key))CHUNKS.set(key,[]); CHUNKS.get(key).push({from:c.from,to:c.to,kind:c.kind,changed:c.changed,n:b.n,at:b.at}); } const n=resolvePlace(b)||BY.get('@'+b.place_kind)||(b.place_kind==='file'||b.place_kind==='home'?null:BY.get('@shed'));
    if(!n)continue; if(seen>0&&!firstIngest)pings.push({node:n,t:performance.now()}); if(last&&last.node===n)continue; trail.push({node:n,at:b.at,act:b.act,n:b.n}); last=trail[trail.length-1]; }
  firstIngest=false;
  if(trail.length>60)trail.splice(0,trail.length-60);
  // the drone walks: every new hop is a route it has to travel, one hop per beat
  const me=trail[trail.length-1]; let R=drones.get('resident');
  if(!R){ R={node:me?me.node:BY.get('@shed'),at:me?center(me.node):center(BY.get('@shed')),queue:[],seg:null,glyph:'b·_·d',wake:[]}; drones.set('resident',R); R.walked=trail.length; }
  R.state=d.shuttle&&d.shuttle.state; R.run=d.run&&d.run.id;
  for(let i=Math.max(1,R.walked);i<trail.length;i++) R.queue.push(route(trail[i-1].node,trail[i].node)); R.walked=trail.length;
  if(me&&R.queue.length===0&&!R.seg&&R.node!==me.node){R.node=me.node;R.at=center(me.node);R.wake=[];}
  for(const s of (d.hud&&d.hud.strands)||[]){ if(!s.id)continue; const p=(s.places||[])[0]; const n=(p&&BY.get(p))||BY.get('@crew'); drones.set(s.id,{node:n,at:center(n),state:s.state,run:s.id,glyph:'b·w·d',strand:true,queue:[],wake:[]}); }
  // wear: the week's worn corridors, from every finished run's trail (newest first in the feed)
  wear.clear();
  for(const r of (d.cloth&&d.cloth.rows)||[]){ const seq=(r.trail||[]).slice().reverse().map(t=>BY.get(t.path)).filter(Boolean);
    for(let i=1;i<seq.length;i++){ const pts=route(seq[i-1],seq[i]); for(let k=1;k<pts.length;k++){ const key=pts[k-1].join(',')+'|'+pts[k].join(','); wear.set(key,(wear.get(key)||0)+1); } } }
}
async function pull(){ for(const u of FEEDS){ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok)continue; ingest(await r.json()); return; }catch(e){} } }
// ---------- camera ----------
function resize(){ DPR=devicePixelRatio||1; W=innerWidth;H=innerHeight; cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'; }
function fitAll(){ if(!ROOT)return; const z=Math.min((W-80)/ROOT.w,(H-120)/ROOT.h); CAM.tz=z; CAM.tx=(W-ROOT.w*z)/2; CAM.ty=(H-ROOT.h*z)/2+20; }
function fitLit(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false; for(const n of ALL){ if(!n.dir&&n.heat>0){any=true;x0=Math.min(x0,n.ax);y0=Math.min(y0,n.ay);x1=Math.max(x1,n.ax+n.w);y1=Math.max(y1,n.ay+n.h);} }
  if(!any)return fitAll(); const z=Math.min((W-120)/(x1-x0),(H-160)/(y1-y0),4); CAM.tz=z; CAM.tx=(W-(x0+x1)*z)/2; CAM.ty=(H-(y0+y1)*z)/2; }
function zoomOn(n,z){ const [x,y]=center(n); CAM.tz=z; CAM.tx=W/2-x*z; CAM.ty=H/2-y*z; }
const toWorld=(sx,sy)=>[(sx-CAM.x)/CAM.z,(sy-CAM.y)/CAM.z];
let drag=null;
cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,cx:CAM.tx,cy:CAM.ty,moved:false};};
onmousemove=e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true; CAM.tx=drag.cx+dx;CAM.ty=drag.cy+dy;CAM.x=CAM.tx;CAM.y=CAM.ty; };
onmouseup=e=>{ if(drag&&!drag.moved)click(e.clientX,e.clientY); drag=null; };
cv.onwheel=e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015); const [wx,wy]=toWorld(e.clientX,e.clientY); const z=Math.max(0.05,Math.min(12,CAM.tz*f)); CAM.tz=z; CAM.tx=e.clientX-wx*z; CAM.ty=e.clientY-wy*z; };
onkeydown=e=>{ if(e.target===q){ if(e.key==='Escape'){q.value='';QUERY='';srch.style.display='none';q.blur();} if(e.key==='Enter')q.blur(); return; }
  if(e.key==='1')fitAll(); if(e.key==='2')fitLit(); if(e.key==='3'){const me=drones.get('resident'); zoomOn(me?me.node:BY.get('@shed'),6);} if(e.key==='f'){FOLLOW=!FOLLOW;} if(e.key==='t'){TRAIL=!TRAIL;} 
  if(e.key==='/'){e.preventDefault();srch.style.display='block';q.focus();} if(e.key==='Escape'){ if(win.style.display==='block'){win.style.display='none';dimmer.style.display='none';} else {SEL=null;plaque.style.display='none';} } if(e.key==='o'||e.key==='Enter')openWin();
  const dir={ArrowLeft:[-1,0],h:[-1,0],ArrowRight:[1,0],l:[1,0],ArrowUp:[0,-1],k:[0,-1],ArrowDown:[0,1],j:[0,1]}[e.key];
  if(dir){ e.preventDefault(); walk(dir); } };
// walk the selection: the nearest room or street in that direction, along this street first, then anywhere
function walk([dx,dy]){ const from=SEL||(drones.get('resident')&&drones.get('resident').node); if(!from){ const first=ALL.find(n=>!n.dir&&n.heat>0)||ALL.find(n=>!n.dir); if(first)selectNode(first); return; } const [fx,fy]=center(from); let best=null,bd=1e18;
  for(const n of ALL){ if(n===from||(n.dir&&n.depth===0))continue; if(n.dir&&!(n.lit>0)&&n.depth>1)continue; const [x,y]=center(n); const vx=x-fx,vy=y-fy; const along=vx*dx+vy*dy; if(along<=0.5)continue; const across=Math.abs(vx*dy-vy*dx); const d=along+across*3+(n.parent===from.parent?0:300)+(rootOf2(n)===rootOf2(from)?0:5000); /* a step stays on the street when it can, never leaves the island by accident */ if(d<bd){bd=d;best=n;} }
  if(best){ selectNode(best); const [x,y]=center(best); if(x*CAM.z+CAM.x<60||x*CAM.z+CAM.x>W-60||y*CAM.z+CAM.y<80||y*CAM.z+CAM.y>H-80){ CAM.tx=W/2-x*CAM.z; CAM.ty=H/2-y*CAM.z; } } }
q.oninput=()=>{QUERY=q.value.trim().toLowerCase();};
function click(sx,sy){ const [x,y]=toWorld(sx,sy); let hit=null; let _sel=null;
  for(const n of ALL){ if(n.dir)continue; if(x>=n.ax&&x<=n.ax+n.w&&y>=n.ay&&y<=n.ay+n.h){hit=n;break;} }
  if(!hit){ let best=null; for(const n of ALL){ if(!n.dir)continue; if(x>=n.ax&&x<=n.ax+n.w&&y>=n.ay&&y<=n.ay+n.h&&(!best||n.depth>best.depth))best=n; } hit=best; }
  selectNode(hit); }
function selectNode(hit){ SEL=hit; if(!hit){plaque.style.display='none';return;}
  const rows=[`<b>${hit.path||hit.name}</b>`];
  if(hit.dir)rows.push(`street · ${hit.count} things · ${hit.litCount||0} lit`); else rows.push(hit.heat>0?`lit ${(hit.heat*100).toFixed(0)}% · last ${hit.last||'?'} · ${hit.knots||0} knots${hit.lines?' · '+hit.lines+' lines':''}`:'never visited');
  const visits=trail.filter(t=>t.node===hit); if(visits.length)rows.push(`this run: ${visits.map(v=>v.act).join(' → ')}`);
  const ch=CHUNKS.get(hit.path)||[]; if(ch.length){ const fmt=c=>c.from?`:${c.from}–${c.to}`:(c.changed?' whole':''); rows.push(`read ${ch.filter(c=>c.kind==='read').map(fmt).join(' ')||'—'} · wrote ${ch.filter(c=>c.kind!=='read').map(fmt).join(' ')||'—'}`); }
  rows.push(hit.dir?'dispatch here — not wired: the verb is offered, never faked':'<b>o</b> open the file here · dispatch here — not wired');
  plaque.innerHTML=rows.join('\n'); plaque.style.display='block';
  if(!hit.dir&&hit.parent&&rootOf2(hit)===ROOT.repo) fetch(`/loom/page/place?path=${encodeURIComponent(hit.path)}`,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(pg=>{ if(!pg||SEL!==hit)return; PAGE=pg;
    rows.splice(rows.length-1,0,`knots ${pg.knots} · <a href="${pg.gh_url}" target="_blank">on the forge ↗</a>${pg.text?` · ${pg.text.total} lines`:''}`); plaque.innerHTML=rows.join('\n'); }).catch(()=>{});
}
const rootOf2=n=>{while(n.parent)n=n.parent;return n;};
const win=document.getElementById('win');
const dimmer=document.getElementById('dimmer');
function openWin(){ if(!SEL||SEL.dir)return; const ch=CHUNKS.get(SEL.path)||[]; const lastC=[...ch].reverse().find(c=>c.from);
  const from=lastC?Math.max(1,lastC.from-12):1, to=lastC?lastC.to+28:200;
  fetch(`/loom/page/place?path=${encodeURIComponent(SEL.path)}&from=${from}&to=${to}`,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(pg=>{ if(!pg||!pg.text)return; const t=pg.text; const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const lines=(t.text||'').split('\n'); const mark=ln=>{ let r=false,w=false; for(const c of ch){ if(c.from&&ln>=c.from&&ln<=c.to){ if(c.kind==='read')r=true; else w=true; } } return r&&w?'rw':r?'rd':w?'wr':''; };
    const body=lines.map((L,i)=>{ const ln=t.from+i; const m=mark(ln); return `<span class="ln">${ln}</span><span class="${m}">${esc(L)}</span>`; }).join('\n');
    win.innerHTML=`<b>${pg.path}</b>  lines ${t.from}–${t.to} of ${t.total} · ${lastC?`opened at the last chunk this run ${lastC.kind} (:${lastC.from}–${lastC.to})`:'no chunk this run — from the top'} · <span class="rd"> read </span> <span class="wr"> wrote </span> · esc\n\n`+body;
    win.style.display='block'; dimmer.style.display='block'; }).catch(()=>{}); }
// ---------- draw ----------
function heatColor(h,a=1){ return `rgba(240,160,32,${(0.18+0.82*h)*a})`; }
function matches(n){ return !QUERY||n.path.toLowerCase().includes(QUERY); }
function drawStreet(n,z){
  const dim=QUERY&&!matches(n)&&!n.dirs.some(matches)&&!n.files.some(matches)?0.25:1;
  if(!(n.lit>0)){ // fog: the black silhouette of a street nobody walked
    cx.fillStyle='#0e0e0d'; cx.fillRect(n.ax,n.ay,n.w,n.h); cx.strokeStyle=`rgba(70,68,62,${0.5*dim})`; cx.lineWidth=1/z; cx.strokeRect(n.ax,n.ay,n.w,n.h);
    if(z>0.35){ // the silhouette has mass: one faint dot per thing, packed, never a room
      const dots=Math.min(n.count,400), cols=Math.max(1,Math.floor((n.w-SP-G*2)/3)); cx.fillStyle=`rgba(70,68,62,${0.55*dim})`;
      for(let i=0;i<dots;i++){ const dx=n.ax+SP+G+(i%cols)*3, dy=n.ay+SIGN+G+Math.floor(i/cols)*3; if(dy>n.ay+n.h-G)break; cx.fillRect(dx,dy,1.2,1.2); } }
    if(z*n.w>70){ cx.save(); cx.beginPath(); cx.rect(n.ax,n.ay,n.w,SIGN); cx.clip(); cx.fillStyle=`rgba(90,88,80,${dim})`; cx.font=`${Math.max(9/z,3)}px ui-monospace,Menlo,monospace`; cx.fillText(`${n.name}/ · ${n.count}`,n.ax+3,n.ay+SIGN-3); cx.restore(); }
    return;
  }
  cx.fillStyle='#111110'; cx.fillRect(n.ax,n.ay,n.w,n.h);
  cx.strokeStyle=`rgba(120,116,104,${0.7*dim})`; cx.lineWidth=1/z; cx.strokeRect(n.ax,n.ay,n.w,n.h);
  // spine + sign: the corridor you walk
  cx.fillStyle=`rgba(40,39,36,${dim})`; cx.fillRect(n.ax,n.ay,SP,n.h); cx.fillRect(n.ax,n.ay,n.w,SIGN);
  if(n.heat>0){ cx.fillStyle=heatColor(n.heat,0.55*dim); cx.fillRect(n.ax,n.ay,n.w,SIGN); } // the street itself was visited (a directory read)
  cx.save(); cx.beginPath(); cx.rect(n.ax,n.ay,n.w,SIGN); cx.clip();
  if(z*n.w>24){ cx.fillStyle=`rgba(200,195,180,${dim})`; cx.font=`${Math.max(8.5/z,2.5)}px ui-monospace,Menlo,monospace`; cx.fillText(`${n.name}/`,n.ax+SP+2,n.ay+SIGN-3);
    if(z*n.w>90){ cx.fillStyle=`rgba(120,116,104,${dim})`; cx.textAlign='right'; cx.fillText(`${n.litCount}/${n.count} lit`,n.ax+n.w-3,n.ay+SIGN-3); cx.textAlign='left'; } }
  cx.restore();
  // corridor floor: every row gutter and shelf gutter, from the spine to the far wall
  cx.fillStyle=`rgba(34,33,30,${dim})`; const rowsY=new Set(); for(const f of n.files)rowsY.add(f.y); for(const d of n.dirs)rowsY.add(d.y);
  for(const ry of rowsY){ cx.fillRect(n.ax+SP,n.ay+ry-G,n.w-SP-G/2,G); }
  // doors: where a sub-street's spine meets the gutter, the wall is open
  for(const d of n.dirs){ if(!(d.lit>0))continue; cx.fillStyle=`rgba(34,33,30,${dim})`; cx.fillRect(n.ax+d.x,n.ay+d.y-G,SP,G+1.5); cx.strokeStyle=`rgba(143,208,255,${0.5*dim})`; cx.lineWidth=0.8/z; cx.beginPath(); cx.moveTo(n.ax+d.x+SP,n.ay+d.y); cx.lineTo(n.ax+d.x+SP,n.ay+d.y-G); cx.stroke(); }
  for(const f of n.files){ const m=matches(f)?1:(QUERY?0.2:1);
    if(f.heat>0){ cx.fillStyle=heatColor(f.heat,m*dim); cx.fillRect(f.ax,f.ay,f.w,f.h); }
    else { cx.fillStyle='#0b0b0a'; cx.fillRect(f.ax,f.ay,f.w,f.h); cx.strokeStyle=`rgba(60,58,52,${dim})`; cx.strokeRect(f.ax+.5/z,f.ay+.5/z,f.w-1/z,f.h-1/z); }
    if(z>3.2&&(f.heat>0||z>7)){ cx.fillStyle=f.heat>0?`rgba(20,16,8,${dim})`:`rgba(90,88,80,${dim})`; cx.font=`${Math.min(3.4,9/z)}px ui-monospace,Menlo,monospace`; cx.save(); cx.beginPath(); cx.rect(f.ax,f.ay,f.w,f.h); cx.clip(); cx.fillText(f.name,f.ax+1,f.ay+f.h-2.2); cx.restore(); }
  }
  for(const d of n.dirs)drawStreet(d,z);
  if(SEL&&(SEL===n)){ cx.strokeStyle=ICE; cx.lineWidth=1.5/z; cx.strokeRect(n.ax-1/z,n.ay-1/z,n.w+2/z,n.h+2/z); }
}
function poly(pts){ cx.beginPath(); pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])); cx.stroke(); }
function frame(now){
  CAM.z+=(CAM.tz-CAM.z)*0.18; CAM.x+=(CAM.tx-CAM.x)*0.18; CAM.y+=(CAM.ty-CAM.y)*0.18;
  cx.setTransform(DPR,0,0,DPR,0,0); cx.fillStyle=BG; cx.fillRect(0,0,W,H);
  if(!ROOT){ requestAnimationFrame(frame); return; }
  cx.setTransform(DPR*CAM.z,0,0,DPR*CAM.z,DPR*CAM.x,DPR*CAM.y); const z=CAM.z;
  // the shore: one line both islands moor to; nothing exists above it
  cx.strokeStyle='rgba(80,110,130,.5)'; cx.lineWidth=1/z; cx.setLineDash([4/z,4/z]); poly([[-20,-G*2],[ROOT.w+20,-G*2]]); cx.setLineDash([]);
  ROOT.deck.lit=1; drawStreet(ROOT.home,z); drawStreet(ROOT.deck,z); drawStreet(ROOT.repo,z);
  // wear: footprints — the week's walks as dashes, never a solid line
  cx.lineCap='butt'; cx.setLineDash([1.2/Math.sqrt(z),2.4/Math.sqrt(z)]);
  for(const [key,c] of wear){ const [a,b]=key.split('|').map(s=>s.split(',').map(Number)); cx.strokeStyle=`rgba(240,160,32,${Math.min(0.6,0.2+0.08*c)})`; cx.lineWidth=Math.min(2.4,1+c*0.2)/z; poly([a,b]); }
  cx.setLineDash([]);
  // this run's trail: solid, fading, with a tick at every hop pointing the way it went
  if(TRAIL)for(let i=1;i<trail.length;i++){ const age=(trail.length-i)/trail.length; const pts=route(trail[i-1].node,trail[i].node); cx.strokeStyle=`rgba(240,160,32,${0.12+0.6*(1-age)})`; cx.lineWidth=(1+1.2*(1-age))/z; poly(pts);
    const [px,py]=pts[pts.length-1], [qx,qy]=pts[pts.length-2]||pts[0]; const ang=Math.atan2(py-qy,px-qx), L=3.2/Math.sqrt(z);
    cx.beginPath(); cx.moveTo(px,py); cx.lineTo(px-L*Math.cos(ang-0.5),py-L*Math.sin(ang-0.5)); cx.moveTo(px,py); cx.lineTo(px-L*Math.cos(ang+0.5),py-L*Math.sin(ang+0.5)); cx.stroke();
    if(z>2.5){ cx.fillStyle=`rgba(240,160,32,${0.4+0.6*(1-age)})`; cx.font=`${Math.max(6/z,1.6)}px ui-monospace,Menlo,monospace`; cx.fillText(String(i),px+2/z,py-2/z); } }
  // a boundary landed here: the room rings on the beat, three beats, then quiet
  for(let i=pings.length-1;i>=0;i--){ const pg=pings[i]; const age=(now-pg.t)/(BEAT*3); if(age>1){pings.splice(i,1);continue;} const n=pg.node; const rr=(1-Math.pow(1-(age%0.3333)*3,2)); const pad=rr*10/Math.sqrt(z);
    cx.strokeStyle=`rgba(240,160,32,${0.9*(1-age)*(1-rr)})`; cx.lineWidth=1.4/z; cx.strokeRect(n.ax-pad,n.ay-pad,(n.dir?Math.min(n.w,60):n.w)+pad*2,(n.dir?SIGN:n.h)+pad*2); }
  // drones: never lost — and they walk. one hop per beat along the route, the wake drawn by the beat
  const pulse=(now%BEAT)/BEAT;
  for(const [id,d] of drones){
    if(!d.seg&&d.queue.length){ d.seg={pts:d.queue.shift(),t0:now,len:0}; for(let i=1;i<d.seg.pts.length;i++)d.seg.len+=Math.hypot(d.seg.pts[i][0]-d.seg.pts[i-1][0],d.seg.pts[i][1]-d.seg.pts[i-1][1]); }
    if(d.seg){ const dur=Math.max(BEAT,Math.min(BEAT*4,d.seg.len*4)); const u=Math.min(1,(now-d.seg.t0)/dur); const target=u*d.seg.len; let acc=0,pos=d.seg.pts[d.seg.pts.length-1];
      let vi=0; for(let i=1;i<d.seg.pts.length;i++){ const a=d.seg.pts[i-1],b=d.seg.pts[i],L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(acc+L>=target){ const k=L?(target-acc)/L:0; pos=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]; vi=i; break;} acc+=L; vi=i+1; }
      // the wake can only lie on the corridor: push every vertex passed since the last frame, then the head
      d.seg.vi=d.seg.vi||1; while(d.seg.vi<vi){ const v=d.seg.pts[d.seg.vi]; d.wake.push([v[0],v[1],now]); d.seg.vi++; }
      d.at=pos; if(u>=1){ d.seg=null; const last=trail[trail.length-1]; if(!d.strand&&last&&d.queue.length===0){ d.node=last.node; d.at=center(last.node); } } }
    d.wake.push([d.at[0],d.at[1],now]); if(d.wake.length>160)d.wake.shift();
    for(let i=1;i<d.wake.length;i++){ const a=d.wake[i-1],b=d.wake[i]; const age=(now-b[2])/2400; if(age>1)continue; cx.strokeStyle=`rgba(240,160,32,${0.7*(1-age)})`; cx.lineWidth=(2.4*(1-age)+0.4)/z; poly([a,b]); }
    if(FOLLOW&&!d.strand){ CAM.tx=W/2-d.at[0]*CAM.z; CAM.ty=H/2-d.at[1]*CAM.z; }
    const [x,y]=d.at; const r=(d.strand?3:4)/Math.sqrt(z);
    if(z<1.6&&!d.strand){ cx.setLineDash([3/z,5/z]); cx.strokeStyle='rgba(143,208,255,.45)'; cx.lineWidth=1/z; poly([[x,-40],[x,ROOT.h+40]]); poly([[-40,y],[ROOT.w+40,y]]); cx.setLineDash([]); }
    cx.strokeStyle=d.strand?'rgba(240,160,32,.6)':AMBER; cx.lineWidth=1.2/z; cx.beginPath(); cx.arc(x,y,r*(1+pulse*0.6),0,Math.PI*2); cx.globalAlpha=1-pulse; cx.stroke(); cx.globalAlpha=1;
    cx.fillStyle=BG; cx.fillRect(x-r*2.2,y-r*0.9,r*4.4,r*1.8); cx.strokeStyle=AMBER; cx.strokeRect(x-r*2.2,y-r*0.9,r*4.4,r*1.8);
    cx.fillStyle=AMBER; cx.font=`${r*1.4}px ui-monospace,Menlo,monospace`; cx.textAlign='center'; cx.fillText(d.glyph,x,y+r*0.5); cx.textAlign='left';
    if(z>1.5){ cx.fillStyle='rgba(240,160,32,.8)'; cx.font=`${Math.max(7/z,2)}px ui-monospace,Menlo,monospace`; cx.fillText(`${d.state||''} · ${d.seg?'walking':(d.node.path||d.node.name)}${d.queue.length?' · '+d.queue.length+' hops behind':''}`,x+r*2.6,y+r*0.4); }
  }
  if(SEL&&!SEL.dir){ cx.strokeStyle=ICE; cx.lineWidth=1.5/z; cx.strokeRect(SEL.ax-1.5/z,SEL.ay-1.5/z,SEL.w+3/z,SEL.h+3/z); }
  // HUD (dashed = over the world)
  const lit=ALL.filter(n=>!n.dir&&n.heat>0).length, rooms=ALL.filter(n=>!n.dir).length;
  const me=drones.get('resident'); const run=S&&S.run;
  hud.innerHTML=`<b>brnrd · field 8 · g5 · the room answers</b> — greybox, no art on purpose\n${rooms} rooms · ${lit} lit · ${ALL.filter(n=>n.dir).length} streets · tree ${T?T.captured_at:'…'}\n`+
    (run?`<b>${run.id}</b> · ${run.shell||''}/${run.core||''} · ${S.shuttle&&S.shuttle.state||''} · at <b>${me&&(me.node.path||me.node.name)||'the deck'}</b>${me&&me.seg?' (walking)':''}${FOLLOW?' · following':''} · ${trail.length} hops this run · ${wear.size} worn corridors`:'no feed');
  requestAnimationFrame(frame);
}
onresize=()=>{resize();};
resize(); loadTree().then(()=>{pull();setInterval(pull,3000);}); requestAnimationFrame(frame);
</script>
